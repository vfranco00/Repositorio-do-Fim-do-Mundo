<text x="222" y="500" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">PARA O LADO</text>
<text x="222" y="514" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">e para cima</text>
<text x="206" y="544" font-size="11" fill="#b3001b" font-weight="bold" text-anchor="start">NUNCA morro</text>
<text x="206" y="557" font-size="11" fill="#b3001b" font-weight="bold" text-anchor="start">abaixo</text>
<rect x="326" y="446" width="340" height="130" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="340" y="466" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">O que provoca deslizamento (evite):</text>
<text x="340" y="486" font-size="11.5" fill="#222" text-anchor="start">• corte reto no barranco para construir</text>
<text x="340" y="502" font-size="11.5" fill="#222" text-anchor="start">• aterro solto, lixo e entulho na encosta</text>
<text x="340" y="518" font-size="11.5" fill="#222" text-anchor="start">• água de chuva, pia e esgoto jogada no</text>
<text x="340" y="532" font-size="11.5" fill="#222" text-anchor="start">   morro (use calha e canaleta)</text>
<text x="340" y="548" font-size="11.5" fill="#222" text-anchor="start">• tirar o mato; bananeira na encosta</text>
<text x="340" y="564" font-size="11.5" fill="#222" text-anchor="start">   (encharca o solo)</text>
<rect x="14" y="588" width="652" height="46" rx="8" fill="#fdecec" stroke="#d62828" stroke-width="1.5"/>
<text x="28" y="607" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start">Chuva forte por horas ou vários dias + UM desses sinais = SAIA JÁ e avise</text>
<text x="28" y="625" font-size="12.5" fill="#222" text-anchor="start">os vizinhos. Volte só quando a chuva parar há dias e a Defesa Civil (199) liberar.</text>
</svg>
