<text x="490" y="66" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Rachaduras e degraus</text>
<text x="490" y="80" font-size="11.5" fill="#222" text-anchor="start">no chão, no alto ou no</text>
<text x="490" y="94" font-size="11.5" fill="#222" text-anchor="start">meio do morro</text>
<circle cx="472" cy="116" r="11" fill="#d62828" stroke="#fff" stroke-width="2"/><text x="472" y="121" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="490" y="120" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Árvores, postes, cercas</text>
<text x="490" y="134" font-size="11.5" fill="#222" text-anchor="start">e muros inclinando</text>
<circle cx="472" cy="156" r="11" fill="#d62828" stroke="#fff" stroke-width="2"/><text x="472" y="161" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="490" y="160" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Água barrenta minando</text>
<text x="490" y="174" font-size="11.5" fill="#222" text-anchor="start">do barranco; mina nova,</text>
<text x="490" y="188" font-size="11.5" fill="#222" text-anchor="start">ou que seca de repente</text>
<circle cx="472" cy="210" r="11" fill="#d62828" stroke="#fff" stroke-width="2"/><text x="472" y="215" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
<text x="490" y="214" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Rachaduras novas nas</text>
<text x="490" y="228" font-size="11.5" fill="#222" text-anchor="start">paredes; portas e janelas</text>
<text x="490" y="242" font-size="11.5" fill="#222" text-anchor="start">emperrando</text>
<circle cx="472" cy="264" r="11" fill="#d62828" stroke="#fff" stroke-width="2"/><text x="472" y="269" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text>
<text x="490" y="268" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Muro "embarrigando"</text>
<text x="490" y="282" font-size="11.5" fill="#222" text-anchor="start">(estufando)</text>
<circle cx="472" cy="304" r="11" fill="#d62828" stroke="#fff" stroke-width="2"/><text x="472" y="309" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">6</text>
<text x="490" y="308" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Estalos, barulho de</text>
<text x="490" y="322" font-size="11.5" fill="#222" text-anchor="start">árvore quebrando, ronco</text>
<text x="490" y="336" font-size="11.5" fill="#222" text-anchor="start">de terra</text>
<text x="14" y="436" font-size="13.5" fill="#222" font-weight="bold" text-anchor="start">Para onde fugir (visto de cima)</text>
