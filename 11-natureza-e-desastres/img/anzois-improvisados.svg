<text x="446" y="96" font-size="11.5" fill="#222" text-anchor="start">linha amarrada num</text>
<text x="446" y="110" font-size="11.5" fill="#222" text-anchor="start">entalhe no topo</text>
<text x="446" y="136" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">espinho firme, amarrado</text>
<text x="446" y="150" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">com a ponta virada</text>
<text x="446" y="164" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">PARA CIMA (para a</text>
<text x="446" y="178" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">linha), como um anzol</text>
<text x="352" y="202" font-size="11.5" fill="#444" text-anchor="start">Espinhos bons: laranjeira, limoeiro,</text>
<text x="352" y="216" font-size="11.5" fill="#444" text-anchor="start">unha-de-gato (já vem curvo), juá.</text>
