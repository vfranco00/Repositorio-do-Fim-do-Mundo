<path d="M436 356 Q 452 356 460 346" fill="none" stroke="#2a62a8" stroke-width="2"/>
<text x="360" y="392" font-size="11.5" fill="#222" text-anchor="start">escondida na isca,</text>
<text x="360" y="406" font-size="11.5" fill="#222" text-anchor="start">deitada na direção</text>
<text x="360" y="420" font-size="11.5" fill="#222" text-anchor="start">da linha</text>
