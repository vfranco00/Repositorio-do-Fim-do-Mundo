<text x="196" y="330" font-size="11.5" fill="#222" text-anchor="start">a ponta do corte vira</text>
<text x="196" y="344" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">o anzol: lixe na pedra</text>
<text x="20" y="372" font-size="11.5" fill="#444" text-anchor="start">Linha no furo pequeno. Serve para</text>
<text x="20" y="386" font-size="11.5" fill="#444" text-anchor="start">peixes pequenos e médios.</text>
<text x="352" y="252" font-size="14" fill="#222" font-weight="bold" text-anchor="start">4. Anzol de garganta (osso, madeira)</text>
<path d="M364 292 L404 286 L444 292 L404 298 Z" fill="#f1e6c8" stroke="#1e1e1e" stroke-width="2"/>
<path d="M404 286 Q 406 274 414 266" fill="none" stroke="#2a62a8" stroke-width="2"/>
<text x="456" y="280" font-size="11.5" fill="#222" text-anchor="start">lasca de 2–3 cm, com</text>
<text x="456" y="294" font-size="11.5" fill="#222" text-anchor="start">ponta nas DUAS pontas,</text>
<text x="456" y="308" font-size="11.5" fill="#222" text-anchor="start">linha amarrada no meio</text>
<ellipse cx="404" cy="356" rx="40" ry="11" fill="#d98c7a" stroke="#1e1e1e" stroke-width="1.8"/>
