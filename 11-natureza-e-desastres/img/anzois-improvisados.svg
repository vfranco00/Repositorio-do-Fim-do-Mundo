<text x="240" y="86" font-size="11.5" fill="#222" text-anchor="start">a mola vira o</text>
<text x="240" y="100" font-size="11.5" fill="#222" text-anchor="start">olhal: amarre</text>
<text x="240" y="114" font-size="11.5" fill="#222" text-anchor="start">a linha aqui</text>
<text x="240" y="140" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">dobre em J</text>
<text x="240" y="154" font-size="11.5" fill="#222" text-anchor="start">com alicate e</text>
<text x="240" y="168" font-size="11.5" fill="#222" text-anchor="start">afie a ponta</text>
<text x="240" y="182" font-size="11.5" fill="#222" text-anchor="start">numa pedra</text>
<text x="20" y="206" font-size="11.5" fill="#444" text-anchor="start">Agulha: aqueça na chama antes de dobrar.</text>
