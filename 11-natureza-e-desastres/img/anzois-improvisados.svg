<text x="52" y="124" font-size="11" fill="#666" text-anchor="start">antes</text>
<line x1="126" y1="94" x2="150.0" y2="94.0" stroke="#555" stroke-width="3"/><polygon points="156,94 145.2,99.2 145.2,88.8" fill="#555"/>
