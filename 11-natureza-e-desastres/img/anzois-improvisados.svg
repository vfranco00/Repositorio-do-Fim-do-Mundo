<text x="548" y="372" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">o peixe engole;</text>
<text x="548" y="386" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">ao puxar, ela</text>
<text x="548" y="400" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">atravessa e</text>
<text x="548" y="414" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">prende</text>
<rect x="14" y="446" width="652" height="64" rx="8" fill="#eef7ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="28" y="467" font-size="12.5" fill="#222" text-anchor="start">Anzol PEQUENO (1–2 cm) pega mais peixe. Linha: nylon, fio dental, linha de costura</text>
<text x="28" y="485" font-size="12.5" fill="#222" text-anchor="start">dobrada, fibra de tucum. Chumbada: pedrinha ou porca 20–30 cm acima do anzol.</text>
<text x="28" y="503" font-size="12.5" fill="#222" text-anchor="start">Boia: rolha, isopor ou pau leve, regulada para a isca ficar perto do fundo.</text>
</svg>
