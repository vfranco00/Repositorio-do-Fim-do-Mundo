<text x="470" y="392" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start">caminhonete e SUV</text>
<rect x="14" y="538" width="652" height="122" rx="8" fill="#fdecec" stroke="#d62828" stroke-width="1.5"/>
<text x="28" y="559" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start">Água correndo acima do tornozelo: NÃO entre. Rua ou ponte alagada: dê meia-volta.</text>
<text x="28" y="578" font-size="12.5" fill="#222" text-anchor="start">A água barrenta esconde bueiros sem tampa, buracos, fios com energia e esgoto.</text>
<text x="28" y="598" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Preso no carro com a água subindo: 1. solte o cinto  2. abra a janela (ou quebre)</text>
<text x="28" y="615" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">3. tire as crianças primeiro  4. saia pela janela e suba no teto. Não espere afundar.</text>
<text x="28" y="635" font-size="12.5" fill="#222" text-anchor="start">Contato com água de enchente = risco de leptospirose (febre e dor na panturrilha</text>
<text x="28" y="652" font-size="12.5" fill="#222" text-anchor="start">1 a 30 dias depois): procure atendimento e diga que teve contato.</text>
