<text x="30" y="166" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">para rio acima</text>
<text x="30" y="226" font-size="11.5" fill="#222" text-anchor="start">bastão do lado</text>
<text x="30" y="240" font-size="11.5" fill="#222" text-anchor="start">de cima = 3º apoio</text>
<text x="226" y="168" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">anda de lado,</text>
<text x="226" y="182" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">em DIAGONAL,</text>
<text x="226" y="196" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">A FAVOR da</text>
<text x="226" y="210" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">correnteza</text>
<text x="30" y="326" font-size="11.5" fill="#222" text-anchor="start">pés arrastando, um passo de cada vez</text>
<text x="352" y="90" font-size="13.5" fill="#222" font-weight="bold" text-anchor="start">Em grupo: fila no sentido da água</text>
