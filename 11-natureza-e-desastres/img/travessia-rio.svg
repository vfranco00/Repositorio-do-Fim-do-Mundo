<text x="352" y="148" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">o MAIS FORTE na frente</text>
<text x="352" y="162" font-size="11.5" fill="#222" text-anchor="start">(rio acima): quebra a água</text>
<text x="556" y="166" font-size="11.5" fill="#222" text-anchor="start">os outros seguram</text>
<text x="556" y="180" font-size="11.5" fill="#222" text-anchor="start">a cintura ou a</text>
<text x="556" y="194" font-size="11.5" fill="#222" text-anchor="start">mochila do</text>
<text x="556" y="208" font-size="11.5" fill="#222" text-anchor="start">da frente</text>
