<text x="454" y="504" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Corda AMARRADA no corpo:</text>
<text x="454" y="518" font-size="11.5" fill="#222" text-anchor="start">a correnteza puxa você</text>
<text x="454" y="532" font-size="11.5" fill="#222" text-anchor="start">para baixo da água.</text>
<text x="454" y="546" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">Corda só como corrimão.</text>
<rect x="14" y="560" width="652" height="82" rx="8" fill="#fdecec" stroke="#d62828" stroke-width="1.5"/>
<text x="28" y="581" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start">Água acima do joelho e correndo forte = perigo. Acima da cintura = NÃO atravesse.</text>
<text x="28" y="600" font-size="12.5" fill="#222" text-anchor="start">Rio cheio, barrento, com galhos descendo: ESPERE baixar (riacho baixa em horas).</text>
<text x="28" y="619" font-size="12.5" fill="#222" text-anchor="start">Abra as fivelas da mochila (barrigueira e peito) para soltá-la se cair. Vá calçado.</text>
<text x="28" y="636" font-size="12.5" fill="#222" text-anchor="start">Teste: jogue um galho. Se ele anda mais rápido do que você caminha, é forte demais.</text>
