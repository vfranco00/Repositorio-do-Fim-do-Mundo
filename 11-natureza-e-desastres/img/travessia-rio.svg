<text x="546" y="264" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">juntos, de lado,</text>
<text x="546" y="278" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">no mesmo ritmo</text>
<text x="352" y="326" font-size="11.5" fill="#222" text-anchor="start">nunca amarre ninguém ao outro</text>
