<text x="242" y="98" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="start">TAMPA</text>
<text x="242" y="150" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="start">MELGUEIRA</text>
<text x="242" y="165" font-size="11.5" fill="#333" text-anchor="start">potes de mel</text>
<text x="242" y="179" font-size="11.5" fill="#333" text-anchor="start">e de pólen</text>
<text x="242" y="226" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="start">SOBRENINHO</text>
<text x="242" y="241" font-size="11.5" fill="#333" text-anchor="start">sem fundo;</text>
<text x="242" y="255" font-size="11.5" fill="#333" text-anchor="start">discos de cria</text>
<text x="242" y="318" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="start">NINHO</text>
<text x="242" y="333" font-size="11.5" fill="#333" text-anchor="start">fundo fechado</text>
<text x="242" y="347" font-size="11.5" fill="#333" text-anchor="start">e entrada</text>
<rect x="12" y="404" width="318" height="152" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="24" y="424" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Medidas internas aproximadas</text>
<text x="150" y="444" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle">pequenas*</text>
<text x="258" y="444" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle">grandes**</text>
<text x="24" y="464" font-size="11.5" fill="#222" text-anchor="start">largura</text>
<text x="150" y="464" font-size="11.5" fill="#222" text-anchor="middle">13 × 13</text>
<text x="258" y="464" font-size="11.5" fill="#222" text-anchor="middle">20 × 20</text>
<text x="24" y="482" font-size="11.5" fill="#222" text-anchor="start">ninho</text>
<text x="150" y="482" font-size="11.5" fill="#222" text-anchor="middle">7 cm</text>
<text x="258" y="482" font-size="11.5" fill="#222" text-anchor="middle">10 cm</text>
<text x="24" y="500" font-size="11.5" fill="#222" text-anchor="start">sobreninho</text>
<text x="150" y="500" font-size="11.5" fill="#222" text-anchor="middle">5 cm</text>
<text x="258" y="500" font-size="11.5" fill="#222" text-anchor="middle">7 cm</text>
<text x="24" y="518" font-size="11.5" fill="#222" text-anchor="start">melgueira</text>
<text x="150" y="518" font-size="11.5" fill="#222" text-anchor="middle">4 cm</text>
<text x="258" y="518" font-size="11.5" fill="#222" text-anchor="middle">5 cm</text>
<text x="24" y="538" font-size="11" fill="#444" text-anchor="start">* jataí, iraí   ** mandaçaia, uruçu, tiúba</text>
<text x="24" y="552" font-size="11" fill="#444" text-anchor="start">Parede de 2,5–3 cm (protege do calor e do frio)</text>
<line x1="342" y1="48" x2="342" y2="556" stroke="#ccc" stroke-width="1.5"/>
<text x="510" y="62" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle">Divisão (multiplicar colônias)</text>
<text x="350" y="90" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="start">1. Caixa FORTE: discos de cria</text>
<text x="350" y="105" font-size="11.5" fill="#222" text-anchor="start">enchem ninho e sobreninho.</text>
<rect x="560" y="74" width="80" height="44" fill="#e2b97f" stroke="#1e1e1e" stroke-width="2"/><rect x="560" y="118" width="80" height="44" fill="#e2b97f" stroke="#1e1e1e" stroke-width="2"/><ellipse cx="600" cy="114" rx="30" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/><ellipse cx="600" cy="105" rx="27" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/><ellipse cx="600" cy="96" rx="24" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/><ellipse cx="600" cy="87" rx="21" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/><ellipse cx="600" cy="124" rx="30" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/><ellipse cx="600" cy="133" rx="28" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/><ellipse cx="600" cy="142" rx="26" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/><ellipse cx="600" cy="151" rx="24" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/><circle cx="626" cy="144" r="6" fill="#d62828" stroke="#1e1e1e" stroke-width="1"/>
<text x="350" y="200" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="start">2. Corte entre os módulos com</text>
<text x="350" y="215" font-size="11.5" fill="#222" text-anchor="start">fio ou espátula: cada parte fica</text>
<text x="350" y="230" font-size="11.5" fill="#222" text-anchor="start">com cria. Confira a cria NOVA</text>
<text x="350" y="245" font-size="11.5" fill="#222" text-anchor="start">(clara, quase nascendo) em cima.</text>
<rect x="560" y="178" width="80" height="44" fill="#e2b97f" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="600" cy="218" rx="30" ry="3" fill="#f6eed6" stroke="#8a6a3a" stroke-width="1.2"/>
<ellipse cx="600" cy="209" rx="27" ry="3" fill="#f6eed6" stroke="#8a6a3a" stroke-width="1.2"/>
<ellipse cx="600" cy="200" rx="24" ry="3" fill="#f6eed6" stroke="#8a6a3a" stroke-width="1.2"/>
<ellipse cx="600" cy="191" rx="21" ry="3" fill="#f6eed6" stroke="#8a6a3a" stroke-width="1.2"/>
<rect x="560" y="236" width="80" height="44" fill="#e2b97f" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="600" cy="242" rx="30" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/>
<ellipse cx="600" cy="251" rx="28" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/>
<ellipse cx="600" cy="260" rx="26" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/>
<ellipse cx="600" cy="269" rx="24" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/>
<circle cx="626" cy="266" r="6" fill="#d62828" stroke="#1e1e1e" stroke-width="1"/>
<line x1="550" y1="229" x2="650" y2="229" stroke="#d62828" stroke-width="2" stroke-dasharray="5 3"/>
<text x="350" y="316" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="start">3. Cada parte ganha um módulo</text>
<text x="350" y="331" font-size="11.5" fill="#222" text-anchor="start">vazio e vira uma colônia:</text>
<rect x="360" y="350" width="80" height="44" fill="#fafafa" stroke="#1e1e1e" stroke-width="2"/><rect x="360" y="394" width="80" height="44" fill="#e2b97f" stroke="#1e1e1e" stroke-width="2"/><ellipse cx="400" cy="400" rx="30" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/><ellipse cx="400" cy="409" rx="28" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/><ellipse cx="400" cy="418" rx="26" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/><ellipse cx="400" cy="427" rx="24" ry="3" fill="#e9d6a8" stroke="#8a6a3a" stroke-width="1.2"/><circle cx="426" cy="420" r="6" fill="#d62828" stroke="#1e1e1e" stroke-width="1"/>
<text x="400" y="456" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle">COM rainha:</text>
<text x="400" y="471" font-size="11.5" fill="#222" text-anchor="middle">vai para um</text>
<text x="400" y="486" font-size="11.5" fill="#222" text-anchor="middle">LUGAR NOVO</text>
<rect x="560" y="350" width="80" height="44" fill="#e2b97f" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="600" cy="390" rx="30" ry="3" fill="#f6eed6" stroke="#8a6a3a" stroke-width="1.2"/>
<ellipse cx="600" cy="381" rx="27" ry="3" fill="#f6eed6" stroke="#8a6a3a" stroke-width="1.2"/>
<ellipse cx="600" cy="372" rx="24" ry="3" fill="#f6eed6" stroke="#8a6a3a" stroke-width="1.2"/>
<ellipse cx="600" cy="363" rx="21" ry="3" fill="#f6eed6" stroke="#8a6a3a" stroke-width="1.2"/>
<rect x="560" y="394" width="80" height="44" fill="#fafafa" stroke="#1e1e1e" stroke-width="2"/>
<text x="600" y="456" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle">SEM rainha:</text>
<text x="600" y="471" font-size="11.5" fill="#222" text-anchor="middle">fica no LUGAR da</text>
<text x="600" y="486" font-size="11.5" fill="#222" text-anchor="middle">caixa-mãe (recebe</text>
<text x="600" y="501" font-size="11.5" fill="#222" text-anchor="middle">as campeiras)</text>
<circle cx="364" cy="530" r="6" fill="#d62828" stroke="#1e1e1e" stroke-width="1"/>
<text x="376" y="534" font-size="11.5" fill="#222" text-anchor="start">= rainha. Divida só caixas</text>
<text x="376" y="549" font-size="11.5" fill="#222" text-anchor="start">fortes, na época de florada.</text>
</svg>
