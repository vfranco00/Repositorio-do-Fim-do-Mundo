<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 628" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="628" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Queijo minas frescal passo a passo (10 L de leite)</text>
<rect x="16" y="56" width="316" height="60" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<circle cx="36" cy="86" r="14" fill="#ef8a2b"/>
<text x="36" y="91" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="58" y="76" font-size="13.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Pasteurizar o leite</text>
<text x="58" y="93" font-size="11.5" fill="#333" text-anchor="start">65 °C por 30 min mexendo (ou ferver).</text>
<text x="58" y="108" font-size="11.5" fill="#333" text-anchor="start">Coe num pano limpo e fervido.</text>
<line x1="174.0" y1="117" x2="174.0" y2="125.0" stroke="#555" stroke-width="3"/><polygon points="174.0,131 168.8,120.2 179.2,120.2" fill="#555"/>
<rect x="16" y="132" width="316" height="60" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<circle cx="36" cy="162" r="14" fill="#ef8a2b"/>
<text x="36" y="167" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="58" y="152" font-size="13.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Esfriar a 35–37 °C</text>
<text x="58" y="169" font-size="11.5" fill="#333" text-anchor="start">Morno no pulso. Mais quente que</text>
<text x="58" y="184" font-size="11.5" fill="#333" text-anchor="start">40 °C estraga o coalho.</text>
<line x1="174.0" y1="193" x2="174.0" y2="201.0" stroke="#555" stroke-width="3"/><polygon points="174.0,207 168.8,196.2 179.2,196.2" fill="#555"/>
<rect x="16" y="208" width="316" height="60" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<circle cx="36" cy="238" r="14" fill="#3f6d9e"/>
<text x="36" y="243" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="58" y="228" font-size="13.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Pingar e misturar (10 L)</text>
<text x="58" y="245" font-size="11.5" fill="#333" text-anchor="start">4–5 mL de cloreto de cálcio 50% +</text>
<text x="58" y="260" font-size="11.5" fill="#333" text-anchor="start">coalho na dose do rótulo. Mexa 1 min.</text>
<line x1="174.0" y1="269" x2="174.0" y2="277.0" stroke="#555" stroke-width="3"/><polygon points="174.0,283 168.8,272.2 179.2,272.2" fill="#555"/>
<rect x="16" y="284" width="316" height="60" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<circle cx="36" cy="314" r="14" fill="#ef8a2b"/>
<text x="36" y="319" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
<text x="58" y="304" font-size="13.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Coagular 40–50 min</text>
<text x="58" y="321" font-size="11.5" fill="#333" text-anchor="start">Tampado, parado, SEM mexer,</text>
<text x="58" y="336" font-size="11.5" fill="#333" text-anchor="start">enrolado num pano para não esfriar.</text>
<line x1="174.0" y1="345" x2="174.0" y2="353.0" stroke="#555" stroke-width="3"/><polygon points="174.0,359 168.8,348.2 179.2,348.2" fill="#555"/>
<rect x="16" y="360" width="316" height="60" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<circle cx="36" cy="390" r="14" fill="#3f6d9e"/>
<text x="36" y="395" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">5</text>
<text x="58" y="380" font-size="13.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Ponto de corte</text>
<text x="58" y="397" font-size="11.5" fill="#333" text-anchor="start">Enfie a faca e levante: a massa</text>
<text x="58" y="412" font-size="11.5" fill="#333" text-anchor="start">racha limpa e sai soro verde-claro.</text>
<line x1="174.0" y1="421" x2="174.0" y2="429.0" stroke="#555" stroke-width="3"/><polygon points="174.0,435 168.8,424.2 179.2,424.2" fill="#555"/>
<rect x="16" y="436" width="316" height="60" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<circle cx="36" cy="466" r="14" fill="#3f6d9e"/>
<text x="36" y="471" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">6</text>
<text x="58" y="456" font-size="13.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Cortar em cubos de 1,5–2 cm</text>
<text x="58" y="473" font-size="11.5" fill="#333" text-anchor="start">Faca comprida: cortes em pé nas</text>
<text x="58" y="488" font-size="11.5" fill="#333" text-anchor="start">duas direções e depois inclinados.</text>
<rect x="352" y="56" width="316" height="60" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<circle cx="372" cy="86" r="14" fill="#3f6d9e"/>
<text x="372" y="91" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">7</text>
<text x="394" y="76" font-size="13.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Descansar e mexer</text>
<text x="394" y="93" font-size="11.5" fill="#333" text-anchor="start">Espere 5 min. Mexa devagar por</text>
<text x="394" y="108" font-size="11.5" fill="#333" text-anchor="start">15–20 min: os grãos firmam.</text>
<line x1="510.0" y1="117" x2="510.0" y2="125.0" stroke="#555" stroke-width="3"/><polygon points="510.0,131 504.8,120.2 515.2,120.2" fill="#555"/>
<rect x="352" y="132" width="316" height="60" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<circle cx="372" cy="162" r="14" fill="#3f6d9e"/>
<text x="372" y="167" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">8</text>
<text x="394" y="152" font-size="13.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Tirar o soro</text>
<text x="394" y="169" font-size="11.5" fill="#333" text-anchor="start">Retire 70–80% do soro com caneca.</text>
<text x="394" y="184" font-size="11.5" fill="#333" text-anchor="start">Guarde o soro para fazer ricota.</text>
<line x1="510.0" y1="193" x2="510.0" y2="201.0" stroke="#555" stroke-width="3"/><polygon points="510.0,207 504.8,196.2 515.2,196.2" fill="#555"/>
<rect x="352" y="208" width="316" height="60" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<circle cx="372" cy="238" r="14" fill="#3f6d9e"/>
<text x="372" y="243" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">9</text>
<text x="394" y="228" font-size="13.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Enformar</text>
<text x="394" y="245" font-size="11.5" fill="#333" text-anchor="start">Formas furadas de 0,5 kg. Aperte</text>
<text x="394" y="260" font-size="11.5" fill="#333" text-anchor="start">de leve com a mão limpa.</text>
<line x1="510.0" y1="269" x2="510.0" y2="277.0" stroke="#555" stroke-width="3"/><polygon points="510.0,283 504.8,272.2 515.2,272.2" fill="#555"/>
<rect x="352" y="284" width="316" height="60" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<circle cx="372" cy="314" r="14" fill="#3f6d9e"/>
<text x="372" y="319" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">10</text>
<text x="394" y="304" font-size="13.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Virar</text>
<text x="394" y="321" font-size="11.5" fill="#333" text-anchor="start">Vire o queijo 3 vezes na primeira</text>
<text x="394" y="336" font-size="11.5" fill="#333" text-anchor="start">hora (dentro da própria forma).</text>
<line x1="510.0" y1="345" x2="510.0" y2="353.0" stroke="#555" stroke-width="3"/><polygon points="510.0,359 504.8,348.2 515.2,348.2" fill="#555"/>
<rect x="352" y="360" width="316" height="60" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<circle cx="372" cy="390" r="14" fill="#3f6d9e"/>
<text x="372" y="395" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">11</text>
<text x="394" y="380" font-size="13.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Salgar</text>
<text x="394" y="397" font-size="11.5" fill="#333" text-anchor="start">Sal fino nas 2 faces: ~5 g por face</text>
<text x="394" y="412" font-size="11.5" fill="#333" text-anchor="start">(1 colher de chá) por queijo de 0,5 kg.</text>
<line x1="510.0" y1="421" x2="510.0" y2="429.0" stroke="#555" stroke-width="3"/><polygon points="510.0,435 504.8,424.2 515.2,424.2" fill="#555"/>
<rect x="352" y="436" width="316" height="60" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<circle cx="372" cy="466" r="14" fill="#3f6d9e"/>
<text x="372" y="471" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">12</text>
<text x="394" y="456" font-size="13.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Geladeira (4–8 °C)</text>
<text x="394" y="473" font-size="11.5" fill="#333" text-anchor="start">12 h para firmar. Coma em até 10 dias.</text>
<text x="394" y="488" font-size="11.5" fill="#333" text-anchor="start">Rende ~1,5 kg por 10 L de leite.</text>
<path d="M174,496 L174,508 L342,508 L342,46 L510,46 L510,50" fill="none" stroke="#555" stroke-width="3"/>
<polygon points="510,56 504,46 516,46" fill="#555"/>
<rect x="16" y="526" width="648" height="70" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
<text x="28" y="546" font-size="12.5" fill="#222" text-anchor="start">Tudo lavado e escaldado (panela, faca, formas, pano). Leite só de animal sadio.</text><text x="28" y="564" font-size="12.5" fill="#222" text-anchor="start">Termômetro de cozinha é o melhor amigo do queijeiro. Sem ele: 35 °C = morno, quase</text><text x="28" y="582" font-size="12.5" fill="#222" text-anchor="start">imperceptível no pulso; 65 °C = não dá para manter o dedo nem 1 segundo.</text>
<text x="28" y="618" font-size="12" fill="#555" text-anchor="start">Laranja = etapas com temperatura. Queijo amargo = coalho demais; mole = cortou cedo.</text>
</svg>
