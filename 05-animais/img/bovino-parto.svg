<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 692" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="692" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Parto da vaca: posição normal e as erradas mais comuns</text>
<rect x="8" y="60" width="216" height="246" rx="8" fill="#fff" stroke="#2b8a3e" stroke-width="2"/>
<text x="116" y="80" font-size="13.5" fill="#2b8a3e" font-weight="bold" text-anchor="middle">1. NORMAL</text>
<g transform="translate(11,88) scale(0.96)"><path d="M166.5,58 L212,58 L212,102 L166.5,102 A84,62 0 1 1 166.5,58 Z" fill="#f6dede"/><path d="M212,58 L166.5,58 A84,62 0 1 0 166.5,102 L212,102" fill="none" stroke="#b56576" stroke-width="2.5"/><path d="M212 50 q7 8 0 16 M212 94 q7 8 0 16" fill="none" stroke="#b56576" stroke-width="4" stroke-linecap="round"/><polyline points="42,96 56,116 86,110" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="42,96 56,116 86,110" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="86" cy="110" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><polyline points="50,98 66,120 94,114" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="50,98 66,120 94,114" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="94" cy="114" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><ellipse cx="70" cy="80" rx="44" ry="23" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.8" transform="rotate(0 70 80)"/><polyline points="104,70 140,72" fill="none" stroke="#1e1e1e" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/><polyline points="104,70 140,72" fill="none" stroke="#c08a5a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><polyline points="104,90 150,92 198,88" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="104,90 150,92 198,88" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="198" cy="88" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><polyline points="106,94 152,98 202,96" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="106,94 152,98 202,96" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="202" cy="96" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><g transform="translate(160,74) rotate(0) scale(1,1)"><path d="M-6 -9 Q-14 -18 -22 -14 Q-16 -8 -8 -5 Z" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.3"/><path d="M-17 -6 Q-12 -13 4 -10 L19 -4 Q24 0 20 6 L6 10 Q-12 13 -18 5 Z" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.8"/><circle cx="-2" cy="-4" r="1.9" fill="#1e1e1e"/><ellipse cx="18" cy="1" rx="2" ry="1.5" fill="#1e1e1e"/></g></g>
<text x="16" y="238" font-size="10.8" fill="#222" text-anchor="start">2 patas da FRENTE (sola do casco</text>
<text x="16" y="253" font-size="10.8" fill="#222" text-anchor="start">para baixo) e o focinho por cima.</text>
<text x="16" y="268" font-size="10.8" fill="#222" text-anchor="start">Espere. Só ajude se parar de</text>
<text x="16" y="283" font-size="10.8" fill="#222" text-anchor="start">avançar por 30 minutos.</text>
<rect x="232" y="60" width="216" height="246" rx="8" fill="#fff" stroke="#c06000" stroke-width="2"/>
<text x="340" y="80" font-size="13.5" fill="#c06000" font-weight="bold" text-anchor="middle">2. DE TRASEIRO</text>
<g transform="translate(235,88) scale(0.96)"><path d="M166.5,58 L212,58 L212,102 L166.5,102 A84,62 0 1 1 166.5,58 Z" fill="#f6dede"/><path d="M212,58 L166.5,58 A84,62 0 1 0 166.5,102 L212,102" fill="none" stroke="#b56576" stroke-width="2.5"/><path d="M212 50 q7 8 0 16 M212 94 q7 8 0 16" fill="none" stroke="#b56576" stroke-width="4" stroke-linecap="round"/><polyline points="60,96 80,116 40,114" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="60,96 80,116 40,114" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="114" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><polyline points="64,100 86,120 48,120" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="64,100 86,120 48,120" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="48" cy="120" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><g transform="translate(30,70) rotate(20) scale(-1,1)"><path d="M-6 -9 Q-14 -18 -22 -14 Q-16 -8 -8 -5 Z" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.3"/><path d="M-17 -6 Q-12 -13 4 -10 L19 -4 Q24 0 20 6 L6 10 Q-12 13 -18 5 Z" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.8"/><circle cx="-2" cy="-4" r="1.9" fill="#1e1e1e"/><ellipse cx="18" cy="1" rx="2" ry="1.5" fill="#1e1e1e"/></g><ellipse cx="84" cy="80" rx="44" ry="23" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.8" transform="rotate(0 84 80)"/><polyline points="118,88 150,76 200,74" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="118,88 150,76 200,74" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="74" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><polyline points="120,94 154,84 204,84" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="120,94 154,84 204,84" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="204" cy="84" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><text x="128" y="50" font-size="9.5" fill="#333" text-anchor="middle">jarrete</text><line x1="134" y1="53" x2="148" y2="72" stroke="#333" stroke-width="1"/></g>
<text x="240" y="238" font-size="10.8" fill="#222" text-anchor="start">2 patas de TRÁS (sola para cima;</text>
<text x="240" y="253" font-size="10.8" fill="#222" text-anchor="start">o jarrete dobra ao contrário).</text>
<text x="240" y="268" font-size="10.8" fill="#222" text-anchor="start">Nasce assim, mas tire SEM</text>
<text x="240" y="283" font-size="10.8" fill="#222" text-anchor="start">demora: o umbigo fica apertado.</text>
<rect x="456" y="60" width="216" height="246" rx="8" fill="#fff" stroke="#b3001b" stroke-width="2"/>
<text x="564" y="80" font-size="13.5" fill="#b3001b" font-weight="bold" text-anchor="middle">3. CABEÇA VIRADA</text>
<g transform="translate(459,88) scale(0.96)"><path d="M166.5,58 L212,58 L212,102 L166.5,102 A84,62 0 1 1 166.5,58 Z" fill="#f6dede"/><path d="M212,58 L166.5,58 A84,62 0 1 0 166.5,102 L212,102" fill="none" stroke="#b56576" stroke-width="2.5"/><path d="M212 50 q7 8 0 16 M212 94 q7 8 0 16" fill="none" stroke="#b56576" stroke-width="4" stroke-linecap="round"/><polyline points="42,96 56,116 86,110" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="42,96 56,116 86,110" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="86" cy="110" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><ellipse cx="76" cy="82" rx="44" ry="23" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.8" transform="rotate(0 76 82)"/><polyline points="108,70 98,50" fill="none" stroke="#1e1e1e" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/><polyline points="108,70 98,50" fill="none" stroke="#c08a5a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(74,44) rotate(10) scale(-1,1)"><path d="M-6 -9 Q-14 -18 -22 -14 Q-16 -8 -8 -5 Z" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.3"/><path d="M-17 -6 Q-12 -13 4 -10 L19 -4 Q24 0 20 6 L6 10 Q-12 13 -18 5 Z" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.8"/><circle cx="-2" cy="-4" r="1.9" fill="#1e1e1e"/><ellipse cx="18" cy="1" rx="2" ry="1.5" fill="#1e1e1e"/></g><polyline points="108,92 152,92 198,88" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="108,92 152,92 198,88" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="198" cy="88" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><polyline points="110,96 154,100 202,96" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="110,96 154,100 202,96" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="202" cy="96" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/></g>
<text x="464" y="238" font-size="10.8" fill="#222" text-anchor="start">Saem patas, mas não o focinho.</text>
<text x="464" y="253" font-size="10.8" fill="#222" text-anchor="start">Empurre o bezerro para dentro</text>
<text x="464" y="268" font-size="10.8" fill="#222" text-anchor="start">entre as forças da vaca e traga</text>
<text x="464" y="283" font-size="10.8" fill="#222" text-anchor="start">a cabeça pela boca/mandíbula.</text>
<rect x="8" y="314" width="216" height="246" rx="8" fill="#fff" stroke="#b3001b" stroke-width="2"/>
<text x="116" y="334" font-size="13.5" fill="#b3001b" font-weight="bold" text-anchor="middle">4. PERNA DOBRADA</text>
<g transform="translate(11,342) scale(0.96)"><path d="M166.5,58 L212,58 L212,102 L166.5,102 A84,62 0 1 1 166.5,58 Z" fill="#f6dede"/><path d="M212,58 L166.5,58 A84,62 0 1 0 166.5,102 L212,102" fill="none" stroke="#b56576" stroke-width="2.5"/><path d="M212 50 q7 8 0 16 M212 94 q7 8 0 16" fill="none" stroke="#b56576" stroke-width="4" stroke-linecap="round"/><polyline points="42,96 56,116 86,110" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="42,96 56,116 86,110" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="86" cy="110" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><ellipse cx="70" cy="80" rx="44" ry="23" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.8" transform="rotate(0 70 80)"/><polyline points="104,70 140,72" fill="none" stroke="#1e1e1e" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/><polyline points="104,70 140,72" fill="none" stroke="#c08a5a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><polyline points="104,92 150,104 120,118" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="104,92 150,104 120,118" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="118" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><polyline points="106,90 152,92 200,90" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="106,90 152,92 200,90" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="90" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><g transform="translate(160,74) rotate(0) scale(1,1)"><path d="M-6 -9 Q-14 -18 -22 -14 Q-16 -8 -8 -5 Z" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.3"/><path d="M-17 -6 Q-12 -13 4 -10 L19 -4 Q24 0 20 6 L6 10 Q-12 13 -18 5 Z" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.8"/><circle cx="-2" cy="-4" r="1.9" fill="#1e1e1e"/><ellipse cx="18" cy="1" rx="2" ry="1.5" fill="#1e1e1e"/></g><text x="158" y="122" font-size="9.5" fill="#333" text-anchor="middle">joelho</text></g>
<text x="16" y="492" font-size="10.8" fill="#222" text-anchor="start">Sai a cabeça e só 1 pata (ou</text>
<text x="16" y="507" font-size="10.8" fill="#222" text-anchor="start">nenhuma). Empurre para dentro,</text>
<text x="16" y="522" font-size="10.8" fill="#222" text-anchor="start">pegue o casco com a mão em</text>
<text x="16" y="537" font-size="10.8" fill="#222" text-anchor="start">concha e estique a perna.</text>
<rect x="232" y="314" width="216" height="246" rx="8" fill="#fff" stroke="#b3001b" stroke-width="2"/>
<text x="340" y="334" font-size="13.5" fill="#b3001b" font-weight="bold" text-anchor="middle">5. DE NÁDEGAS</text>
<g transform="translate(235,342) scale(0.96)"><path d="M166.5,58 L212,58 L212,102 L166.5,102 A84,62 0 1 1 166.5,58 Z" fill="#f6dede"/><path d="M212,58 L166.5,58 A84,62 0 1 0 166.5,102 L212,102" fill="none" stroke="#b56576" stroke-width="2.5"/><path d="M212 50 q7 8 0 16 M212 94 q7 8 0 16" fill="none" stroke="#b56576" stroke-width="4" stroke-linecap="round"/><g transform="translate(26,74) rotate(15) scale(-1,1)"><path d="M-6 -9 Q-14 -18 -22 -14 Q-16 -8 -8 -5 Z" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.3"/><path d="M-17 -6 Q-12 -13 4 -10 L19 -4 Q24 0 20 6 L6 10 Q-12 13 -18 5 Z" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.8"/><circle cx="-2" cy="-4" r="1.9" fill="#1e1e1e"/><ellipse cx="18" cy="1" rx="2" ry="1.5" fill="#1e1e1e"/></g><polyline points="56,96 72,114 34,112" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="56,96 72,114 34,112" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="112" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><ellipse cx="90" cy="80" rx="46" ry="24" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.8" transform="rotate(0 90 80)"/><polyline points="122,92 100,112 66,112" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="122,92 100,112 66,112" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="66" cy="112" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><polyline points="126,96 108,120 74,120" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="126,96 108,120 74,120" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="74" cy="120" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><path d="M136 76 q22 -2 40 6" fill="none" stroke="#5a3a20" stroke-width="3.5"/><text x="178" y="74" font-size="9.5" fill="#333" text-anchor="middle">cauda</text></g>
<text x="240" y="492" font-size="10.8" fill="#222" text-anchor="start">Só a cauda aparece (ou nada).</text>
<text x="240" y="507" font-size="10.8" fill="#222" text-anchor="start">Empurre o bezerro e traga uma</text>
<text x="240" y="522" font-size="10.8" fill="#222" text-anchor="start">perna de trás de cada vez, com o</text>
<text x="240" y="537" font-size="10.8" fill="#222" text-anchor="start">casco protegido na sua mão.</text>
<rect x="456" y="314" width="216" height="246" rx="8" fill="#fff" stroke="#b3001b" stroke-width="2"/>
<text x="564" y="334" font-size="13.5" fill="#b3001b" font-weight="bold" text-anchor="middle">6. DE COSTAS</text>
<g transform="translate(459,342) scale(0.96)"><path d="M166.5,58 L212,58 L212,102 L166.5,102 A84,62 0 1 1 166.5,58 Z" fill="#f6dede"/><path d="M212,58 L166.5,58 A84,62 0 1 0 166.5,102 L212,102" fill="none" stroke="#b56576" stroke-width="2.5"/><path d="M212 50 q7 8 0 16 M212 94 q7 8 0 16" fill="none" stroke="#b56576" stroke-width="4" stroke-linecap="round"/><polyline points="42,66 56,46 86,50" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="42,66 56,46 86,50" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="86" cy="50" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><polyline points="50,64 66,42 94,46" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="50,64 66,42 94,46" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="94" cy="46" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><ellipse cx="70" cy="82" rx="44" ry="23" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.8" transform="rotate(0 70 82)"/><polyline points="104,92 140,90" fill="none" stroke="#1e1e1e" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/><polyline points="104,92 140,90" fill="none" stroke="#c08a5a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><polyline points="104,72 150,70 198,72" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="104,72 150,70 198,72" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="198" cy="72" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><polyline points="106,68 152,64 202,64" fill="none" stroke="#1e1e1e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polyline points="106,68 152,64 202,64" fill="none" stroke="#c08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="202" cy="64" r="4.5" fill="#3a2a1a" stroke="#1e1e1e" stroke-width="1"/><g transform="translate(160,88) scale(1,-1)"><g transform="translate(0,0) rotate(0) scale(1,1)"><path d="M-6 -9 Q-14 -18 -22 -14 Q-16 -8 -8 -5 Z" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.3"/><path d="M-17 -6 Q-12 -13 4 -10 L19 -4 Q24 0 20 6 L6 10 Q-12 13 -18 5 Z" fill="#c08a5a" stroke="#1e1e1e" stroke-width="1.8"/><circle cx="-2" cy="-4" r="1.9" fill="#1e1e1e"/><ellipse cx="18" cy="1" rx="2" ry="1.5" fill="#1e1e1e"/></g></g></g>
<text x="464" y="492" font-size="10.8" fill="#222" text-anchor="start">Patas com sola para CIMA e</text>
<text x="464" y="507" font-size="10.8" fill="#222" text-anchor="start">focinho por baixo delas. Gire o</text>
<text x="464" y="522" font-size="10.8" fill="#222" text-anchor="start">bezerro de lado (90°) antes de</text>
<text x="464" y="537" font-size="10.8" fill="#222" text-anchor="start">puxar.</text>
<text x="340" y="52" font-size="12" fill="#7a3a4a" font-weight="bold" text-anchor="middle">Vaca vista de lado: a saída (vulva) fica à DIREITA de cada desenho.</text>
<rect x="8" y="570" width="664" height="112" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="20" y="590" font-size="11.6" fill="#222" text-anchor="start"><tspan font-weight="bold">Como puxar:</tspan> corda limpa com laço acima do boleto + meia-volta entre o boleto e o casco.</text>
<text x="20" y="609" font-size="11.6" fill="#222" text-anchor="start">Puxe SÓ durante a força da vaca, em arco para BAIXO (em direção aos jarretes dela),</text>
<text x="20" y="628" font-size="11.6" fill="#222" text-anchor="start">alternando as patas. No máximo 2 pessoas. NUNCA trator, carro ou talha.</text>
<text x="20" y="647" font-size="11.6" fill="#222" text-anchor="start"><tspan font-weight="bold">Frente ou trás?</tspan> Pata da frente: as 2 juntas acima do casco dobram para o mesmo lado.</text>
<text x="20" y="666" font-size="11.6" fill="#222" text-anchor="start">Pata de trás: a 2ª junta (jarrete) dobra para o lado contrário e tem uma ponta óssea.</text>
</svg>
