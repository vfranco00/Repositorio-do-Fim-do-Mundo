<text x="24" y="612" font-size="12.5" fill="#222" text-anchor="start">Medidas INTERNAS (padrão Langstroth): 46,5 cm × 37 cm. Ninho com 24 cm de altura;</text><text x="24" y="632" font-size="12.5" fill="#222" text-anchor="start">melgueira com 14,5 cm. Madeira de 2 a 2,5 cm. Cabem 10 quadros, 3,5 cm de centro a centro.</text><text x="24" y="652" font-size="12.5" fill="#222" text-anchor="start">ESPAÇO-ABELHA: 6 a 9 mm entre quadros, paredes e tampa. Menos que isso elas colam com</text><text x="24" y="672" font-size="12.5" fill="#222" text-anchor="start">própolis; mais que isso elas enchem de favo. É a medida mais importante da caixa.</text>
