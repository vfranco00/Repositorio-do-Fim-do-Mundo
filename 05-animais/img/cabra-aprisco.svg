<text x="64" y="410" font-size="11" fill="#b3001b" font-weight="bold" text-anchor="end">1,0–1,2 m</text>
<line x1="518" y1="224" x2="518" y2="360" stroke="#b3001b" stroke-width="1.6"/><line x1="513" y1="224" x2="523" y2="224" stroke="#b3001b" stroke-width="1.6"/><line x1="513" y1="360" x2="523" y2="360" stroke="#b3001b" stroke-width="1.6"/>
<text x="524" y="300" font-size="11" fill="#b3001b" font-weight="bold" text-anchor="start">2,0–2,5 m</text>
<text x="8" y="250" font-size="11.3" fill="#222" font-weight="bold" text-anchor="start">Comedouro por fora,</text>
<text x="8" y="264" font-size="11.3" fill="#222" text-anchor="start">com canzil (vão para</text>
<text x="8" y="278" font-size="11.3" fill="#222" text-anchor="start">a cabeça): o animal</text>
<text x="8" y="292" font-size="11.3" fill="#222" text-anchor="start">não pisa nem suja</text>
<text x="8" y="306" font-size="11.3" fill="#222" text-anchor="start">a comida</text>
<line x1="64" y1="312" x2="114" y2="326" stroke="#555" stroke-width="1.2"/><circle cx="114" cy="326" r="2.5" fill="#555"/>
<text x="518" y="140" font-size="11.3" fill="#222" font-weight="bold" text-anchor="start">Telhado com beiral;</text>
<text x="518" y="154" font-size="11.3" fill="#222" text-anchor="start">laterais de ripas: ventila</text>
<text x="518" y="168" font-size="11.3" fill="#222" text-anchor="start">e protege do vento frio</text>
<text x="574" y="372" font-size="11.3" fill="#222" font-weight="bold" text-anchor="start">Rampa com</text>
<text x="574" y="386" font-size="11.3" fill="#222" text-anchor="start">travessas a</text>
<text x="574" y="400" font-size="11.3" fill="#222" text-anchor="start">cada 20 cm</text>
<text x="322" y="384" font-size="11.3" fill="#222" font-weight="bold" text-anchor="start">Piso de ripas:</text>
<text x="322" y="398" font-size="11.3" fill="#222" text-anchor="start">4–5 cm de largura,</text>
<text x="322" y="412" font-size="11.3" fill="#222" text-anchor="start">vão de 1,5–2 cm</text>
<text x="322" y="426" font-size="11.3" fill="#222" text-anchor="start">(o casco não entra)</text>
<text x="310" y="490" font-size="11" fill="#5a4630" font-weight="bold" text-anchor="middle">O esterco cai pelo piso: limpeza fácil, adubo bom e menos verme, casco podre e piolho</text>
<rect x="16" y="504" width="648" height="76" rx="8" fill="#eef7ee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="30" y="524" font-size="11.6" fill="#222" text-anchor="start">Espaço por animal: cabra ou ovelha adulta 0,8–1,2 m²; fêmea com cria 1,5–2 m²; cabrito ou</text>
<text x="30" y="542" font-size="11.6" fill="#222" text-anchor="start">cordeiro 0,3–0,5 m²; bode ou carneiro em baia separada de 2–3 m². Comprimento leste-oeste.</text>
<text x="30" y="560" font-size="11.6" fill="#222" text-anchor="start">Bebedouro e saleiro (cocho de sal coberto) também por fora ou em altura que não sujem.</text></g>
</svg>
