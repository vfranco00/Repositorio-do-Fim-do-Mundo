<text x="52" y="544" font-size="11.6" fill="#222" text-anchor="start">Porta</text>
<circle cx="34" cy="560" r="10" fill="#1f3f6e" stroke="#fff" stroke-width="1.5"/><text x="34" y="564.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">7</text>
<text x="52" y="564" font-size="11.6" fill="#222" text-anchor="start">Canaleta: piso com caimento de 3–5% leva urina e esterco</text>
<text x="340" y="600" font-size="11.4" fill="#222" font-weight="bold" text-anchor="middle">Porca: 18–22 °C é o ideal (ela sofre com calor). Leitão: precisa de 30–34 °C nos primeiros dias.</text>
