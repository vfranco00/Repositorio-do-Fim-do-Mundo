<rect x="530" y="144" width="22" height="18" fill="#3e7f2a" stroke="#1e1e1e"/>
<text x="558" y="105" font-size="10.5" fill="#222" text-anchor="start">baixo (descansando)</text>
<text x="558" y="131" font-size="10.5" fill="#222" text-anchor="start">crescendo</text>
<text x="558" y="157" font-size="10.5" fill="#222" text-anchor="start">alto: pronto</text>
<rect x="16" y="376" width="648" height="72" rx="8" fill="#eef7ee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="30" y="396" font-size="11.6" fill="#222" text-anchor="start"><tspan font-weight="bold">Ocupação:</tspan> 1 a 3 dias por piquete (no máximo 7).  <tspan font-weight="bold">Descanso:</tspan> 25–35 dias nas águas, mais na seca.</text>
<text x="30" y="414" font-size="11.6" fill="#222" text-anchor="start"><tspan font-weight="bold">Quantos piquetes?</tspan> descanso ÷ ocupação + 1. Ex.: 27 dias ÷ 3 dias + 1 = 10 piquetes (este desenho).</text>
<text x="30" y="432" font-size="11.6" fill="#222" text-anchor="start">Água e sal em todos os piquetes, ou no corredor. Sombra (árvores) em cada piquete se possível.</text>
<text x="340" y="470" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Quando entrar e quando tirar o gado (altura do capim)</text>
<rect x="100" y="482" width="480" height="21" fill="#2b8a3e" stroke="#cfd8cf"/>
