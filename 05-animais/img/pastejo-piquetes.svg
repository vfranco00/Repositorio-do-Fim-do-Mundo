<text x="510" y="581" font-size="11.5" fill="#222" text-anchor="middle">30–35 cm</text>
<rect x="100" y="587" width="480" height="21" fill="#f3faf3" stroke="#cfd8cf"/>
<text x="112" y="602" font-size="11.5" fill="#222" text-anchor="start">Capim-elefante</text>
<text x="400" y="602" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">100 cm</text>
<text x="510" y="602" font-size="11.5" fill="#222" text-anchor="middle">40–50 cm</text>
<rect x="100" y="608" width="480" height="21" fill="#fff" stroke="#cfd8cf"/>
<text x="112" y="623" font-size="11.5" fill="#222" text-anchor="start">Tifton, coastcross, estrela</text>
<text x="400" y="623" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">25 cm</text>
<text x="510" y="623" font-size="11.5" fill="#222" text-anchor="middle">10–15 cm</text>
<text x="340" y="646" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="middle">Nunca rape o pasto até o chão: a planta perde a reserva, demora a rebrotar e o mato invade.</text>
