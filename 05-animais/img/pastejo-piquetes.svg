<text x="400" y="497" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">Entrar com</text>
<text x="510" y="497" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">Tirar com</text>
