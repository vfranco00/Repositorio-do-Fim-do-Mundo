<text x="265.0" y="46" font-size="11" fill="#b3001b" font-weight="bold" text-anchor="middle">o gado muda de piquete na ordem 1 → 2 → 3 … → 10 → 1</text>
<text x="77.0" y="183.0" font-size="11" fill="#222" font-weight="bold" text-anchor="middle">gado aqui</text>
<text x="77.0" y="350.0" font-size="10.5" fill="#222" font-weight="bold" text-anchor="middle">acabou de sair</text>
<text x="171.0" y="169.0" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">o próximo:</text>
<text x="171.0" y="183.0" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">pronto</text>
<text x="580" y="80" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">Altura do capim</text>
<rect x="530" y="92" width="22" height="18" fill="#dce9b8" stroke="#1e1e1e"/>
