<text x="510" y="539" font-size="11.5" fill="#222" text-anchor="middle">10 cm</text>
<rect x="100" y="545" width="480" height="21" fill="#f3faf3" stroke="#cfd8cf"/>
<text x="112" y="560" font-size="11.5" fill="#222" text-anchor="start">Mombaça</text>
