<text x="408" y="154" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">2 cm</text>
</g>
<text x="339" y="72" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">PORCO (de frente)</text>
<text x="244" y="330" font-size="12" fill="#222" text-anchor="start">Na linha do meio, 2 cm (um</text><text x="244" y="345" font-size="12" fill="#222" text-anchor="start">dedo) ACIMA da linha dos</text><text x="244" y="360" font-size="12" fill="#222" text-anchor="start">olhos. Porco grande ou</text><text x="244" y="375" font-size="12" fill="#222" text-anchor="start">cachaço: 3–4 cm acima.</text>
<text x="244" y="398" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">Mire na direção do rabo</text><text x="244" y="413" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">(ao longo da coluna).</text>
<g transform="translate(0,26)">
