<line x1="144" y1="156" x2="78" y2="102" stroke="#1f5fa8" stroke-width="2.5" stroke-dasharray="6 4"/>
<circle cx="113" cy="129" r="11" fill="#fff" fill-opacity="0.6" stroke="#d62828" stroke-width="3"/><line x1="97" y1="129" x2="129" y2="129" stroke="#d62828" stroke-width="2.5"/><line x1="113" y1="113" x2="113" y2="145" stroke="#d62828" stroke-width="2.5"/>
</g>
<text x="117" y="72" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">BOVINO (de frente)</text>
<text x="22" y="340" font-size="12" fill="#222" text-anchor="start">Cruze duas linhas: de cada</text><text x="22" y="355" font-size="12" fill="#222" text-anchor="start">olho até a base do chifre</text><text x="22" y="370" font-size="12" fill="#222" text-anchor="start">do lado oposto. O alvo é o</text><text x="22" y="385" font-size="12" fill="#222" text-anchor="start">cruzamento, no meio da testa.</text>
<text x="22" y="406" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">Mire reto, de frente para</text><text x="22" y="421" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">o osso da testa.</text>
<g transform="translate(0,26)">
<polygon points="290,112 266,66 320,96" fill="#f3c1b4" stroke="#1e1e1e" stroke-width="2.5"/>
<polygon points="388,112 412,66 358,96" fill="#f3c1b4" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M288,110 C302,92 376,92 390,110 C406,140 404,196 382,226 C372,238 358,242 339,242 C320,242 306,238 296,226 C274,196 272,140 288,110 Z" fill="#f3c1b4" stroke="#1e1e1e" stroke-width="2.5"/>
