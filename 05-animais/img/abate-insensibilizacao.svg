<path d="M480,212 C492,216 506,214 514,210" fill="none" stroke="#1e1e1e" stroke-width="1.8"/>
<line x1="574" y1="70" x2="568.2" y2="208.0" stroke="#d62828" stroke-width="3.5"/><polygon points="568,214 563.2,203.0 573.7,203.4" fill="#d62828"/>
<circle cx="572" cy="100" r="11" fill="#fff" fill-opacity="0.6" stroke="#d62828" stroke-width="3"/><line x1="556" y1="100" x2="588" y2="100" stroke="#d62828" stroke-width="2.5"/><line x1="572" y1="84" x2="572" y2="116" stroke="#d62828" stroke-width="2.5"/>
<text x="560" y="240" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="end">garganta</text>
</g>
<text x="552" y="72" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">OVELHA / CABRA</text>
<text x="466" y="330" font-size="12" fill="#222" text-anchor="start">Sem chifre: no ALTO da</text><text x="466" y="345" font-size="12" fill="#222" text-anchor="start">cabeça (ponto mais alto).</text><text x="466" y="360" font-size="12" fill="#222" text-anchor="start">Com chifre (bode, carneiro):</text><text x="466" y="375" font-size="12" fill="#222" text-anchor="start">logo ATRÁS dos chifres.</text>
<text x="466" y="398" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">Nos dois casos, mire para</text><text x="466" y="413" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">a garganta (seta).</text>
<rect x="12" y="454" width="656" height="156" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="26" y="476" font-size="12.5" fill="#222" text-anchor="start">Ferramenta: pistola de dardo cativo (a melhor); ou disparo por pessoa treinada e autorizada.</text><text x="26" y="495" font-size="12.5" fill="#222" text-anchor="start">Aves, coelhos e leitões pequenos: pancada forte e seca na nuca (veja o texto).</text><text x="26" y="514" font-size="12.5" fill="#222" text-anchor="start">Cabeça bem presa (brete, corda curta, ajudante). UM golpe, firme, encostado no ponto certo.</text><text x="26" y="533" font-size="12.5" fill="#222" text-anchor="start">Insensível = cai na hora, para a respiração ritmada, olho fixo que não pisca ao ser tocado,</text><text x="26" y="552" font-size="12.5" fill="#222" text-anchor="start">língua mole para fora, não tenta erguer a cabeça. Pernas podem pedalar: é reflexo.</text><text x="26" y="571" font-size="12.5" fill="#222" text-anchor="start">Piscou, gemeu ou tentou levantar? REPITA NA HORA, um pouco ao lado do primeiro ponto.</text><text x="26" y="590" font-size="12.5" fill="#222" text-anchor="start">SANGRE EM ATÉ 60 SEGUNDOS (quanto antes, melhor).</text>
</svg>
