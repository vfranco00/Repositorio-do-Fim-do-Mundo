<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 684" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="684" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Silagem em tambor ou saco, passo a passo</text>
<rect x="8" y="46" width="216" height="254" rx="8" fill="#fff" stroke="#2b8a3e" stroke-width="1.8"/><circle cx="28" cy="66" r="13" fill="#2b8a3e"/><text x="28" y="71" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="48" y="71" font-size="13" fill="#1e5a2a" font-weight="bold" text-anchor="start">Corte no ponto</text><g transform="translate(8,46)"><rect x="0" y="136" width="216" height="8" fill="#e8d3b0"/><line x1="80" y1="136" x2="80" y2="44" stroke="#4f8a2b" stroke-width="6"/><path d="M80 120 q-30 -6 -46 6 M80 100 q32 -10 50 0 M80 78 q-28 -12 -44 -2 M80 60 q22 -16 40 -12" fill="none" stroke="#4f8a2b" stroke-width="5" stroke-linecap="round"/><ellipse cx="94" cy="88" rx="8" ry="18" fill="#f2c94c" stroke="#1e1e1e" stroke-width="1.6" transform="rotate(20 94 88)"/><path d="M86 104 q4 -24 18 -30" fill="none" stroke="#7aa63c" stroke-width="3"/><line x1="150" y1="136" x2="150" y2="50" stroke="#3d7a2b" stroke-width="5"/><path d="M150 120 q-20 -14 -24 -40 M150 110 q22 -16 26 -44 M150 90 q-14 -20 -10 -40 M150 80 q16 -18 14 -36" fill="none" stroke="#3d7a2b" stroke-width="4" stroke-linecap="round"/><text x="80" y="38" font-size="10" text-anchor="middle" fill="#333">milho</text><text x="152" y="44" font-size="10" text-anchor="middle" fill="#333">capim</text></g><text x="18" y="206" font-size="10.8" fill="#222" text-anchor="start">Milho ou sorgo: grão farináceo</text><text x="18" y="221" font-size="10.8" fill="#222" text-anchor="start">(a unha marca, mas não sai</text><text x="18" y="236" font-size="10.8" fill="#222" text-anchor="start">leite), uns 90–110 dias.</text><text x="18" y="251" font-size="10.8" fill="#222" text-anchor="start">Capim-elefante: 70–90 dias,</text><text x="18" y="266" font-size="10.8" fill="#222" text-anchor="start">1,5 a 2 m de altura.</text><text x="18" y="281" font-size="10.8" fill="#222" text-anchor="start">Pode ser cana + capim também.</text>
<rect x="232" y="46" width="216" height="254" rx="8" fill="#fff" stroke="#2b8a3e" stroke-width="1.8"/><circle cx="252" cy="66" r="13" fill="#2b8a3e"/><text x="252" y="71" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="272" y="71" font-size="13" fill="#1e5a2a" font-weight="bold" text-anchor="start">Pique miúdo</text><g transform="translate(232,46)"><rect x="40" y="100" width="140" height="24" rx="10" fill="#9cbf5a" stroke="#1e1e1e" stroke-width="1.5"/><rect x="50" y="88" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(-30 54 90)"/><rect x="63" y="86" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(7 67 90)"/><rect x="76" y="84" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(-16 80 90)"/><rect x="89" y="88" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(21 93 90)"/><rect x="102" y="86" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(-2 106 90)"/><rect x="115" y="84" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(-25 119 90)"/><rect x="128" y="88" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(12 132 90)"/><rect x="141" y="86" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(-11 145 90)"/><rect x="154" y="84" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(26 158 90)"/><rect x="167" y="88" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(3 171 90)"/><rect x="50" y="94" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(-20 54 98)"/><rect x="63" y="92" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(17 67 98)"/><rect x="76" y="96" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(-6 80 98)"/><rect x="89" y="94" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(-29 93 98)"/><rect x="102" y="92" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(8 106 98)"/><rect x="115" y="96" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(-15 119 98)"/><rect x="128" y="94" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(22 132 98)"/><rect x="141" y="92" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(-1 145 98)"/><rect x="154" y="96" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(-24 158 98)"/><rect x="167" y="94" width="9" height="5" fill="#7aa63c" stroke="#3d5a1a" stroke-width="0.8" transform="rotate(13 171 98)"/><g transform="rotate(-30 120 62)"><rect x="80" y="56" width="80" height="12" rx="3" fill="#c0c0c0" stroke="#1e1e1e" stroke-width="1.5"/><rect x="158" y="54" width="30" height="16" rx="4" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="1.5"/></g><text x="110" y="140" font-size="10.5" text-anchor="middle" fill="#b3001b" font-weight="bold">pedaços de 1–2 cm</text></g><text x="242" y="206" font-size="10.8" fill="#222" text-anchor="start">Picadeira, ou facão em cepo.</text><text x="242" y="221" font-size="10.8" fill="#222" text-anchor="start">Pedaço pequeno compacta</text><text x="242" y="236" font-size="10.8" fill="#222" text-anchor="start">melhor e expulsa o ar.</text><text x="242" y="251" font-size="10.8" fill="#222" text-anchor="start">Pique e ensile no MESMO dia</text><text x="242" y="266" font-size="10.8" fill="#222" text-anchor="start">(no máximo em 1–2 dias para</text><text x="242" y="281" font-size="10.8" fill="#222" text-anchor="start">encher e fechar o tambor).</text>
<rect x="456" y="46" width="216" height="254" rx="8" fill="#fff" stroke="#2b8a3e" stroke-width="1.8"/><circle cx="476" cy="66" r="13" fill="#2b8a3e"/><text x="476" y="71" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="496" y="71" font-size="13" fill="#1e5a2a" font-weight="bold" text-anchor="start">Encha e soque</text><g transform="translate(456,46)"><rect x="60" y="62" width="80" height="84" fill="#3f6d9e" stroke="#1e1e1e" stroke-width="2"/><rect x="64" y="85.0" width="72" height="57.0" fill="#9cbf5a"/><line x1="64" y1="126" x2="136" y2="126" stroke="#5d7f2a" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="64" y1="108" x2="136" y2="108" stroke="#5d7f2a" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="64" y1="90" x2="136" y2="90" stroke="#5d7f2a" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="60" y1="87.2" x2="140" y2="87.2" stroke="#1e1e1e" stroke-width="1.5"/><line x1="60" y1="120.8" x2="140" y2="120.8" stroke="#1e1e1e" stroke-width="1.5"/><rect x="94" y="40" width="12" height="44" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="1.5"/><rect x="84" y="82" width="32" height="12" rx="3" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="1.5"/><line x1="160" y1="50" x2="160.0" y2="80.0" stroke="#b3001b" stroke-width="3"/><polygon points="160,86 154.8,75.2 165.2,75.2" fill="#b3001b"/><text x="150" y="104" font-size="10" fill="#333">camadas</text><text x="150" y="116" font-size="10" fill="#333">de 10–15 cm</text></g><text x="466" y="206" font-size="10.8" fill="#222" text-anchor="start">Camadas de 10–15 cm: soque</text><text x="466" y="221" font-size="10.8" fill="#222" text-anchor="start">ou pise cada uma com força.</text><text x="466" y="236" font-size="10.8" fill="#222" text-anchor="start">O segredo é tirar o AR.</text><text x="466" y="251" font-size="10.8" fill="#222" text-anchor="start">Tambor de 200 L leva</text><text x="466" y="266" font-size="10.8" fill="#222" text-anchor="start">120–150 kg; saco grosso</text><text x="466" y="281" font-size="10.8" fill="#222" text-anchor="start">(200 micra) leva 40–60 kg.</text>
<rect x="8" y="308" width="216" height="254" rx="8" fill="#fff" stroke="#2b8a3e" stroke-width="1.8"/><circle cx="28" cy="328" r="13" fill="#2b8a3e"/><text x="28" y="333" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="48" y="333" font-size="13" fill="#1e5a2a" font-weight="bold" text-anchor="start">Feche sem ar</text><g transform="translate(8,308)"><rect x="60" y="74" width="80" height="72" fill="#3f6d9e" stroke="#1e1e1e" stroke-width="2"/><rect x="64" y="76.0" width="72" height="66.0" fill="#9cbf5a"/><line x1="64" y1="126" x2="136" y2="126" stroke="#5d7f2a" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="64" y1="108" x2="136" y2="108" stroke="#5d7f2a" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="64" y1="90" x2="136" y2="90" stroke="#5d7f2a" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="60" y1="95.6" x2="140" y2="95.6" stroke="#1e1e1e" stroke-width="1.5"/><line x1="60" y1="124.4" x2="140" y2="124.4" stroke="#1e1e1e" stroke-width="1.5"/><rect x="56" y="66" width="88" height="10" rx="2" fill="#2f5277" stroke="#1e1e1e" stroke-width="1.8"/><path d="M54 68 q46 -16 92 0 l0 8 q-46 -10 -92 0 Z" fill="#dfe8f0" fill-opacity="0.8" stroke="#555"/><rect x="78" y="40" width="44" height="26" rx="8" fill="#e8d3b0" stroke="#1e1e1e" stroke-width="1.6"/><text x="100" y="58" font-size="9.5" text-anchor="middle" fill="#5a4630">areia</text></g><text x="18" y="468" font-size="10.8" fill="#222" text-anchor="start">Plástico por cima, encostado</text><text x="18" y="483" font-size="10.8" fill="#222" text-anchor="start">na massa; tampa bem presa</text><text x="18" y="498" font-size="10.8" fill="#222" text-anchor="start">e peso em cima (saco de</text><text x="18" y="513" font-size="10.8" fill="#222" text-anchor="start">areia, pedra). Saco: aperte</text><text x="18" y="528" font-size="10.8" fill="#222" text-anchor="start">para sair o ar e amarre.</text><text x="18" y="543" font-size="10.8" fill="#b3001b" font-weight="bold" text-anchor="start">Furo = mofo. Tape com fita.</text>
<rect x="232" y="308" width="216" height="254" rx="8" fill="#fff" stroke="#2b8a3e" stroke-width="1.8"/><circle cx="252" cy="328" r="13" fill="#2b8a3e"/><text x="252" y="333" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="272" y="333" font-size="13" fill="#1e5a2a" font-weight="bold" text-anchor="start">Espere fermentar</text><g transform="translate(232,308)"><rect x="60" y="44" width="96" height="96" rx="6" fill="#fff" stroke="#1e1e1e" stroke-width="2"/><rect x="60" y="44" width="96" height="22" rx="6" fill="#d62828" stroke="#1e1e1e" stroke-width="2"/><rect x="66.0" y="72" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="78.5" y="72" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="91.0" y="72" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="103.5" y="72" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="116.0" y="72" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="128.5" y="72" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="141.0" y="72" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="66.0" y="85" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="78.5" y="85" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="91.0" y="85" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="103.5" y="85" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="116.0" y="85" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="128.5" y="85" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="141.0" y="85" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="66.0" y="98" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="78.5" y="98" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="91.0" y="98" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="103.5" y="98" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="116.0" y="98" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="128.5" y="98" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="141.0" y="98" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="66.0" y="111" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="78.5" y="111" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="91.0" y="111" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="103.5" y="111" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="116.0" y="111" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="128.5" y="111" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="141.0" y="111" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="66.0" y="124" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="78.5" y="124" width="9" height="9" fill="#9cbf5a" stroke="#999" stroke-width="0.6"/><rect x="91.0" y="124" width="9" height="9" fill="#eee" stroke="#999" stroke-width="0.6"/><rect x="103.5" y="124" width="9" height="9" fill="#eee" stroke="#999" stroke-width="0.6"/><rect x="116.0" y="124" width="9" height="9" fill="#eee" stroke="#999" stroke-width="0.6"/><rect x="128.5" y="124" width="9" height="9" fill="#eee" stroke="#999" stroke-width="0.6"/><rect x="141.0" y="124" width="9" height="9" fill="#eee" stroke="#999" stroke-width="0.6"/><text x="108" y="60" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">30 DIAS</text></g><text x="242" y="468" font-size="10.8" fill="#222" text-anchor="start">No mínimo 3–4 semanas</text><text x="242" y="483" font-size="10.8" fill="#222" text-anchor="start">fechado, à sombra, longe de</text><text x="242" y="498" font-size="10.8" fill="#222" text-anchor="start">ratos e de furos.</text><text x="242" y="513" font-size="10.8" fill="#222" text-anchor="start">Bem fechada, a silagem</text><text x="242" y="528" font-size="10.8" fill="#222" text-anchor="start">dura mais de 1 ano: é a</text><text x="242" y="543" font-size="10.8" fill="#222" text-anchor="start">comida da seca.</text>
<rect x="456" y="308" width="216" height="254" rx="8" fill="#fff" stroke="#2b8a3e" stroke-width="1.8"/><circle cx="476" cy="328" r="13" fill="#2b8a3e"/><text x="476" y="333" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="496" y="333" font-size="13" fill="#1e5a2a" font-weight="bold" text-anchor="start">Abra e use rápido</text><g transform="translate(456,308)"><rect x="30" y="72" width="70" height="74" fill="#3f6d9e" stroke="#1e1e1e" stroke-width="2"/><rect x="34" y="85.1" width="62" height="56.900000000000006" fill="#9cbf5a"/><line x1="30" y1="94.2" x2="100" y2="94.2" stroke="#1e1e1e" stroke-width="1.5"/><line x1="30" y1="123.8" x2="100" y2="123.8" stroke="#1e1e1e" stroke-width="1.5"/><path d="M130 100 L176 100 L170 146 L136 146 Z" fill="#c0c0c0" stroke="#1e1e1e" stroke-width="1.8"/><ellipse cx="153" cy="100" rx="23" ry="6" fill="#9cbf5a" stroke="#1e1e1e" stroke-width="1.5"/><path d="M58 66 q4 -10 0 -18 M72 66 q4 -10 0 -18" fill="none" stroke="#2b8a3e" stroke-width="2"/><text x="88" y="60" font-size="10" fill="#2b8a3e" font-weight="bold">cheiro azedinho</text></g><text x="466" y="468" font-size="10.8" fill="#222" text-anchor="start">Boa: verde-amarelada, cheiro</text><text x="466" y="483" font-size="10.8" fill="#222" text-anchor="start">azedo agradável (de fruta).</text><text x="466" y="498" font-size="10.8" fill="#222" text-anchor="start">Gaste o tambor aberto em</text><text x="466" y="513" font-size="10.8" fill="#222" text-anchor="start">2–4 dias; tampe entre usos.</text><text x="466" y="528" font-size="10.8" fill="#b3001b" font-weight="bold" text-anchor="start">Mofada, preta, gosmenta ou</text><text x="466" y="543" font-size="10.8" fill="#b3001b" font-weight="bold" text-anchor="start">cheiro de podre: JOGUE FORA.</text>
<rect x="8" y="574" width="664" height="100" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="20" y="594" font-size="11.4" fill="#222" text-anchor="start"><tspan font-weight="bold">Teste do punho (umidade certa):</tspan> aperte um punhado da massa picada por 30 segundos e abra a mão.</text>
<text x="20" y="612" font-size="11.4" fill="#222" text-anchor="start">• Escorre caldo, ou a bola fica firme e a mão molhada: úmido demais. Deixe murchar 4–6 h ao sol</text>
<text x="20" y="628" font-size="11.4" fill="#222" text-anchor="start">   ou misture 5–10% de fubá ou farelo.  • A bola se abre devagar e a mão fica só úmida: PONTO CERTO.</text>
<text x="20" y="644" font-size="11.4" fill="#222" text-anchor="start">• Desmancha na hora: seco demais (compacta mal e mofa); corte a lavoura mais cedo da próxima vez.</text>
<text x="20" y="664" font-size="11.6" fill="#222" font-weight="bold" text-anchor="start">Vaca adulta: 20–30 kg de silagem/dia. Cabra ou ovelha: 2–4 kg. Sempre com algum capim.</text>
</svg>
