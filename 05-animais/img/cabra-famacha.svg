<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 644" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="644" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">FAMACHA: a cor do olho diz quem precisa de vermífugo</text>
<rect x="24" y="58" width="236" height="232" rx="18" fill="#e9dcc4" stroke="#b9a37a" stroke-width="1.5"/>
<path d="M70 150 Q140 108 210 150 Q140 176 70 150 Z" fill="#fff" stroke="#1e1e1e" stroke-width="2.5"/>
<ellipse cx="140" cy="148" rx="24" ry="17" fill="#c99a2e" stroke="#1e1e1e" stroke-width="1.8"/>
<rect x="122" y="143" width="36" height="10" rx="5" fill="#1e1e1e"/>
<circle cx="150" cy="141" r="2.5" fill="#fff"/>
<path d="M76 158 Q140 182 204 158 Q206 172 196 186 Q140 214 84 186 Q74 172 76 158 Z" fill="#d9475a" stroke="#7a1020" stroke-width="2"/>
<path d="M84 186 Q140 214 196 186" fill="none" stroke="#a78a5f" stroke-width="5"/>
<g transform="rotate(-8 140 84)"><rect x="104" y="58" width="74" height="54" rx="26" fill="#f2c9a5" stroke="#1e1e1e" stroke-width="2"/><rect x="124" y="60" width="34" height="22" rx="9" fill="#f8e1cf" stroke="#1e1e1e" stroke-width="1.2"/></g>
<g transform="rotate(6 140 232)"><rect x="102" y="204" width="76" height="56" rx="26" fill="#f2c9a5" stroke="#1e1e1e" stroke-width="2"/><rect x="122" y="236" width="34" height="22" rx="9" fill="#f8e1cf" stroke="#1e1e1e" stroke-width="1.2"/></g>
<line x1="196" y1="70" x2="196.0" y2="92.0" stroke="#555" stroke-width="3"/><polygon points="196,98 190.8,87.2 201.2,87.2" fill="#555"/>
<line x1="196" y1="232" x2="196.0" y2="256.0" stroke="#555" stroke-width="3"/><polygon points="196,262 190.8,251.2 201.2,251.2" fill="#555"/>
<text x="204" y="82" font-size="10.5" fill="#333" text-anchor="start">empurra</text>
<text x="204" y="246" font-size="10.5" fill="#333" text-anchor="start">puxa</text>
<text x="204" y="258" font-size="10.5" fill="#333" text-anchor="start">para baixo</text>
<text x="140" y="284" font-size="11" fill="#b3001b" font-weight="bold" text-anchor="middle">a faixa rosa/vermelha é a MUCOSA</text>
<text x="276" y="76" font-size="12" fill="#222" text-anchor="start"><tspan font-weight="bold">1.</tspan> Segure o animal. Olhe à luz do dia, na</text>
<text x="276" y="96" font-size="12" fill="#222" text-anchor="start">     sombra (nem sol direto, nem lanterna).</text>
<text x="276" y="116" font-size="12" fill="#222" text-anchor="start"><tspan font-weight="bold">2.</tspan> Polegar de cima empurra a pálpebra de</text>
<text x="276" y="136" font-size="12" fill="#222" text-anchor="start">     cima; o olho “afunda” um pouco.</text>
<text x="276" y="156" font-size="12" fill="#222" text-anchor="start"><tspan font-weight="bold">3.</tspan> Polegar de baixo puxa a pálpebra de</text>
<text x="276" y="176" font-size="12" fill="#222" text-anchor="start">     baixo para baixo: aparece a mucosa.</text>
<text x="276" y="196" font-size="12" fill="#222" text-anchor="start"><tspan font-weight="bold">4.</tspan> Olhe o MEIO da mucosa (não o canto)</text>
<text x="276" y="216" font-size="12" fill="#222" text-anchor="start">     e compare com o cartão em 1–2 segundos.</text>
<text x="276" y="236" font-size="12" fill="#222" text-anchor="start"><tspan font-weight="bold">5.</tspan> Repita a cada 15 dias nas chuvas e 30</text>
<text x="276" y="256" font-size="12" fill="#222" text-anchor="start">     na seca. Anote o grau de cada animal.</text>
<rect x="16" y="306" width="648" height="292" rx="10" fill="#fff" stroke="#1e1e1e" stroke-width="2"/>
<text x="340" y="328" font-size="13.5" fill="#222" font-weight="bold" text-anchor="middle">Cartão de cores (FAMACHA) — cor da mucosa e o que fazer</text>
<rect x="28" y="340" width="120" height="44" rx="6" fill="#b9182b" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="88" y="369" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="160" y="358" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Vermelho vivo</text>
<text x="160" y="375" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">Ótimo</text>
<text x="300" y="367" font-size="12" fill="#222" text-anchor="start">NÃO vermifugar</text>
<rect x="28" y="390" width="120" height="44" rx="6" fill="#d9475a" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="88" y="419" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="160" y="408" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Vermelho-rosado</text>
<text x="160" y="425" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">Bom</text>
<text x="300" y="417" font-size="12" fill="#222" text-anchor="start">NÃO vermifugar</text>
<rect x="28" y="440" width="120" height="44" rx="6" fill="#ee8996" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="88" y="469" font-size="20" fill="#222" font-weight="bold" text-anchor="middle">3</text>
<text x="160" y="458" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Rosa</text>
<text x="160" y="475" font-size="11.5" fill="#c06000" font-weight="bold" text-anchor="start">Limite</text>
<text x="300" y="458" font-size="12" fill="#222" text-anchor="start">Vermifugar se jovem, prenhe, parida,</text>
<text x="300" y="475" font-size="12" fill="#222" text-anchor="start">magra, ou se muitos estão em 3</text>
<rect x="28" y="490" width="120" height="44" rx="6" fill="#f6c4ca" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="88" y="519" font-size="20" fill="#222" font-weight="bold" text-anchor="middle">4</text>
<text x="160" y="508" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Rosa-pálido</text>
<text x="160" y="525" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">Anemia</text>
<text x="300" y="517" font-size="12" fill="#222" font-weight="bold" text-anchor="start">VERMIFUGAR já e reforçar a comida</text>
<rect x="28" y="540" width="120" height="44" rx="6" fill="#fbeeee" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="88" y="569" font-size="20" fill="#222" font-weight="bold" text-anchor="middle">5</text>
<text x="160" y="558" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Branco</text>
<text x="160" y="575" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">Anemia grave</text>
<text x="300" y="558" font-size="12" fill="#222" font-weight="bold" text-anchor="start">VERMIFUGAR, separar, comida boa, sem</text>
<text x="300" y="575" font-size="12" fill="#222" font-weight="bold" text-anchor="start">correr: risco de morte</text>
<text x="340" y="616" font-size="11.2" fill="#444" text-anchor="middle">Cores impressas ou na tela variam: use como guia; o cartão oficial é mais confiável.</text>
<text x="340" y="632" font-size="11.2" fill="#444" text-anchor="middle">Só detecta o verme que suga sangue (Haemonchus). Diarreia, magreza e papo inchado também pedem vermífugo.</text>
</svg>
