<text x="456.0" y="326.0" font-size="11" fill="#b3001b" font-weight="bold" text-anchor="start">do chão</text>
<text x="456" y="108" font-size="11.3" fill="#222" font-weight="bold" text-anchor="start">Bebedouro: chupeta com</text>
<text x="456" y="122" font-size="11.3" fill="#222" text-anchor="start">garrafa, ou pote pesado</text>
<line x1="452" y1="104" x2="80" y2="130" stroke="#555" stroke-width="1.2"/><circle cx="80" cy="130" r="2.5" fill="#555"/>
<text x="456" y="144" font-size="11.3" fill="#222" font-weight="bold" text-anchor="start">Comedouro de chapa na</text>
<text x="456" y="158" font-size="11.3" fill="#222" text-anchor="start">porta: abastece por fora</text>
<line x1="452" y1="140" x2="290" y2="212.0" stroke="#555" stroke-width="1.2"/><circle cx="290" cy="212.0" r="2.5" fill="#555"/>
<text x="456" y="180" font-size="11.3" fill="#222" font-weight="bold" text-anchor="start">Ninho 40 × 30 × 25 cm</text>
<text x="456" y="194" font-size="11.3" fill="#222" text-anchor="start">(comprimento × largura ×</text>
<text x="456" y="208" font-size="11.3" fill="#222" text-anchor="start">altura), passagem de 15 cm,</text>
<text x="456" y="222" font-size="11.3" fill="#222" text-anchor="start">borda de 10 cm; coloque</text>
<text x="456" y="236" font-size="11.3" fill="#222" text-anchor="start">no dia 26–28 da gestação</text>
<line x1="452" y1="176" x2="416.0" y2="192.0" stroke="#555" stroke-width="1.2"/><circle cx="416.0" cy="192.0" r="2.5" fill="#555"/>
<text x="80" y="290.0" font-size="10.5" fill="#5a4630" font-weight="bold" text-anchor="start">tábua de descanso sobre a tela</text>
<text x="80" y="302.0" font-size="10.5" fill="#5a4630" text-anchor="start">(evita ferida nas patas)</text>
<text x="238.0" y="459" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">minhocário ou esterqueira: o esterco cai pela tela e vira adubo</text>
<rect x="16" y="484" width="648" height="94" rx="8" fill="#eef7ee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="30" y="504" font-size="11.8" fill="#222" text-anchor="start">Matriz: 80 × 60 × 45 cm · Macho: 60 × 60 × 45 cm · Engorda: 80 × 60 cm para 6–8 coelhos.</text>
<text x="30" y="522" font-size="11.8" fill="#222" text-anchor="start">Piso de tela galvanizada de malha 1,3 × 2,5 cm, arame grosso (fio 14). Laterais: malha 2,5 × 5 cm.</text>
<text x="30" y="540" font-size="11.8" fill="#222" text-anchor="start">Galpão com sombra, ventilado, protegido de chuva, ratos, cães e cobras. Ideal: 15–21 °C;</text>
<text x="30" y="558" font-size="11.8" fill="#b3001b" font-weight="bold" text-anchor="start">acima de 30 °C o coelho sofre e pode morrer.</text>
