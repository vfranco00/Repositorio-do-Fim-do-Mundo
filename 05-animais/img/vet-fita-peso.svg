<path d="M189,100 C209,150 209,216 189,266" fill="none" stroke="#d62828" stroke-width="7"/>
<text x="195.48" y="74.08" font-size="13" fill="#b3001b" font-weight="bold" text-anchor="middle">A = perímetro torácico</text>
<text x="195.48" y="89.08" font-size="11.5" fill="#b3001b" text-anchor="middle">(fita justa, logo atrás das patas da frente)</text>
<line x1="137" y1="228" x2="411" y2="156" stroke="#1f5fa8" stroke-width="3" stroke-dasharray="9 5"/>
<circle cx="137" cy="228" r="6" fill="#1f5fa8"/><circle cx="411" cy="156" r="6" fill="#1f5fa8"/>
<text x="127.0" y="250.0" font-size="11.5" fill="#1f5fa8" font-weight="bold" text-anchor="middle">ponta da paleta</text>
<text x="380.88" y="129.83999999999997" font-size="11.5" fill="#1f5fa8" font-weight="bold" text-anchor="middle">ponta da</text>
<text x="380.88" y="143.83999999999997" font-size="11.5" fill="#1f5fa8" font-weight="bold" text-anchor="middle">nádega</text>
<text x="236" y="232" font-size="13" fill="#1f5fa8" font-weight="bold" text-anchor="start">B = comprimento</text>
<rect x="462" y="52" width="206" height="330" rx="8" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="565" y="70" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">Bovino: só a fita (A)</text>
<text x="500" y="92" font-size="12" fill="#555" font-weight="bold" text-anchor="middle">A (cm)</text>
<text x="602" y="92" font-size="12" fill="#555" font-weight="bold" text-anchor="middle">peso aprox. (kg)</text>
<rect x="466" y="99" width="198" height="21" fill="#f1f1f1"/>
<text x="500" y="114" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">100</text>
<text x="602" y="114" font-size="13" fill="#222" text-anchor="middle">70</text>
<text x="500" y="136" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">110</text>
<text x="602" y="136" font-size="13" fill="#222" text-anchor="middle">95</text>
<rect x="466" y="143" width="198" height="21" fill="#f1f1f1"/>
<text x="500" y="158" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">120</text>
<text x="602" y="158" font-size="13" fill="#222" text-anchor="middle">120</text>
<text x="500" y="180" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">130</text>
<text x="602" y="180" font-size="13" fill="#222" text-anchor="middle">155</text>
<rect x="466" y="187" width="198" height="21" fill="#f1f1f1"/>
<text x="500" y="202" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">140</text>
<text x="602" y="202" font-size="13" fill="#222" text-anchor="middle">190</text>
<text x="500" y="224" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">150</text>
<text x="602" y="224" font-size="13" fill="#222" text-anchor="middle">235</text>
<rect x="466" y="231" width="198" height="21" fill="#f1f1f1"/>
<text x="500" y="246" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">160</text>
<text x="602" y="246" font-size="13" fill="#222" text-anchor="middle">285</text>
<text x="500" y="268" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">170</text>
<text x="602" y="268" font-size="13" fill="#222" text-anchor="middle">345</text>
<rect x="466" y="275" width="198" height="21" fill="#f1f1f1"/>
<text x="500" y="290" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">180</text>
<text x="602" y="290" font-size="13" fill="#222" text-anchor="middle">410</text>
<text x="500" y="312" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">190</text>
<text x="602" y="312" font-size="13" fill="#222" text-anchor="middle">480</text>
<rect x="466" y="319" width="198" height="21" fill="#f1f1f1"/>
<text x="500" y="334" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">200</text>
<text x="602" y="334" font-size="13" fill="#222" text-anchor="middle">560</text>
<text x="500" y="356" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">210</text>
<text x="602" y="356" font-size="13" fill="#222" text-anchor="middle">650</text>
<rect x="16" y="400" width="440" height="150" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="28" y="422" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Mais preciso (fita A e comprimento B, em cm):</text>
<text x="28" y="446" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="start">Bovino:   peso (kg) = A × A × B ÷ 10.840</text>
<text x="28" y="468" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="start">Cavalo:   peso (kg) = A × A × B ÷ 11.880</text>
<text x="28" y="490" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="start">Porco:     peso (kg) = A × A × B ÷ 14.400</text>
<text x="28" y="508" font-size="11.5" fill="#444" text-anchor="start">(no porco, B vai do meio das orelhas até a raiz do rabo)</text>
<text x="28" y="532" font-size="12" fill="#2b6a1e" font-weight="bold" text-anchor="start">Ex.: A = 190, B = 150 → 190×190×150 ÷ 10.840 = 500 kg</text>
<rect x="466" y="400" width="198" height="150" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
<text x="478" y="422" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Sem fita métrica:</text>
<text x="478" y="442" font-size="12" fill="#222" text-anchor="start">dê a volta com um</text>
<text x="478" y="458" font-size="12" fill="#222" text-anchor="start">barbante, marque com</text>
<text x="478" y="474" font-size="12" fill="#222" text-anchor="start">um nó e meça depois</text>
<text x="478" y="490" font-size="12" fill="#222" text-anchor="start">numa trena ou régua.</text>
<text x="478" y="514" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Cabra, ovelha, cão:</text>
<text x="478" y="530" font-size="12" fill="#222" text-anchor="start">suba na balança com</text>
<text x="478" y="546" font-size="12" fill="#222" text-anchor="start">ele no colo e desconte.</text>
<rect x="16" y="560" width="648" height="50" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="28" y="580" font-size="12.5" fill="#222" text-anchor="start">Animal em pé, parado, cabeça na altura normal. Meça 2 vezes e use a média.</text>
<text x="28" y="598" font-size="12.5" fill="#222" text-anchor="start">Erro de ±10% (gordo, magro e prenhe variam). Serve para dose de remédio e ganho de peso.</text>
</svg>
