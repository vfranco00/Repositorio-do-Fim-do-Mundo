<line x1="327" y1="143" x2="345" y2="161" stroke="#b3001b" stroke-width="5"/><line x1="327" y1="161" x2="345" y2="143" stroke="#b3001b" stroke-width="5"/>
<text x="246.88" y="196.0" font-size="12.5" fill="#1f5fa8" font-weight="bold" text-anchor="middle">rúmen (pança)</text>
<text x="246.88" y="211.0" font-size="12.5" fill="#1f5fa8" font-weight="bold" text-anchor="middle">cheio de gás</text>
<line x1="284" y1="250" x2="264" y2="310" stroke="#6b4f2a" stroke-width="1.5"/>
<text x="263.84" y="323.76" font-size="11.5" fill="#6b4f2a" font-weight="bold" text-anchor="middle">última costela</text>
<line x1="375" y1="125" x2="415" y2="99" stroke="#6b4f2a" stroke-width="1.5"/>
<text x="418.56" y="95.44" font-size="11.5" fill="#6b4f2a" font-weight="bold" text-anchor="start">ponta do quadril</text>
<line x1="344" y1="142" x2="376" y2="80" stroke="#b3001b" stroke-width="1.5"/>
<text x="349.92" y="60.31999999999999" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start">X = vão do flanco ESQUERDO</text>
<text x="349.92" y="75.32" font-size="11.5" fill="#b3001b" text-anchor="start">(atrás da última costela)</text>
<text x="14" y="60" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Lado ESQUERDO do boi</text>
<text x="14" y="76" font-size="11.5" fill="#444" text-anchor="start">(cabeça à esquerda)</text>
<rect x="14" y="410" width="652" height="70" rx="8" fill="#ffecec" stroke="#b3001b" stroke-width="1.5"/>
<text x="26" y="431" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Onde: no meio entre a última costela e a ponta do quadril, um palmo (10 cm)</text>
<text x="26" y="450" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">abaixo da linha do lombo, no ponto mais estufado (soa como tambor).</text>
<text x="26" y="469" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start">NUNCA do lado direito (lá ficam intestinos, coagulador e fígado).</text>
<text x="462" y="282" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Trocater (trocarte):</text>
<rect x="462" y="300" width="22" height="20" rx="4" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="2"/>
<rect x="484" y="307" width="140" height="6" fill="#bbb" stroke="#1e1e1e" stroke-width="1.5"/>
<polygon points="624,307 642,310 624,313" fill="#bbb" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="462" y="336" font-size="11.5" fill="#222" text-anchor="start">1. estilete pontudo por dentro</text>
<rect x="462" y="348" width="10" height="20" fill="#ccc" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="472" y="353" width="112" height="10" fill="#e6e6e6" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="462" y="386" font-size="11.5" fill="#222" text-anchor="start">2. tira o estilete: a cânula</text>
<text x="462" y="400" font-size="11.5" fill="#222" text-anchor="start">(tubo) fica e o gás sai</text>
<text x="22" y="504" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">1.</text>
<text x="44" y="504" font-size="12.5" fill="#222" text-anchor="start">Tire do pasto. Faça andar com as patas da frente mais ALTAS (barranco).</text>
<text x="22" y="524" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">2.</text>
<text x="44" y="524" font-size="12.5" fill="#222" text-anchor="start">Pau atravessado na boca, amarrado atrás dos chifres: faz salivar e arrotar.</text>
<text x="22" y="544" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">3.</text>
<text x="44" y="544" font-size="12.5" fill="#222" text-anchor="start">Sonda: mangueira lisa de 2 cm pela boca até o rúmen. Saiu gás = resolveu.</text>
<text x="22" y="564" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start"></text>
<text x="44" y="564" font-size="12.5" fill="#222" text-anchor="start">Se for espuma: 250–500 mL de óleo de cozinha pela sonda (ovelha/cabra: 50–100 mL).</text>
<text x="22" y="584" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start">4.</text>
<text x="44" y="584" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start">ÚLTIMO CASO (caindo, língua roxa, sufocando): trocater no X, firme, mirando</text>
<text x="22" y="604" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start"></text>
<text x="44" y="604" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start">o cotovelo do lado DIREITO. Deixe a cânula; solte o gás aos poucos.</text>
</svg>
