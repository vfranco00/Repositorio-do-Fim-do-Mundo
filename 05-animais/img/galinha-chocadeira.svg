<text x="107" y="232" font-size="11" fill="#1f5fa8" font-weight="bold" text-anchor="middle">UR 55%</text>
<text x="107" y="254" font-size="10" fill="#222" text-anchor="middle">termômetro e</text>
<text x="107" y="265" font-size="10" fill="#222" text-anchor="middle">higrômetro</text>
