<rect x="428" y="204" width="62" height="22" rx="3" fill="#0b2a12"/>
<text x="459" y="221" font-size="15" fill="#3cff6a" font-weight="bold" text-anchor="middle">37.7</text>
<text x="459" y="242" font-size="9.5" fill="#fff" text-anchor="middle">termostato</text>
<path d="M459 196 L459 64 L122 64 L122 92" fill="none" stroke="#333" stroke-width="2"/>
<text x="290" y="84" font-size="11" fill="#222" font-weight="bold" text-anchor="middle">visor de vidro (olhe sem abrir)</text>
<text x="122" y="172" font-size="10.5" fill="#222" text-anchor="middle">lâmpada</text>
<text x="122" y="184" font-size="10.5" fill="#222" font-weight="bold" text-anchor="middle">25–40 W</text>
<text x="178" y="172" font-size="10.5" fill="#222" text-anchor="middle">ventoinha</text>
<text x="178" y="184" font-size="10.5" fill="#222" text-anchor="middle">de PC 12 V</text>
<text x="10" y="344" font-size="10.5" fill="#1f5fa8" font-weight="bold" text-anchor="start">ar</text>
<text x="410" y="120" font-size="10.5" fill="#c06000" font-weight="bold" text-anchor="start">ar</text>
<text x="225" y="316" font-size="10.5" fill="#222" font-weight="bold" text-anchor="middle">tela de arame (o pinto não cai na água)</text>
<text x="225" y="376" font-size="10.5" fill="#1f5fa8" font-weight="bold" text-anchor="middle">bandeja de água: mais área = mais umidade</text>
<text x="288" y="246" font-size="10.5" fill="#b3001b" font-weight="bold" text-anchor="end">sensor na altura</text>
<text x="288" y="258" font-size="10.5" fill="#b3001b" font-weight="bold" text-anchor="end">do TOPO dos ovos</text>
<text x="420" y="266" font-size="10.5" fill="#222" text-anchor="start">liga e desliga a</text>
<text x="420" y="278" font-size="10.5" fill="#222" text-anchor="start">lâmpada sozinho</text>
<text x="420" y="300" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Caixa de isopor de</text>
<text x="420" y="314" font-size="11.5" fill="#222" text-anchor="start">40–60 L, ou de madeira</text>
<text x="420" y="328" font-size="11.5" fill="#222" text-anchor="start">forrada; dentro de um</text>
<text x="420" y="342" font-size="11.5" fill="#222" text-anchor="start">cômodo sem sol e sem</text>
<text x="420" y="356" font-size="11.5" fill="#222" text-anchor="start">vento</text>
<text x="420" y="380" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Marque X e O nos ovos</text>
<text x="420" y="394" font-size="11.5" fill="#222" text-anchor="start">para saber se virou todos</text>
<rect x="20" y="410" width="640" height="128" rx="8" fill="#f6f9ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="34" y="432" font-size="12" fill="#1f3f6e" font-weight="bold" text-anchor="start">Temperatura</text>
<text x="128" y="432" font-size="11.6" fill="#222" text-anchor="start">37,5–37,8 °C com ventoinha. Sem ventoinha: 38,3 °C no topo dos ovos.</text>
<text x="34" y="454" font-size="12" fill="#1f3f6e" font-weight="bold" text-anchor="start">Umidade</text>
<text x="128" y="454" font-size="11.6" fill="#222" text-anchor="start">50–55% do dia 1 ao 18; 65–70% do dia 19 ao 21 (encha mais a bandeja).</text>
<text x="34" y="476" font-size="12" fill="#1f3f6e" font-weight="bold" text-anchor="start">Virar</text>
<text x="128" y="476" font-size="11.6" fill="#222" text-anchor="start">3 a 5 vezes por dia (número ímpar) do dia 1 ao 18. Do dia 18 em diante: NÃO vire.</text>
<text x="34" y="498" font-size="12" fill="#1f3f6e" font-weight="bold" text-anchor="start">Ovos</text>
<text x="128" y="498" font-size="11.6" fill="#222" text-anchor="start">Limpos, sem rachar, com até 7 dias, guardados a 15–18 °C de ponta fina para baixo.</text>
<text x="34" y="520" font-size="12" fill="#1f3f6e" font-weight="bold" text-anchor="start">Antes</text>
<text x="128" y="520" font-size="11.6" fill="#222" text-anchor="start">Ligue a chocadeira vazia 24–48 h e só ponha os ovos com a temperatura estável.</text>
<text x="340" y="558" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="middle">Calor demais mata mais que frio: 40 °C por algumas horas mata os embriões.</text>
<text x="340" y="574" font-size="11.5" fill="#222" text-anchor="middle">Faltou luz? Esfriar 1–2 h quase sempre não mata: tampe a caixa com um cobertor.</text>
</svg>
