<text x="456" y="98" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Lanternim: o ar quente</text>
<text x="456" y="112" font-size="11.5" fill="#222" text-anchor="start">sai pela abertura de cima</text>
<text x="456" y="140" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Beiral de 50 cm a 1 m:</text>
<text x="456" y="154" font-size="11.5" fill="#222" text-anchor="start">a chuva não entra</text>
<text x="456" y="222" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Pé-direito (altura da</text>
<text x="456" y="236" font-size="11.5" fill="#222" text-anchor="start">parede): 2,5 a 3 m</text>
<text x="456" y="268" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Laterais de tela de arame</text>
<text x="456" y="282" font-size="11.5" fill="#222" text-anchor="start">(malha de até 2,5 cm)</text>
<text x="456" y="325" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Ninho 30 × 30 × 35 cm,</text>
<text x="456" y="339" font-size="11.5" fill="#222" text-anchor="start">a 40–60 cm do chão, escuro;</text>
<text x="456" y="410" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Mureta de 20–40 cm:</text>
<text x="456" y="424" font-size="11.5" fill="#222" text-anchor="start">segura a cama, corta vento</text>
<text x="456" y="353" font-size="11.5" fill="#222" text-anchor="start">1 ninho para 4–5 galinhas</text>
