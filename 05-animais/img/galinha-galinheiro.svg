<text x="306" y="348" font-size="10.5" fill="#222" text-anchor="start">comedouro na</text>
<text x="306" y="360" font-size="10.5" fill="#222" text-anchor="start">altura do dorso</text>
<text x="236" y="360" font-size="10.5" fill="#222" text-anchor="middle">água</text>
<text x="74" y="466" font-size="11.5" fill="#5a4630" text-anchor="start">Cama seca de 5–10 cm (maravalha, palha, casca de arroz ou de café). Troque se empelotar.</text>
<rect x="20" y="494" width="640" height="88" rx="8" fill="#eef7ee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="34" y="514" font-size="11.8" fill="#222" text-anchor="start">Espaço: 1 m² de galinheiro para 3–5 galinhas + piquete de 3–5 m² por ave (ideal: 10 m²).</text>
<text x="34" y="532" font-size="11.8" fill="#222" text-anchor="start">Poleiro: 20–25 cm de vara por ave; vara de 4–5 cm de grossura, cantos arredondados.</text>
<text x="34" y="550" font-size="11.8" fill="#222" text-anchor="start">Galpão comprido no sentido leste-oeste (menos sol dentro). Telha de barro ou palha.</text>
<text x="34" y="568" font-size="11.8" fill="#222" text-anchor="start">Fibrocimento sem forro esquenta demais. Porta e tela que gambá e cachorro não abram.</text>
</svg>
