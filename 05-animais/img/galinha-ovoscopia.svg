<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 686" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="686" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Ovoscopia: ver o que tem dentro do ovo</text>
<defs><radialGradient id="luz" cx="50%" cy="55%" r="60%"><stop offset="0" stop-color="#fff3c4"/><stop offset="0.7" stop-color="#f6c065"/><stop offset="1" stop-color="#e08a2a"/></radialGradient></defs><rect x="40" y="96" width="44" height="70" rx="4" fill="#9a9a9a" stroke="#1e1e1e" stroke-width="2"/>
<rect x="34" y="88" width="56" height="10" rx="3" fill="#6b6b6b" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="62" cy="88" rx="11" ry="3" fill="#fff6c8" stroke="#1e1e1e" stroke-width="1"/>
<path d="M62,42.0 C84.5,42.0 79.5,86.0 62,86.0 C44.5,86.0 39.5,42.0 62,42.0 Z" fill="url(#luz)" stroke="#1e1e1e" stroke-width="2" transform="rotate(180 62 64)"/>
<text x="62" y="184" font-size="10.5" fill="#333" text-anchor="middle">lanterna dentro</text>
<text x="62" y="196" font-size="10.5" fill="#333" text-anchor="middle">de lata/tubo</text>
<text x="112" y="70" font-size="12" fill="#222" text-anchor="start"><tspan font-weight="bold">1.</tspan> Quarto escuro. Lanterna forte (serve a do celular) dentro de lata ou tubo</text>
<text x="112" y="88" font-size="12" fill="#222" text-anchor="start">     de papelão, com furo de 2,5–3 cm em cima.</text>
<text x="112" y="106" font-size="12" fill="#222" text-anchor="start"><tspan font-weight="bold">2.</tspan> Encoste a ponta GROSSA do ovo no furo e gire devagar. Seja rápido:</text>
<text x="112" y="124" font-size="12" fill="#222" text-anchor="start">     no máximo 10–20 segundos fora do calor por ovo.</text>
<text x="112" y="142" font-size="12" fill="#222" text-anchor="start"><tspan font-weight="bold">3.</tspan> Ovo branco: dá para ver no dia 4–5. Ovo marrom ou escuro: espere o dia 7.</text>
<text x="112" y="160" font-size="12" fill="#222" text-anchor="start"><tspan font-weight="bold">4.</tspan> Tire inférteis e mortos no dia 7–10: eles apodrecem e podem estourar.</text>
<text x="225" y="232" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">Dia 4–5</text>
<text x="385" y="232" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">Dia 10</text>
<text x="545" y="232" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">Dia 18</text>
<rect x="20" y="250" width="640" height="128" rx="8" fill="#f3faf3" stroke="#ddd"/>
<text x="34" y="302" font-size="14" fill="#2b8a3e" font-weight="bold" text-anchor="start">FÉRTIL</text>
<text x="34" y="320" font-size="12" fill="#2b8a3e" text-anchor="start">(vivo)</text>
<clipPath id="ov1"><path d="M225,264.0 C264.0,264.0 255.4,340.0 225,340.0 C194.6,340.0 186.0,264.0 225,264.0 Z"/></clipPath><path d="M225,264.0 C264.0,264.0 255.4,340.0 225,340.0 C194.6,340.0 186.0,264.0 225,264.0 Z" fill="url(#luz)"/><g clip-path="url(#ov1)"><path d="M185,264.0 L265,264.0 L265,273.0 Q225,277.0 185,273.0 Z" fill="#fffbe6"/><path d="M185,273.0 Q225,277.0 265,273.0" fill="none" stroke="#c98a3a" stroke-width="1.5"/><circle cx="225" cy="308" r="18" fill="#e8962e" fill-opacity="0.45"/><path d="M225,308 Q235.0,312.6 247.0,308.0" fill="none" stroke="#c0181b" stroke-width="1.6"/><path d="M225,308 Q227.3,316.7 236.6,321.8" fill="none" stroke="#c0181b" stroke-width="1.6"/><path d="M225,308 Q217.9,315.1 218.2,326.8" fill="none" stroke="#c0181b" stroke-width="1.6"/><path d="M225,308 Q214.4,305.2 203.3,311.8" fill="none" stroke="#c0181b" stroke-width="1.6"/><path d="M225,308 Q221.4,300.3 212.0,297.1" fill="none" stroke="#c0181b" stroke-width="1.6"/><path d="M225,308 Q231.0,299.4 228.6,287.3" fill="none" stroke="#c0181b" stroke-width="1.6"/><path d="M225,308 Q234.0,307.2 240.6,299.0" fill="none" stroke="#c0181b" stroke-width="1.6"/><circle cx="225" cy="308" r="4.5" fill="#3a1206"/></g><path d="M225,264.0 C264.0,264.0 255.4,340.0 225,340.0 C194.6,340.0 186.0,264.0 225,264.0 Z" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="225" y="357" font-size="11" fill="#222" text-anchor="middle">“aranha”: ponto escuro</text>
<text x="225" y="370" font-size="11" fill="#222" text-anchor="middle">com veias vermelhas</text>
<clipPath id="ov2"><path d="M385,264.0 C424.0,264.0 415.4,340.0 385,340.0 C354.6,340.0 346.0,264.0 385,264.0 Z"/></clipPath><path d="M385,264.0 C424.0,264.0 415.4,340.0 385,340.0 C354.6,340.0 346.0,264.0 385,264.0 Z" fill="url(#luz)"/><g clip-path="url(#ov2)"><path d="M345,264.0 L425,264.0 L425,278.0 Q385,282.0 345,278.0 Z" fill="#fffbe6"/><path d="M345,278.0 Q385,282.0 425,278.0" fill="none" stroke="#c98a3a" stroke-width="1.5"/><ellipse cx="387" cy="320" rx="26" ry="22" fill="#4a230c"/><path d="M385,304 q-14,-14 -26,-12" fill="none" stroke="#c0181b" stroke-width="2.2"/><path d="M385,304 q4,-20 18,-26" fill="none" stroke="#c0181b" stroke-width="2.2"/><path d="M385,304 q16,-6 26,-20" fill="none" stroke="#c0181b" stroke-width="2.2"/><path d="M385,304 q-20,-2 -30,-22" fill="none" stroke="#c0181b" stroke-width="2.2"/></g><path d="M385,264.0 C424.0,264.0 415.4,340.0 385,340.0 C354.6,340.0 346.0,264.0 385,264.0 Z" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="385" y="357" font-size="11" fill="#222" text-anchor="middle">metade escura, veias</text>
<text x="385" y="370" font-size="11" fill="#222" text-anchor="middle">grossas na parte clara</text>
<clipPath id="ov3"><path d="M545,264.0 C584.0,264.0 575.4,340.0 545,340.0 C514.6,340.0 506.0,264.0 545,264.0 Z"/></clipPath><path d="M545,264.0 C584.0,264.0 575.4,340.0 545,340.0 C514.6,340.0 506.0,264.0 545,264.0 Z" fill="url(#luz)"/><g clip-path="url(#ov3)"><path d="M505,264.0 L585,264.0 L585,296.0 Q545,282.0 505,290.0 Z" fill="#fffbe6"/><path d="M505,290.0 Q545,282.0 585,296.0 L585,340.0 L505,340.0 Z" fill="#4a230c"/><path d="M505,290.0 Q545,282.0 585,296.0" fill="none" stroke="#2a1205" stroke-width="2"/></g><path d="M545,264.0 C584.0,264.0 575.4,340.0 545,340.0 C514.6,340.0 506.0,264.0 545,264.0 Z" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="545" y="357" font-size="11" fill="#222" text-anchor="middle">quase todo escuro;</text>
<text x="545" y="370" font-size="11" fill="#222" text-anchor="middle">câmara de ar grande</text>
<rect x="20" y="385" width="640" height="128" rx="8" fill="#f7f7f7" stroke="#ddd"/>
<text x="34" y="437" font-size="14" fill="#666" font-weight="bold" text-anchor="start">INFÉRTIL</text>
<text x="34" y="455" font-size="12" fill="#666" text-anchor="start">(sem pinto)</text>
<clipPath id="ov4"><path d="M225,399.0 C264.0,399.0 255.4,475.0 225,475.0 C194.6,475.0 186.0,399.0 225,399.0 Z"/></clipPath><path d="M225,399.0 C264.0,399.0 255.4,475.0 225,475.0 C194.6,475.0 186.0,399.0 225,399.0 Z" fill="url(#luz)"/><g clip-path="url(#ov4)"><path d="M185,399.0 L265,399.0 L265,408.0 Q225,412.0 185,408.0 Z" fill="#fffbe6"/><path d="M185,408.0 Q225,412.0 265,408.0" fill="none" stroke="#c98a3a" stroke-width="1.5"/><circle cx="225" cy="443" r="17" fill="#e8962e" fill-opacity="0.55"/></g><path d="M225,399.0 C264.0,399.0 255.4,475.0 225,475.0 C194.6,475.0 186.0,399.0 225,399.0 Z" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="225" y="492" font-size="11" fill="#222" text-anchor="middle">claro, só a sombra</text>
<text x="225" y="505" font-size="11" fill="#222" text-anchor="middle">da gema</text>
<clipPath id="ov5"><path d="M385,399.0 C424.0,399.0 415.4,475.0 385,475.0 C354.6,475.0 346.0,399.0 385,399.0 Z"/></clipPath><path d="M385,399.0 C424.0,399.0 415.4,475.0 385,475.0 C354.6,475.0 346.0,399.0 385,399.0 Z" fill="url(#luz)"/><g clip-path="url(#ov5)"><path d="M345,399.0 L425,399.0 L425,413.0 Q385,417.0 345,413.0 Z" fill="#fffbe6"/><path d="M345,413.0 Q385,417.0 425,413.0" fill="none" stroke="#c98a3a" stroke-width="1.5"/><circle cx="385" cy="443" r="17" fill="#e8962e" fill-opacity="0.55"/></g><path d="M385,399.0 C424.0,399.0 415.4,475.0 385,475.0 C354.6,475.0 346.0,399.0 385,399.0 Z" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="385" y="492" font-size="11" fill="#222" text-anchor="middle">continua claro</text>
<text x="385" y="505" font-size="11" fill="#222" text-anchor="middle"></text>
<clipPath id="ov6"><path d="M545,399.0 C584.0,399.0 575.4,475.0 545,475.0 C514.6,475.0 506.0,399.0 545,399.0 Z"/></clipPath><path d="M545,399.0 C584.0,399.0 575.4,475.0 545,475.0 C514.6,475.0 506.0,399.0 545,399.0 Z" fill="url(#luz)"/><g clip-path="url(#ov6)"><path d="M505,399.0 L585,399.0 L585,423.0 Q545,427.0 505,423.0 Z" fill="#fffbe6"/><path d="M505,423.0 Q545,427.0 585,423.0" fill="none" stroke="#c98a3a" stroke-width="1.5"/><circle cx="545" cy="443" r="17" fill="#e8962e" fill-opacity="0.55"/></g><path d="M545,399.0 C584.0,399.0 575.4,475.0 545,475.0 C514.6,475.0 506.0,399.0 545,399.0 Z" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="545" y="492" font-size="11" fill="#222" text-anchor="middle">continua claro</text>
<text x="545" y="505" font-size="11" fill="#222" text-anchor="middle">(já devia ter saído)</text>
<rect x="20" y="520" width="640" height="128" rx="8" fill="#fdf1f1" stroke="#ddd"/>
<text x="34" y="572" font-size="14" fill="#b3001b" font-weight="bold" text-anchor="start">MORTO</text>
<text x="34" y="590" font-size="12" fill="#b3001b" text-anchor="start">(retire já)</text>
<clipPath id="ov7"><path d="M225,534.0 C264.0,534.0 255.4,610.0 225,610.0 C194.6,610.0 186.0,534.0 225,534.0 Z"/></clipPath><path d="M225,534.0 C264.0,534.0 255.4,610.0 225,610.0 C194.6,610.0 186.0,534.0 225,534.0 Z" fill="url(#luz)"/><g clip-path="url(#ov7)"><path d="M185,534.0 L265,534.0 L265,543.0 Q225,547.0 185,543.0 Z" fill="#fffbe6"/><path d="M185,543.0 Q225,547.0 265,543.0" fill="none" stroke="#c98a3a" stroke-width="1.5"/><circle cx="225" cy="578" r="15" fill="none" stroke="#c0181b" stroke-width="3.5"/></g><path d="M225,534.0 C264.0,534.0 255.4,610.0 225,610.0 C194.6,610.0 186.0,534.0 225,534.0 Z" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="225" y="627" font-size="11" fill="#222" text-anchor="middle">anel vermelho</text>
<text x="225" y="640" font-size="11" fill="#222" text-anchor="middle">(anel de sangue)</text>
<clipPath id="ov8"><path d="M385,534.0 C424.0,534.0 415.4,610.0 385,610.0 C354.6,610.0 346.0,534.0 385,534.0 Z"/></clipPath><path d="M385,534.0 C424.0,534.0 415.4,610.0 385,610.0 C354.6,610.0 346.0,534.0 385,534.0 Z" fill="url(#luz)"/><g clip-path="url(#ov8)"><path d="M345,534.0 L425,534.0 L425,548.0 Q385,552.0 345,548.0 Z" fill="#fffbe6"/><path d="M345,548.0 Q385,552.0 425,548.0" fill="none" stroke="#c98a3a" stroke-width="1.5"/><ellipse cx="381" cy="594" rx="13" ry="9" fill="#5a2a10" fill-opacity="0.85"/><ellipse cx="393" cy="572" rx="8" ry="6" fill="#7a3a16" fill-opacity="0.6"/></g><path d="M385,534.0 C424.0,534.0 415.4,610.0 385,610.0 C354.6,610.0 346.0,534.0 385,534.0 Z" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="385" y="627" font-size="11" fill="#222" text-anchor="middle">mancha escura solta,</text>
<text x="385" y="640" font-size="11" fill="#222" text-anchor="middle">sem veias</text>
<clipPath id="ov9"><path d="M545,534.0 C584.0,534.0 575.4,610.0 545,610.0 C514.6,610.0 506.0,534.0 545,534.0 Z"/></clipPath><path d="M545,534.0 C584.0,534.0 575.4,610.0 545,610.0 C514.6,610.0 506.0,534.0 545,534.0 Z" fill="url(#luz)"/><g clip-path="url(#ov9)"><path d="M505,534.0 L585,534.0 L585,558.0 Q545,562.0 505,558.0 Z" fill="#fffbe6"/><path d="M505,558.0 Q545,562.0 585,558.0" fill="none" stroke="#c98a3a" stroke-width="1.5"/><path d="M545,534.0 C584.0,534.0 575.4,610.0 545,610.0 C514.6,610.0 506.0,534.0 545,534.0 Z" fill="#4b5320" fill-opacity="0.75"/><ellipse cx="539" cy="582" rx="14" ry="16" fill="#2c2a10" fill-opacity="0.7"/></g><path d="M545,534.0 C584.0,534.0 575.4,610.0 545,610.0 C514.6,610.0 506.0,534.0 545,534.0 Z" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="545" y="627" font-size="11" fill="#222" text-anchor="middle">escuro-esverdeado,</text>
<text x="545" y="640" font-size="11" fill="#222" text-anchor="middle">cheiro ruim: PODRE</text>
<text x="340" y="672" font-size="12" fill="#222" font-weight="bold" text-anchor="middle">A câmara de ar (parte clara de cima) cresce com os dias em todos os ovos.</text>
</svg>
