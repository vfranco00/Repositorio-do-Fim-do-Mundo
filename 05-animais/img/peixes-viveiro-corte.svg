<text x="300" y="74" font-size="12" fill="#222" text-anchor="start">MONGE (saída): caixa com</text><text x="300" y="89" font-size="12" fill="#222" text-anchor="start">tábuas encaixadas. Tirar</text><text x="300" y="104" font-size="12" fill="#222" text-anchor="start">tábuas baixa o nível ou</text><text x="300" y="119" font-size="12" fill="#222" text-anchor="start">esvazia o viveiro.</text>
<line x1="430" y1="134" x2="488" y2="160" stroke="#555" stroke-width="1.2"/>
<text x="560" y="70" font-size="12" fill="#2b6a1e" font-weight="bold" text-anchor="start">crista do dique:</text><text x="560" y="85" font-size="12" fill="#2b6a1e" font-weight="bold" text-anchor="start">1,5 a 3 m,</text><text x="560" y="100" font-size="12" fill="#2b6a1e" font-weight="bold" text-anchor="start">com grama</text>
