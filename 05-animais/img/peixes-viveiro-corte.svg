<text x="520" y="342" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="end">cano de saída 100–200 mm</text>
<text x="12" y="360" font-size="11" fill="#5a4630" text-anchor="start">Desenho fora de escala (altura exagerada).</text>
<rect x="10" y="384" width="660" height="150" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
<text x="22" y="410" font-size="12" fill="#222" text-anchor="start">CACHIMBO (mais barato</text><text x="22" y="426" font-size="12" fill="#222" text-anchor="start">que o monge): cano de</text><text x="22" y="442" font-size="12" fill="#222" text-anchor="start">PVC que passa por baixo</text><text x="22" y="458" font-size="12" fill="#222" text-anchor="start">do dique, com um joelho</text><text x="22" y="474" font-size="12" fill="#222" text-anchor="start">que gira dentro d'água.</text>
