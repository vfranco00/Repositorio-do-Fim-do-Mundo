<text x="84" y="488" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">1. ISCA</text>
<text x="84" y="504" font-size="11.5" fill="#333" text-anchor="middle">fibras finas e secas</text>
<text x="84" y="519" font-size="11.5" fill="#333" text-anchor="middle">2 punhados</text>
<text x="212" y="488" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">2. GRAVETO FINO</text>
<text x="212" y="504" font-size="11.5" fill="#333" text-anchor="middle">grossura de palito</text>
<text x="212" y="519" font-size="11.5" fill="#333" text-anchor="middle">de fósforo · 1 braçada</text>
<text x="340" y="488" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">3. GRAVETO</text>
<text x="340" y="504" font-size="11.5" fill="#333" text-anchor="middle">grossura de lápis</text>
<text x="340" y="519" font-size="11.5" fill="#333" text-anchor="middle">1 braçada</text>
<text x="468" y="488" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">4. GALHO</text>
<text x="468" y="504" font-size="11.5" fill="#333" text-anchor="middle">grossura do polegar</text>
<text x="468" y="519" font-size="11.5" fill="#333" text-anchor="middle">2 braçadas</text>
<text x="596" y="488" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">5. LENHA</text>
<text x="596" y="504" font-size="11.5" fill="#333" text-anchor="middle">do punho ao braço</text>
<text x="596" y="519" font-size="11.5" fill="#333" text-anchor="middle">uma pilha</text>
<text x="340" y="546" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="middle">Madeira seca QUEBRA com estalo. Se só dobra, está verde ou úmida.</text>
