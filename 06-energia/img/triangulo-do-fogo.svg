<text x="95.2" y="169.0" font-size="15" fill="#b3001b" font-weight="bold" text-anchor="middle" transform="rotate(-59.8 95.2 169.0)">CALOR</text>
<text x="79.6" y="159.9" font-size="11.5" fill="#444" text-anchor="middle" transform="rotate(-59.8 79.6 159.9)">chama, faísca, sol</text>
<text x="244.8" y="169.0" font-size="15" fill="#1f5f9e" font-weight="bold" text-anchor="middle" transform="rotate(59.8 244.8 169.0)">OXIGÊNIO (ar)</text>
<text x="260.4" y="159.9" font-size="11.5" fill="#444" text-anchor="middle" transform="rotate(59.8 260.4 159.9)">vento, ar por baixo</text>
<text x="170" y="310" font-size="15" fill="#6b3f17" font-weight="bold" text-anchor="middle">COMBUSTÍVEL</text>
<text x="170" y="326" font-size="11.5" fill="#444" text-anchor="middle">isca, gravetos, lenha</text>
<text x="330" y="80" font-size="15" fill="#222" font-weight="bold" text-anchor="start">Tire um lado e o fogo APAGA:</text>
<circle cx="338" cy="104" r="7" fill="#d62828"/>
<text x="352" y="109.0" font-size="13" fill="#222" text-anchor="start">ÁGUA esfria → tira o CALOR</text>
<circle cx="338" cy="132" r="7" fill="#4a90d9"/>
<text x="352" y="137.0" font-size="13" fill="#222" text-anchor="start">TERRA, AREIA, TAMPA ou pano molhado</text><text x="352" y="153.9" font-size="13" fill="#222" text-anchor="start">abafam → tiram o AR</text>
<circle cx="338" cy="177" r="7" fill="#8b5a2b"/>
<text x="352" y="182.0" font-size="13" fill="#222" text-anchor="start">ACEIRO (faixa sem mato) ou afastar</text><text x="352" y="198.9" font-size="13" fill="#222" text-anchor="start">a lenha → tira o COMBUSTÍVEL</text>
<rect x="330" y="222" width="330" height="96" rx="8" fill="#eef7ee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="342" y="244" font-size="13" fill="#1d5a2a" font-weight="bold" text-anchor="start">Para ACENDER, junte os três:</text><text x="342" y="262" font-size="13" fill="#1d5a2a" text-anchor="start">material fino e SECO, ar passando por</text><text x="342" y="280" font-size="13" fill="#1d5a2a" text-anchor="start">baixo e entre os gravetos, e calor</text><text x="342" y="298" font-size="13" fill="#1d5a2a" text-anchor="start">concentrado num ponto só.</text>
<line x1="20" y1="346" x2="660" y2="346" stroke="#ccc" stroke-width="2" stroke-linecap="round"/>
<text x="340" y="372" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">Junte TUDO antes de acender, do mais fino ao mais grosso (o dobro do que acha que precisa)</text>
