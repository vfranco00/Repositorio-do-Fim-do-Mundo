<text x="34" y="508" font-size="12.5" fill="#222" text-anchor="start">Rende ~1 kg de carvão para cada 4–5 kg de lenha (10–15 kg por tambor de 200 L).</text><text x="34" y="526" font-size="12.5" fill="#222" text-anchor="start">Faça longe de casas e de mato seco. A fumaça tem monóxido de carbono.</text>
