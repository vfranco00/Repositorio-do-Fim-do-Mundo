<text x="505" y="322" font-size="15" fill="#222" font-weight="bold" text-anchor="middle">VALA (corte de lado)</text>
<text x="560" y="366.0" font-size="11.5" fill="#3b6b20" font-weight="bold" text-anchor="start">2 varas verdes</text>
<line x1="432" y1="466" x2="578" y2="466" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
<text x="505" y="482" font-size="11.5" fill="#333" text-anchor="middle">60–90 cm de comprimento</text>
<line x1="612" y1="400" x2="612" y2="452" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
<text x="618" y="430" font-size="11.5" fill="#333" text-anchor="start">20–30 cm</text>
<text x="352" y="524" font-size="11.5" fill="#222" text-anchor="start">Vala de 30 cm de largura, com a ponta</text><text x="352" y="538" font-size="11.5" fill="#222" text-anchor="start">aberta para o vento. Panela apoiada nas</text><text x="352" y="552" font-size="11.5" fill="#222" text-anchor="start">bordas. Protege do vento, esconde o fogo</text><text x="352" y="566" font-size="11.5" fill="#222" text-anchor="start">e quase não espalha brasa.</text>
