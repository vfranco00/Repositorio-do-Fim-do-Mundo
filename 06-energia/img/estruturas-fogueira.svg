<text x="278" y="380" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">empurre</text>
<text x="170" y="322" font-size="15" fill="#222" font-weight="bold" text-anchor="middle">ESTRELA (vista de cima)</text>
<text x="20" y="548" font-size="11.5" fill="#222" text-anchor="start">4–6 toras grossas com as pontas no centro.</text><text x="20" y="562" font-size="11.5" fill="#222" text-anchor="start">Empurre para dentro conforme queimam.</text><text x="20" y="576" font-size="11.5" fill="#222" text-anchor="start">Economiza lenha e dura a noite toda.</text><text x="20" y="590" font-size="11.5" fill="#222" text-anchor="start">Para diminuir o fogo, afaste as toras.</text>
