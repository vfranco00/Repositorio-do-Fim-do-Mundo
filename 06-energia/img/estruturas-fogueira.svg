<text x="20" y="240.0" font-size="12" fill="#222" text-anchor="start">Isca no centro, gravetos em pé em cone,</text><text x="20" y="255.6" font-size="12" fill="#222" text-anchor="start">com uma ABERTURA do lado do vento para</text><text x="20" y="271.2" font-size="12" fill="#222" text-anchor="start">pôr o fogo. Acende rápido, chama alta:</text><text x="20" y="286.8" font-size="12" fill="#222" text-anchor="start">bom para começar e ferver água.</text>
