<text x="610" y="216" font-size="11" fill="#444" text-anchor="middle">vista de cima</text>
<text x="510" y="72" font-size="15" fill="#222" font-weight="bold" text-anchor="middle">CABANA (camadas cruzadas)</text>
<text x="352" y="240.0" font-size="12" fill="#222" text-anchor="start">Pares de toras cruzados em camadas, com um</text><text x="352" y="255.6" font-size="12" fill="#222" text-anchor="start">pequeno tipi aceso dentro. Queima por igual e</text><text x="352" y="271.2" font-size="12" fill="#222" text-anchor="start">faz MUITA BRASA: o melhor para cozinhar,</text><text x="352" y="286.8" font-size="12" fill="#222" text-anchor="start">assar e para chapa ou grelha por cima.</text>
