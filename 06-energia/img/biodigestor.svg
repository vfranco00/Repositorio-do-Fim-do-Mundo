<text x="34" y="460" font-size="12.5" fill="#7a1010" text-anchor="start">NUNCA entre no biodigestor, nem vazio, nem em caixa de esterco: o gás mata em</text><text x="34" y="478" font-size="12.5" fill="#7a1010" text-anchor="start">segundos e quem desce para socorrer morre junto. Nada de fogo, cigarro ou faísca</text><text x="34" y="496" font-size="12.5" fill="#7a1010" text-anchor="start">perto. Procure vazamentos com espuma de sabão. Cerque contra crianças e animais.</text>
