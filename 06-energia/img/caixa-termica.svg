<text x="89" y="352" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">8–10 cm</text>
<line x1="180" y1="300" x2="180" y2="366" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
<text x="186" y="340" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">8–10 cm</text>
<text x="180" y="402" font-size="12" fill="#6b3f17" font-weight="bold" text-anchor="middle">isolamento em TODOS os lados</text>
<text x="180" y="418" font-size="11.5" fill="#333" text-anchor="middle">(palha seca, isopor, serragem, jornal</text>
<text x="180" y="433" font-size="11.5" fill="#333" text-anchor="middle">amassado, cobertores, roupas)</text>
<text x="180" y="86" font-size="11.5" fill="#6b3f17" font-weight="bold" text-anchor="middle">almofada de palha ou cobertor por cima</text>
<text x="350" y="72" font-size="15" fill="#222" font-weight="bold" text-anchor="start">Como usar</text>
<text x="350" y="98" font-size="12.5" fill="#222" text-anchor="start">1. Ferva a panela CHEIA, com tampa,</text><text x="350" y="114" font-size="12.5" fill="#222" text-anchor="start">   pelo tempo da tabela.</text>
<text x="350" y="138" font-size="12.5" fill="#222" text-anchor="start">2. Sem abrir, ponha RÁPIDO na caixa,</text><text x="350" y="154" font-size="12.5" fill="#222" text-anchor="start">   cubra com a almofada e feche.</text>
<text x="350" y="178" font-size="12.5" fill="#222" text-anchor="start">3. Deixe o tempo indicado. Não abra</text><text x="350" y="194" font-size="12.5" fill="#222" text-anchor="start">   para espiar (perde calor).</text>
<text x="350" y="218" font-size="12.5" fill="#222" text-anchor="start">4. Abriu e está só morna (abaixo de</text><text x="350" y="234" font-size="12.5" fill="#222" text-anchor="start">   60 °C)? Ferva de novo antes de comer.</text>
<rect x="350" y="252" width="310" height="24" rx="0" fill="#efe7d6" stroke="none" stroke-width="0" />
<text x="358" y="270" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Alimento</text>
<text x="500" y="270" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Ferver</text>
<text x="580" y="270" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Na caixa</text>
<text x="358" y="292" font-size="12" fill="#222" text-anchor="start">Arroz</text>
<text x="500" y="292" font-size="12" fill="#222" text-anchor="start">5 min</text>
<text x="580" y="292" font-size="12" fill="#222" text-anchor="start">1–1,5 h</text>
<rect x="350" y="297" width="310" height="20" rx="0" fill="#f7f3ea" stroke="none" stroke-width="0" />
<text x="358" y="312" font-size="12" fill="#222" text-anchor="start">Feijão (demolhado)</text>
<text x="500" y="312" font-size="12" fill="#222" text-anchor="start">15 min</text>
<text x="580" y="312" font-size="12" fill="#222" text-anchor="start">3–4 h</text>
<text x="358" y="332" font-size="12" fill="#222" text-anchor="start">Mandioca, batata</text>
<text x="500" y="332" font-size="12" fill="#222" text-anchor="start">5–10 min</text>
<text x="580" y="332" font-size="12" fill="#222" text-anchor="start">1–2 h</text>
<rect x="350" y="337" width="310" height="20" rx="0" fill="#f7f3ea" stroke="none" stroke-width="0" />
<text x="358" y="352" font-size="12" fill="#222" text-anchor="start">Carne em pedaços</text>
<text x="500" y="352" font-size="12" fill="#222" text-anchor="start">15–20 min</text>
<text x="580" y="352" font-size="12" fill="#222" text-anchor="start">3–4 h</text>
<text x="358" y="372" font-size="12" fill="#222" text-anchor="start">Canjica, grão-de-bico</text>
<text x="500" y="372" font-size="12" fill="#222" text-anchor="start">15 min</text>
<text x="580" y="372" font-size="12" fill="#222" text-anchor="start">4–6 h</text>
<rect x="20" y="446" width="640" height="60" rx="8" fill="#eef7ee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="34" y="468" font-size="12.5" fill="#1d5a2a" text-anchor="start">Economiza 50–70% do combustível. Quanto mais cheia a panela e menos ar sobrar, melhor.</text><text x="34" y="486" font-size="12.5" fill="#1d5a2a" text-anchor="start">Feijão: ferva FORTE pelo menos 15 min antes (o feijão cru tem substância tóxica).</text>
</svg>
