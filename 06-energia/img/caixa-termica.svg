<text x="180" y="262" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">comida</text>
<text x="180" y="277" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">quente</text>
<rect x="32" y="96" width="296" height="14" rx="3" fill="#6b4424" stroke="#1e1e1e" stroke-width="2.5" />
