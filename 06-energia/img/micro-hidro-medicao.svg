<text x="400" y="179.7" font-size="14" fill="#222" font-weight="bold" text-anchor="end">a</text>
<line x1="604" y1="150" x2="604" y2="270.8" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<text x="610" y="215.4" font-size="14" fill="#222" font-weight="bold" text-anchor="start">b</text>
<text x="420" y="221.4" font-size="11" fill="#444" font-weight="bold" text-anchor="middle">vara A</text>
<text x="594" y="292.8" font-size="11" fill="#444" font-weight="bold" text-anchor="middle">vara B</text>
<text x="500" y="326" font-size="11" fill="#1f5f9e" font-weight="bold" text-anchor="middle">mangueira transparente cheia</text>
<text x="500" y="340" font-size="11" fill="#1f5f9e" font-weight="bold" text-anchor="middle">de água, sem bolhas</text>
<rect x="350" y="360" width="310" height="52" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="360" y="380" font-size="12" fill="#1b3d6b" text-anchor="start">Desnível = b − a. Desça repetindo e SOME</text><text x="360" y="397" font-size="12" fill="#1b3d6b" text-anchor="start">tudo, da captação até a turbina.</text>
<rect x="20" y="424" width="640" height="48" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="340" y="446" font-size="15" fill="#222" font-weight="bold" text-anchor="middle">Potência (W) ≈ 5 × vazão (L/s) × queda (m)</text>
<text x="340" y="464" font-size="12" fill="#444" text-anchor="middle">Ex.: 2 L/s com 15 m de queda → ≈ 150 W, dia e noite = 3,6 kWh por dia</text>
