<text x="474" y="334" font-size="11.5" fill="#5c3d00" text-anchor="start">Clareia como uma lâmpada</text><text x="474" y="349" font-size="11.5" fill="#5c3d00" text-anchor="start">de 40 a 60 W. Só funciona</text><text x="474" y="364" font-size="11.5" fill="#5c3d00" text-anchor="start">de DIA. Dura anos; troque</text><text x="474" y="379" font-size="11.5" fill="#5c3d00" text-anchor="start">a água se ficar turva ou</text><text x="474" y="394" font-size="11.5" fill="#5c3d00" text-anchor="start">verde. Água não vaza se</text><text x="474" y="409" font-size="11.5" fill="#5c3d00" text-anchor="start">a vedação for bem feita.</text>
