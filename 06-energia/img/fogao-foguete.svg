<rect x="565" y="270" width="60" height="30" rx="0" fill="#c8553d" stroke="#1e1e1e" stroke-width="1.8" /><rect x="625" y="270" width="30" height="60" rx="0" fill="#c8553d" stroke="#1e1e1e" stroke-width="1.8" /><rect x="595" y="330" width="60" height="30" rx="0" fill="#c8553d" stroke="#1e1e1e" stroke-width="1.8" /><rect x="565" y="300" width="30" height="60" rx="0" fill="#c8553d" stroke="#1e1e1e" stroke-width="1.8" /><rect x="595" y="300" width="30" height="30" rx="0" fill="#3b3330" stroke="none" stroke-width="0" />
<text x="538" y="380" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Fiadas 3 a 6:</text><text x="538" y="394" font-size="11.5" fill="#222" text-anchor="start">4 tijolos em cata-</text><text x="538" y="408" font-size="11.5" fill="#222" text-anchor="start">vento; o buraco do</text><text x="538" y="422" font-size="11.5" fill="#222" text-anchor="start">meio é a chaminé</text>
<text x="538" y="454" font-size="11.5" fill="#555" text-anchor="start">tijolo maciço</text>
<text x="538" y="468" font-size="11.5" fill="#555" text-anchor="start">≈ 20 × 10 × 5 cm</text>
<rect x="20" y="528" width="640" height="62" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="34" y="550" font-size="12.5" fill="#222" text-anchor="start">Lenha fina e seca (2–4 cm). Fumaça saindo pela boca = lenha demais, úmida ou chaminé curta.</text><text x="34" y="568" font-size="12.5" fill="#222" text-anchor="start">Barro por fora isola e veda as frestas. Gasta 40–60% menos lenha que o fogo de 3 pedras.</text>
