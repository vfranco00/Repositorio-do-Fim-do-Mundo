<text x="340" y="280" font-size="12" fill="#1f5f9e" font-weight="bold" text-anchor="start">PRATELEIRA (grade):</text><text x="340" y="295" font-size="12" fill="#1f5f9e" text-anchor="start">lenha em cima,</text><text x="340" y="310" font-size="12" fill="#1f5f9e" text-anchor="start">AR passa por baixo</text>
