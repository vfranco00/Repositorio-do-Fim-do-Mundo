<text x="340" y="346" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Queime só a PONTA</text><text x="340" y="361" font-size="12" fill="#222" text-anchor="start">da lenha; empurre</text><text x="340" y="376" font-size="12" fill="#222" text-anchor="start">conforme queima</text>
