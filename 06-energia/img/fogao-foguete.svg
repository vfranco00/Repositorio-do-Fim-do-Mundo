<text x="340" y="214" font-size="12" fill="#222" font-weight="bold" text-anchor="start">CHAMINÉ INTERNA</text><text x="340" y="229" font-size="12" fill="#222" text-anchor="start">10 × 10 cm; altura =</text><text x="340" y="244" font-size="12" fill="#222" text-anchor="start">3 × a largura</text>
