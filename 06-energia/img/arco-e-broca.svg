<text x="476" y="544" font-size="11.5" fill="#222" text-anchor="start">Ponha a brasa no ninho de isca,</text><text x="476" y="558" font-size="11.5" fill="#222" text-anchor="start">dobre por cima e sopre devagar</text><text x="476" y="572" font-size="11.5" fill="#222" text-anchor="start">e sem parar até pegar chama.</text>
