<text x="330" y="350" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="middle">movimentos longos</text>
<text x="30" y="226" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">o pé firma</text>
<text x="30" y="241" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">a prancha</text>
<line x1="286" y1="172" x2="434" y2="66" stroke="#777" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="286" cy="172" r="3" fill="#777"/>
<text x="440" y="70" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">SOQUETE (apoio da mão)</text><text x="440" y="84" font-size="11.5" fill="#222" text-anchor="start">pedra ou madeira dura com</text><text x="440" y="98" font-size="11.5" fill="#222" text-anchor="start">cavidade lisa; unte com gordura</text>
<line x1="262" y1="222" x2="434" y2="136" stroke="#777" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="262" cy="222" r="3" fill="#777"/>
<text x="440" y="140" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">BROCA</text><text x="440" y="154" font-size="11.5" fill="#222" text-anchor="start">reta e seca, 20–25 cm, grossura</text><text x="440" y="168" font-size="11.5" fill="#222" text-anchor="start">do polegar; ponta de baixo</text><text x="440" y="182" font-size="11.5" fill="#222" text-anchor="start">arredondada</text>
<line x1="395" y1="286" x2="434" y2="224" stroke="#777" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="395" cy="286" r="3" fill="#777"/>
<text x="440" y="228" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">ARCO</text><text x="440" y="242" font-size="11.5" fill="#222" text-anchor="start">galho firme, do comprimento do</text><text x="440" y="256" font-size="11.5" fill="#222" text-anchor="start">braço; a corda dá 1 volta na</text><text x="440" y="270" font-size="11.5" fill="#222" text-anchor="start">broca, bem esticada</text>
<line x1="372" y1="389" x2="434" y2="312" stroke="#777" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="372" cy="389" r="3" fill="#777"/>
<text x="440" y="316" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">PRANCHA (base)</text><text x="440" y="330" font-size="11.5" fill="#222" text-anchor="start">~2 cm de espessura, madeira</text><text x="440" y="344" font-size="11.5" fill="#222" text-anchor="start">macia e seca (ver texto)</text>
<line x1="270" y1="400" x2="434" y2="380" stroke="#777" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="270" cy="400" r="3" fill="#777"/>
<text x="440" y="384" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Folha embaixo do entalhe</text><text x="440" y="398" font-size="11.5" fill="#222" text-anchor="start">recolhe o pó que vira brasa</text>
<line x1="10" y1="438" x2="670" y2="438" stroke="#ccc" stroke-width="2" stroke-linecap="round"/>
<text x="120" y="462" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Prancha vista de cima</text>
<rect x="30" y="478" width="180" height="46" rx="3" fill="#e0b47a" stroke="#1e1e1e" stroke-width="2" />
<circle cx="120" cy="498" r="11" fill="#3a2a1a"/>
<polygon points="120,498 109,524 131,524" fill="#3a2a1a" stroke="#3a2a1a" stroke-width="1" stroke-linejoin="round"/>
<text x="30" y="544" font-size="11.5" fill="#222" text-anchor="start">Buraco a ~1 cm da borda.</text><text x="30" y="558" font-size="11.5" fill="#222" text-anchor="start">Entalhe em V: 1/8 do círculo</text><text x="30" y="572" font-size="11.5" fill="#222" text-anchor="start">(45°), até o CENTRO do buraco.</text>
<text x="340" y="462" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Como saber se deu certo</text>
<circle cx="250" cy="486" r="8" fill="#4a2e14"/>
<text x="264" y="490" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">Pó marrom-escuro que</text><text x="264" y="504" font-size="11.5" fill="#2b8a3e" text-anchor="start">solta fumaça SOZINHO</text><text x="264" y="518" font-size="11.5" fill="#2b8a3e" text-anchor="start">= BRASA pronta</text>
<circle cx="250" cy="546" r="8" fill="#d9b48a"/>
<text x="264" y="550" font-size="11.5" fill="#b3001b" text-anchor="start">Pó claro ou fino = pouca</text><text x="264" y="564" font-size="11.5" fill="#b3001b" text-anchor="start">pressão/velocidade ou</text><text x="264" y="578" font-size="11.5" fill="#b3001b" text-anchor="start">madeira úmida</text>
<text x="565" y="462" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Brasa → ninho → chama</text>
