<text x="183" y="232" font-size="11.5" fill="#222" text-anchor="middle">HD externo</text>
<text x="116" y="262" font-size="12" fill="#222" text-anchor="middle">Se um quebrar ou sumir,</text>
<text x="116" y="278" font-size="12" fill="#222" font-weight="bold" text-anchor="middle">sobram dois.</text>
<rect x="262" y="140" width="22" height="16" rx="2" fill="#c8ccd2" stroke="#1e1e1e" stroke-width="2"/><rect x="267" y="144" width="4" height="5" rx="0" fill="#555" stroke="#1e1e1e" stroke-width="0"/><rect x="275" y="144" width="4" height="5" rx="0" fill="#555" stroke="#1e1e1e" stroke-width="0"/><rect x="254" y="155" width="38" height="56" rx="7" fill="#d62828" stroke="#1e1e1e" stroke-width="2"/><text x="273" y="190" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">USB</text>
