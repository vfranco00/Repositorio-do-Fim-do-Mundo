<text x="506" y="244" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">sua casa</text>
<text x="618" y="244" font-size="11" fill="#222" text-anchor="middle">parente, vizinho,</text>
<text x="618" y="258" font-size="11" fill="#222" text-anchor="middle">sítio, igreja</text>
<text x="564" y="280" font-size="12" fill="#222" text-anchor="middle">Incêndio, enchente ou roubo</text>
<text x="564" y="296" font-size="12" fill="#222" font-weight="bold" text-anchor="middle">não levam tudo.</text>
<text x="170" y="344" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">Caixa metálica fechada (em corte)</text>
