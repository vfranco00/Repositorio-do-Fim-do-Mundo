<path d="M170 422 h20 l10 10 v34 h-30 Z" fill="#1f4e8c" stroke="#1e1e1e" stroke-width="2"/><text x="185" y="454" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">SD</text>
<rect x="214" y="398" width="64" height="92" rx="6" fill="#4b4f57" stroke="#1e1e1e" stroke-width="2"/>
<rect x="220" y="406" width="52" height="66" rx="2" fill="#e9e6dc" stroke="#1e1e1e" stroke-width="1"/>
<text x="246" y="444" font-size="10" fill="#444" text-anchor="middle">e-reader</text>
<text x="326" y="368" font-size="11.5" fill="#222" text-anchor="start">tampa justa + fita de alumínio na junta</text>
<text x="326" y="426" font-size="11.5" fill="#8a5a12" font-weight="bold" text-anchor="start">dentro: saco plástico ou papelão,</text>
<text x="326" y="442" font-size="11.5" fill="#8a5a12" font-weight="bold" text-anchor="start">nada encosta no metal</text>
<text x="326" y="502" font-size="11.5" fill="#222" text-anchor="start">lata de biscoito, caixa de ferramentas</text>
<text x="326" y="518" font-size="11.5" fill="#222" text-anchor="start">de aço ou panela com tampa</text>
<rect x="326" y="532" width="344" height="104" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="338" y="552" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">A CADA 6 MESES:</text>
<text x="338" y="569" font-size="12" fill="#222" text-anchor="start">ligue, abra 3 arquivos ao acaso, recarregue</text>
<text x="338" y="586" font-size="12" fill="#222" text-anchor="start">as baterias e confira todas as cópias.</text>
<text x="338" y="603" font-size="12" fill="#222" text-anchor="start">A cada 3–5 anos: copie tudo para mídia nova.</text>
<text x="338" y="622" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start">Tenha o principal IMPRESSO em papel.</text>
<rect x="56" y="562" width="46" height="60" rx="0" fill="#fff" stroke="#1e1e1e" stroke-width="1.5"/><rect x="61" y="557" width="46" height="60" rx="0" fill="#fff" stroke="#1e1e1e" stroke-width="1.5"/><rect x="66" y="552" width="46" height="60" rx="0" fill="#fff" stroke="#1e1e1e" stroke-width="1.5"/><line x1="72" y1="560" x2="108" y2="560" stroke="#999" stroke-width="2"/><line x1="72" y1="570" x2="108" y2="570" stroke="#999" stroke-width="2"/><line x1="72" y1="580" x2="108" y2="580" stroke="#999" stroke-width="2"/><line x1="72" y1="590" x2="108" y2="590" stroke="#999" stroke-width="2"/><line x1="72" y1="600" x2="108" y2="600" stroke="#999" stroke-width="2"/>
<text x="126" y="584" font-size="12" fill="#222" font-weight="bold" text-anchor="start">+ papel: não precisa</text>
<text x="126" y="600" font-size="12" fill="#222" font-weight="bold" text-anchor="start">de energia nem de</text>
<text x="126" y="616" font-size="12" fill="#222" font-weight="bold" text-anchor="start">aparelho nenhum</text>
</svg>
