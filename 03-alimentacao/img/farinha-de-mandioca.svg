<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 596" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="596" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Farinha de mandioca — do pé ao saco</text>
<rect x="12" y="52" width="200" height="228" rx="10" fill="#fafafa" stroke="#c8c8c8"/><circle cx="32" cy="74" r="14" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="32" y="79" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="54" y="79" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Descascar e lavar</text>
<text x="22" y="214" font-size="12" fill="#222" text-anchor="start">Processe no mesmo dia em</text>
<text x="22" y="229" font-size="12" fill="#222" text-anchor="start">que arrancar (a raiz estraga</text>
<text x="22" y="244" font-size="12" fill="#222" text-anchor="start">em 1–2 dias). Raspe toda a</text>
<text x="22" y="259" font-size="12" fill="#222" text-anchor="start">casca e lave bem.</text>
<rect x="240" y="52" width="200" height="228" rx="10" fill="#fafafa" stroke="#c8c8c8"/><circle cx="260" cy="74" r="14" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="260" y="79" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="282" y="79" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Ralar</text>
<text x="250" y="214" font-size="12" fill="#222" text-anchor="start">Ralo de lata furada com</text>
<text x="250" y="229" font-size="12" fill="#222" text-anchor="start">prego ou rodete (caititu).</text>
<text x="250" y="244" font-size="12" fill="#222" text-anchor="start">Massa bem fina solta mais</text>
<text x="250" y="259" font-size="12" fill="#222" text-anchor="start">veneno na prensa.</text>
<rect x="468" y="52" width="200" height="228" rx="10" fill="#fafafa" stroke="#c8c8c8"/><circle cx="488" cy="74" r="14" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="488" y="79" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="510" y="79" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Prensar</text>
<text x="478" y="214" font-size="12" fill="#222" text-anchor="start">Prensa ou tipiti de 6 a 12 h,</text>
<text x="478" y="229" font-size="12" fill="#222" text-anchor="start">até a massa ficar enxuta.</text>
<text x="478" y="244" font-size="12" fill="#b3001b" text-anchor="start">O caldo (manipueira) é</text>
<text x="478" y="259" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">VENENO: jogue na fossa.</text>
<rect x="12" y="300" width="200" height="228" rx="10" fill="#fafafa" stroke="#c8c8c8"/><circle cx="32" cy="322" r="14" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="32" y="327" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="54" y="327" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Peneirar</text>
<text x="22" y="462" font-size="12" fill="#222" text-anchor="start">Desmanche os torrões e</text>
<text x="22" y="477" font-size="12" fill="#222" text-anchor="start">passe na peneira (3–4 mm).</text>
<text x="22" y="492" font-size="12" fill="#222" text-anchor="start">A fibra que sobra (crueira)</text>
<text x="22" y="507" font-size="12" fill="#222" text-anchor="start">só seca, para animais.</text>
<rect x="240" y="300" width="200" height="228" rx="10" fill="#fafafa" stroke="#c8c8c8"/><circle cx="260" cy="322" r="14" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="260" y="327" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="282" y="327" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Torrar</text>
<text x="250" y="462" font-size="12" fill="#222" text-anchor="start">Tacho ou forno largo, fogo</text>
<text x="250" y="477" font-size="12" fill="#222" text-anchor="start">forte e depois médio,</text>
<text x="250" y="492" font-size="12" fill="#222" text-anchor="start">MEXENDO sem parar, 40 min</text>
<text x="250" y="507" font-size="12" fill="#222" text-anchor="start">a 2 h, até ficar sequinha.</text>
<rect x="468" y="300" width="200" height="228" rx="10" fill="#fafafa" stroke="#c8c8c8"/><circle cx="488" cy="322" r="14" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="488" y="327" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="510" y="327" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Esfriar e guardar</text>
<text x="478" y="462" font-size="12" fill="#222" text-anchor="start">Esfrie espalhada, peneire</text>
<text x="478" y="477" font-size="12" fill="#222" text-anchor="start">de novo e guarde em lata ou</text>
<text x="478" y="492" font-size="12" fill="#222" text-anchor="start">saco bem fechado e seco.</text>
<text x="478" y="507" font-size="12" fill="#222" text-anchor="start">Rende 1 kg para 3–4 kg.</text>
