<text x="24" y="559" font-size="12.5" fill="#222" text-anchor="start">Mandioca BRAVA (amarga) só fica segura depois de ralar, prensar e torrar bem. Nunca coma a</text><text x="24" y="576" font-size="12.5" fill="#222" text-anchor="start">massa crua nem beba a manipueira. Mandioca mansa (aipim, macaxeira) pode ser só cozida.</text>
