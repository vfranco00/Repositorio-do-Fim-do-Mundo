<text x="515" y="236" font-size="12" fill="#222" text-anchor="start">caixa fechada e</text><text x="515" y="251" font-size="12" fill="#222" font-weight="bold" text-anchor="start">ESCURA: o sol não</text><text x="515" y="266" font-size="12" fill="#222" text-anchor="start">bate na comida</text>
