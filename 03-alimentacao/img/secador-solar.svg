<text x="34" y="440" font-size="12.5" fill="#222" text-anchor="start">Caminho do ar: entra frio embaixo, esquenta no coletor preto, sobe pelas bandejas</text><text x="34" y="457" font-size="12.5" fill="#222" text-anchor="start">e sai úmido pela chaminé. Temperatura ideal: 45–60 °C. Coletor virado para o NORTE</text><text x="34" y="474" font-size="12.5" fill="#222" text-anchor="start">(no Brasil), inclinado 15–30°. Recolha a comida ou feche à noite (o sereno molha).</text>
