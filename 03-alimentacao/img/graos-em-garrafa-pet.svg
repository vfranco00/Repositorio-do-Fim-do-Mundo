<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 612" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="612" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Como guardar grãos em garrafa PET</text>
<defs><pattern id="grao" width="8" height="6" patternUnits="userSpaceOnUse"><rect width="8" height="6" fill="#f3e6bf"/><ellipse cx="4" cy="3" rx="3" ry="1.7" fill="#e6d29a" stroke="#b39a55" stroke-width="0.6"/></pattern></defs>
<rect x="12" y="52" width="200" height="228" rx="10" fill="#fafafa" stroke="#c8c8c8"/><circle cx="32" cy="74" r="14" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="32" y="79" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="54" y="79" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Limpar e secar</text>
<text x="22" y="212" font-size="12" fill="#222" text-anchor="start">Só garrafa de água ou</text>
<text x="22" y="227" font-size="12" fill="#222" text-anchor="start">refrigerante (PET). Lave,</text>
<text x="22" y="242" font-size="12" fill="#222" text-anchor="start">enxágue e seque 2–3 dias</text>
<text x="22" y="257" font-size="12" fill="#222" text-anchor="start">de boca para baixo.</text>
<rect x="240" y="52" width="200" height="228" rx="10" fill="#fafafa" stroke="#c8c8c8"/><circle cx="260" cy="74" r="14" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="260" y="79" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="282" y="79" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Grão seco</text>
<text x="250" y="212" font-size="12" fill="#222" text-anchor="start">Grão seco estala ao morder</text>
<text x="250" y="227" font-size="12" fill="#222" text-anchor="start">(não amassa). Para matar</text>
<text x="250" y="242" font-size="12" fill="#222" text-anchor="start">ovos de caruncho: freezer</text>
<text x="250" y="257" font-size="12" fill="#222" text-anchor="start">por 3 a 7 dias (opcional).</text>
<rect x="468" y="52" width="200" height="228" rx="10" fill="#fafafa" stroke="#c8c8c8"/><circle cx="488" cy="74" r="14" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="488" y="79" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="510" y="79" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Encher batendo</text>
<text x="478" y="212" font-size="12" fill="#222" text-anchor="start">Use funil. Bata a garrafa</text>
<text x="478" y="227" font-size="12" fill="#222" text-anchor="start">no chão várias vezes para</text>
<text x="478" y="242" font-size="12" fill="#222" text-anchor="start">assentar e encha até 2 cm</text>
<text x="478" y="257" font-size="12" fill="#222" text-anchor="start">da boca.</text>
<rect x="12" y="300" width="200" height="228" rx="10" fill="#fafafa" stroke="#c8c8c8"/><circle cx="32" cy="322" r="14" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="32" y="327" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="54" y="327" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Tirar o oxigênio</text>
<text x="22" y="460" font-size="12" fill="#222" text-anchor="start">1 absorvedor de O₂ (300 cc)</text>
<text x="22" y="475" font-size="12" fill="#222" text-anchor="start">por garrafa de 2 L; feche</text>
<text x="22" y="490" font-size="12" fill="#222" text-anchor="start">NA HORA, bem firme. Sem</text>
<text x="22" y="505" font-size="12" fill="#222" text-anchor="start">absorvedor: 2 folhas de</text>
<text x="22" y="520" font-size="12" fill="#222" text-anchor="start">louro (afasta, não mata).</text>
<rect x="240" y="300" width="200" height="228" rx="10" fill="#fafafa" stroke="#c8c8c8"/><circle cx="260" cy="322" r="14" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="260" y="327" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="282" y="327" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Etiquetar</text>
<text x="250" y="460" font-size="12" fill="#222" text-anchor="start">Escreva o que é e a data</text>
<text x="250" y="475" font-size="12" fill="#222" text-anchor="start">(mês/ano) com caneta</text>
<text x="250" y="490" font-size="12" fill="#222" text-anchor="start">permanente ou fita crepe.</text>
<text x="250" y="505" font-size="12" fill="#222" text-anchor="start">Gaste primeiro a mais velha.</text>
<rect x="468" y="300" width="200" height="228" rx="10" fill="#fafafa" stroke="#c8c8c8"/><circle cx="488" cy="322" r="14" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="488" y="327" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="510" y="327" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Guardar bem</text>
<text x="478" y="460" font-size="12" fill="#222" text-anchor="start">Escuro, fresco, fora do</text>
<text x="478" y="475" font-size="12" fill="#222" text-anchor="start">chão (estrado) e dentro de</text>
<text x="478" y="490" font-size="12" fill="#222" text-anchor="start">tambor ou caixa fechada:</text>
<text x="478" y="505" font-size="12" fill="#222" text-anchor="start">rato rói garrafa PET.</text>
