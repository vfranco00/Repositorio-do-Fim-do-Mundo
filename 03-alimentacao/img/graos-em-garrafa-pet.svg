<text x="24" y="559" font-size="12" fill="#222" text-anchor="start">Assim, arroz branco, milho e trigo em grão duram 5 a 10 anos ou mais; feijão também (endurece).</text><text x="24" y="575" font-size="12" fill="#222" text-anchor="start">Só para alimento SECO (até ~10% de umidade). Úmido + sem oxigênio = risco de botulismo.</text><text x="24" y="591" font-size="12" fill="#222" text-anchor="start">Açúcar e sal: sem absorvedor (o açúcar vira pedra). Não reaproveite o absorvedor usado.</text>
