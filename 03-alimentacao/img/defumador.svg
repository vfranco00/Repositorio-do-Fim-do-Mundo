<text x="14" y="200" font-size="12" fill="#222" font-weight="bold" text-anchor="start">1. FOGO</text><text x="14" y="215" font-size="12" fill="#222" text-anchor="start">brasa + lascas ou</text><text x="14" y="230" font-size="12" fill="#222" text-anchor="start">serragem (pouca chama,</text><text x="14" y="245" font-size="12" fill="#222" text-anchor="start">muita fumaça); a tampa</text><text x="14" y="260" font-size="12" fill="#222" text-anchor="start">de chapa regula o ar</text>
<line x1="96" y1="268" x2="106" y2="352" stroke="#555" stroke-width="1.3"/><circle cx="106" cy="352" r="2.6" fill="#555"/>
<text x="196" y="150" font-size="12" fill="#222" font-weight="bold" text-anchor="start">2. DUTO enterrado: 2 a 4 m,</text><text x="196" y="165" font-size="12" fill="#222" text-anchor="start">sempre SUBINDO (manilha,</text><text x="196" y="180" font-size="12" fill="#222" text-anchor="start">cano ou telhas cobertas</text><text x="196" y="195" font-size="12" fill="#222" text-anchor="start">de terra)</text>
<line x1="300" y1="206" x2="316" y2="322" stroke="#555" stroke-width="1.3"/><circle cx="316" cy="322" r="2.6" fill="#555"/>
<text x="545" y="66" font-size="12" fill="#222" font-weight="bold" text-anchor="start">tampa com fresta:</text><text x="545" y="81" font-size="12" fill="#222" text-anchor="start">fumaça sai devagar</text>
<line x1="542" y1="80" x2="528" y2="102" stroke="#555" stroke-width="1.3"/><circle cx="528" cy="102" r="2.6" fill="#555"/>
<text x="545" y="130" font-size="12" fill="#222" font-weight="bold" text-anchor="start">3. CÂMARA</text><text x="545" y="145" font-size="12" fill="#222" text-anchor="start">tambor de 200 L</text><text x="545" y="160" font-size="12" fill="#222" text-anchor="start">sem fundo, ou</text><text x="545" y="175" font-size="12" fill="#222" text-anchor="start">caixa de madeira</text><text x="545" y="190" font-size="12" fill="#222" text-anchor="start">ou de tijolo</text>
<line x1="542" y1="146" x2="532" y2="156" stroke="#555" stroke-width="1.3"/><circle cx="532" cy="156" r="2.6" fill="#555"/>
<text x="545" y="214" font-size="12" fill="#222" text-anchor="start">varas ou grelhas;</text><text x="545" y="229" font-size="12" fill="#222" text-anchor="start">peças sem encostar</text><text x="545" y="244" font-size="12" fill="#222" text-anchor="start">uma na outra</text>
<line x1="542" y1="218" x2="526" y2="194" stroke="#555" stroke-width="1.3"/><circle cx="526" cy="194" r="2.6" fill="#555"/>
<rect x="20" y="432" width="640" height="84" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="34" y="452" font-size="12.5" fill="#222" text-anchor="start">FRIA (abaixo de 30 °C): duto longo, fogo fraco; dias a semanas. NÃO cozinha: só para</text><text x="34" y="469" font-size="12.5" fill="#222" text-anchor="start">carne já bem salgada. QUENTE (câmara a 70–100 °C): duto curto ou fogo quase embaixo;</text><text x="34" y="486" font-size="12.5" fill="#222" text-anchor="start">3 a 12 h; a carne cozinha (miolo acima de 70 °C). Lenha: goiabeira, laranjeira, ingá,</text><text x="34" y="503" font-size="12.5" fill="#222" text-anchor="start">jabuticabeira, sabugo de milho. NUNCA: pinus, madeira pintada, tratada ou compensado.</text>
</svg>
