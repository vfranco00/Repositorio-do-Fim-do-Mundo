<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 516" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="516" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Taioba ou planta venenosa? Olhe onde o talo prende</text>
<rect x="16" y="48" width="208" height="380" rx="10" fill="#fafafa" stroke="#2b8a3e" stroke-width="2"/>
<text x="120" y="72" font-size="13.5" fill="#2b8a3e" font-weight="bold" text-anchor="middle">TAIOBA</text>
<text x="120" y="90" font-size="12.5" fill="#2b8a3e" font-weight="bold" text-anchor="middle">comestível SÓ COZIDA</text>
<rect x="236" y="48" width="208" height="380" rx="10" fill="#fafafa" stroke="#c26a00" stroke-width="2"/>
<text x="340" y="72" font-size="13.5" fill="#c26a00" font-weight="bold" text-anchor="middle">INHAME / TAIOBA-BRAVA</text>
<text x="340" y="90" font-size="12.5" fill="#c26a00" font-weight="bold" text-anchor="middle">folha queima a boca</text>
