<text x="560" y="72" font-size="13.5" fill="#b3001b" font-weight="bold" text-anchor="middle">COMIGO-NINGUÉM-PODE</text>
<text x="560" y="90" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="middle">VENENOSA</text>
