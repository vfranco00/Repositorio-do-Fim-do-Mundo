<text x="244" y="336" font-size="12" fill="#222" font-weight="bold" text-anchor="start">O cabo prende NO MEIO</text><text x="244" y="351" font-size="12" fill="#222" text-anchor="start">da folha (por dentro,</text><text x="244" y="366" font-size="12" fill="#222" text-anchor="start">longe da borda), muitas</text><text x="244" y="381" font-size="12" fill="#222" text-anchor="start">vezes com mancha roxa.</text><text x="244" y="396" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Na dúvida, NÃO coma.</text>
