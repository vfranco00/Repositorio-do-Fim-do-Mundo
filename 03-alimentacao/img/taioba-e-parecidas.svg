<text x="464" y="336" font-size="12" fill="#222" text-anchor="start">Folha comprida com</text><text x="464" y="351" font-size="12" fill="#222" text-anchor="start">manchas brancas; caule</text><text x="464" y="366" font-size="12" fill="#222" text-anchor="start">grosso tipo cana. Também</text><text x="464" y="381" font-size="12" fill="#222" text-anchor="start">venenosas: tinhorão,</text><text x="464" y="396" font-size="12" fill="#222" text-anchor="start">copo-de-leite, antúrio.</text>
<rect x="20" y="440" width="640" height="66" rx="8" fill="#fde8e8" stroke="#d62828" stroke-width="1.5"/>
<text x="34" y="460" font-size="12.5" fill="#222" text-anchor="start">Toda folha desta família (aráceas) tem cristais que ferem boca e garganta. NUNCA coma taioba</text><text x="34" y="477" font-size="12.5" fill="#222" text-anchor="start">crua. Tire o talo grosso, pique, ferva 5 min, escorra (jogue a água fora) e depois refogue.</text><text x="34" y="494" font-size="12.5" fill="#222" text-anchor="start">Se coçar ou arder na boca, pare: não estava bem cozida ou não é taioba.</text>
</svg>
