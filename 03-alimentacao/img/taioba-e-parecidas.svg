<text x="24" y="336" font-size="12" fill="#222" text-anchor="start">O cabo (talo) prende na</text><text x="24" y="351" font-size="12" fill="#222" font-weight="bold" text-anchor="start">BORDA da folha, bem no</text><text x="24" y="366" font-size="12" fill="#222" text-anchor="start">"V" entre as duas</text><text x="24" y="381" font-size="12" fill="#222" text-anchor="start">orelhas. Talo verde,</text><text x="24" y="396" font-size="12" fill="#222" text-anchor="start">sem mancha roxa.</text>
