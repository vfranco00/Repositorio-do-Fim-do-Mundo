<text x="6" y="352" font-size="12" fill="#1d5d9b" font-weight="bold" text-anchor="start">a água</text><text x="6" y="367" font-size="12" fill="#1d5d9b" font-weight="bold" text-anchor="start">evapora</text>
<text x="415" y="112" font-size="12" fill="#222" font-weight="bold" text-anchor="start">pano MOLHADO por cima</text><text x="415" y="127" font-size="12" fill="#222" text-anchor="start">(funciona como tampa)</text>
<line x1="412" y1="118" x2="372" y2="124" stroke="#555" stroke-width="1.3"/><circle cx="372" cy="124" r="2.6" fill="#555"/>
<text x="415" y="192" font-size="12" fill="#222" font-weight="bold" text-anchor="start">pote de DENTRO:</text><text x="415" y="207" font-size="12" fill="#222" text-anchor="start">aqui vai a comida</text>
<line x1="412" y1="198" x2="297" y2="206" stroke="#555" stroke-width="1.3"/><circle cx="297" cy="206" r="2.6" fill="#555"/>
<text x="415" y="250" font-size="12" fill="#1d5d9b" font-weight="bold" text-anchor="start">AREIA MOLHADA</text><text x="415" y="265" font-size="12" fill="#1d5d9b" text-anchor="start">4 a 8 cm em volta e no fundo</text><text x="415" y="280" font-size="12" fill="#1d5d9b" text-anchor="start">(molhe 1 a 2 vezes por dia)</text>
<line x1="412" y1="256" x2="312" y2="258" stroke="#555" stroke-width="1.3"/><circle cx="312" cy="258" r="2.6" fill="#555"/>
<text x="415" y="322" font-size="12" fill="#222" font-weight="bold" text-anchor="start">pote de FORA: barro SEM</text><text x="415" y="337" font-size="12" fill="#222" text-anchor="start">verniz ou esmalte (tem</text><text x="415" y="352" font-size="12" fill="#222" text-anchor="start">que "suar")</text>
<line x1="412" y1="328" x2="336" y2="300" stroke="#555" stroke-width="1.3"/><circle cx="336" cy="300" r="2.6" fill="#555"/>
<rect x="20" y="422" width="640" height="98" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="34" y="442" font-size="12.5" fill="#222" text-anchor="start">Como funciona: a água atravessa o barro e evapora, levando o calor (como o suor e a moringa).</text><text x="34" y="459" font-size="12.5" fill="#222" text-anchor="start">Clima SECO e com vento (sertão, cerrado na seca): fica de 6 a 12 °C mais frio que o ar.</text><text x="34" y="476" font-size="12.5" fill="#222" text-anchor="start">Clima úmido (litoral, Amazônia, dias de chuva): esfria pouco, só 1 a 3 °C.</text><text x="34" y="493" font-size="12.5" fill="#222" text-anchor="start">Bom para verduras, frutas e tomate (duram 2 a 4 vezes mais). NÃO fica frio o bastante</text><text x="34" y="510" font-size="12.5" fill="#222" text-anchor="start">para guardar carne, peixe ou leite por vários dias.</text>
</svg>
