<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 528" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="528" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Espelho de sinalização: como mirar</text>
<circle cx="70" cy="80" r="22" fill="#ffd43b" stroke="#e8a400" stroke-width="3"/>
<line x1="98.0" y1="80.0" x2="108.0" y2="80.0" stroke="#e8a400" stroke-width="3"/>
<line x1="89.8" y1="99.8" x2="96.9" y2="106.9" stroke="#e8a400" stroke-width="3"/>
<line x1="70.0" y1="108.0" x2="70.0" y2="118.0" stroke="#e8a400" stroke-width="3"/>
<line x1="50.2" y1="99.8" x2="43.1" y2="106.9" stroke="#e8a400" stroke-width="3"/>
<line x1="42.0" y1="80.0" x2="32.0" y2="80.0" stroke="#e8a400" stroke-width="3"/>
<line x1="50.2" y1="60.2" x2="43.1" y2="53.1" stroke="#e8a400" stroke-width="3"/>
<line x1="70.0" y1="52.0" x2="70.0" y2="42.0" stroke="#e8a400" stroke-width="3"/>
<line x1="89.8" y1="60.2" x2="96.9" y2="53.1" stroke="#e8a400" stroke-width="3"/>
<text x="70" y="132" font-size="12" fill="#8a6200" font-weight="bold" text-anchor="middle">SOL</text>
<polyline points="150,312 150,236" fill="none" stroke="#1e1e1e" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/><polyline points="150,312 150,236" fill="none" stroke="#ef8a2b" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="150" cy="206" r="24" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="2.5"/><circle cx="174" cy="206" r="6.7" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="2"/><circle cx="163.2" cy="197.6" r="2.6" fill="#1e1e1e"/>
<rect x="178" y="190" width="8" height="34" fill="#cfe6fb" stroke="#1e1e1e" stroke-width="2" transform="rotate(-25 182 207)"/>
<text x="176" y="296" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">espelho junto ao olho</text>
<line x1="200" y1="284" x2="186" y2="222" stroke="#555" stroke-width="1.5"/>
<polyline points="160,250 250,228 330,214" fill="none" stroke="#1e1e1e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><polyline points="160,250 250,228 330,214" fill="none" stroke="#ef8a2b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="336" cy="212" r="8" fill="#f2c9a5" stroke="#1e1e1e" stroke-width="2"/>
<polyline points="340,206 352,178" fill="none" stroke="#1e1e1e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><polyline points="340,206 352,178" fill="none" stroke="#f2c9a5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="343,209 368,190" fill="none" stroke="#1e1e1e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><polyline points="343,209 368,190" fill="none" stroke="#f2c9a5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="352" y="152" font-size="12" fill="#222" font-weight="bold" text-anchor="middle">dedos em V</text>
<text x="352" y="166" font-size="11" fill="#444" text-anchor="middle">(o alvo fica entre eles)</text>
<line x1="90" y1="98" x2="180" y2="204" stroke="#e8a400" stroke-width="3" stroke-dasharray="8 5"/>
<line x1="184" y1="204" x2="600" y2="175" stroke="#e8a400" stroke-width="3" stroke-dasharray="8 5"/>
<circle cx="358" cy="192" r="6" fill="#fff3a0" stroke="#e8a400" stroke-width="2"/>
<path d="M600 175 l40 -6 l8 -12 l6 2 l-4 14 l18 -2 l2 6 l-18 4 l6 14 l-6 2 l-12 -12 l-38 6 Z" fill="#9aa5b1" stroke="#1e1e1e" stroke-width="2"/>
<text x="612" y="216" font-size="12" fill="#222" font-weight="bold" text-anchor="middle">alvo</text>
<rect x="20" y="330" width="640" height="186" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="34" y="352.0" font-size="12.5" fill="#222" text-anchor="start">1. Segure o espelho junto ao olho, com a face brilhante virada para o sol.</text>
<text x="34" y="370.5" font-size="12.5" fill="#222" text-anchor="start">2. Estique o outro braço e faça um V com os dedos. Enquadre o alvo (avião, barco,</text>
<text x="52" y="389.0" font-size="12.5" fill="#222" text-anchor="start">casa, morro) entre os dedos.</text>
<text x="34" y="407.5" font-size="12.5" fill="#222" text-anchor="start">3. Incline o espelho até o reflexo (ponto de luz) aparecer na sua mão ou nos dedos.</text>
<text x="34" y="426.0" font-size="12.5" fill="#222" text-anchor="start">4. Mova o espelho devagar para o ponto de luz passar pelo V, de um lado para o outro:</text>
<text x="52" y="444.5" font-size="12.5" fill="#222" text-anchor="start">o alvo recebe flashes.</text>
<text x="34" y="463.0" font-size="12.5" fill="#222" text-anchor="start">Espelho com furo no meio: olhe o alvo pelo furo e mova até o ponto de luz cair sobre ele.</text>
<text x="34" y="481.5" font-size="12.5" fill="#222" text-anchor="start">Alcance: dezenas de km com sol. Varra o horizonte mesmo sem ver ninguém. Serve CD,</text>
<text x="34" y="500.0" font-size="12.5" fill="#222" text-anchor="start">lata polida, tela de celular apagado. Quando o piloto responder, não mire mais no rosto dele.</text>
</svg>
