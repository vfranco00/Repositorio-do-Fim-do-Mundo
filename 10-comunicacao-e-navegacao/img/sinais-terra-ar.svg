<line x1="632.0" y1="130" x2="608.0" y2="154" stroke="#1e1e1e" stroke-width="17" stroke-linecap="square"/><line x1="632.0" y1="130" x2="608.0" y2="154" stroke="#f7f3e6" stroke-width="13" stroke-linecap="square"/>
<text x="598.0" y="216" font-size="13" fill="#3f6d9e" font-weight="bold" text-anchor="middle">FUI NESTA</text>
<text x="598.0" y="233" font-size="13" fill="#3f6d9e" font-weight="bold" text-anchor="middle">DIREÇÃO</text>
<text x="598.0" y="250" font-size="11" fill="#444" text-anchor="middle">(aponte para onde foi)</text>
<rect x="20" y="270" width="300" height="200" rx="8" fill="#f6f1e4" stroke="#c9bba0"/>
<text x="170" y="292" font-size="13.5" fill="#222" font-weight="bold" text-anchor="middle">Tamanho mínimo (letra V)</text>
<rect x="40" y="308" width="160" height="134" fill="#8fbf6a" rx="4"/>
<line x1="70" y1="316" x2="120" y2="432" stroke="#1e1e1e" stroke-width="20" stroke-linecap="square"/><line x1="70" y1="316" x2="120" y2="432" stroke="#f7f3e6" stroke-width="16" stroke-linecap="square"/>
<line x1="170" y1="316" x2="120" y2="432" stroke="#1e1e1e" stroke-width="20" stroke-linecap="square"/><line x1="170" y1="316" x2="120" y2="432" stroke="#f7f3e6" stroke-width="16" stroke-linecap="square"/>
<line x1="216" y1="316" x2="216" y2="432" stroke="#1e1e1e" stroke-width="1.5"/>
<line x1="210" y1="316" x2="222" y2="316" stroke="#1e1e1e" stroke-width="1.5"/><line x1="210" y1="432" x2="222" y2="432" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="226" y="362" font-size="12" fill="#222" font-weight="bold" text-anchor="start">3 m no</text>
<text x="226" y="378" font-size="12" fill="#222" font-weight="bold" text-anchor="start">mínimo;</text>
<text x="226" y="394" font-size="12" fill="#222" text-anchor="start">melhor</text>
<text x="226" y="410" font-size="12" fill="#222" text-anchor="start">6 a 10 m</text>
<text x="170" y="461" font-size="12" fill="#222" text-anchor="middle">faixa com ~1/6 do comprimento (1 m)</text>
<rect x="334" y="270" width="326" height="200" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="346" y="294.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Lugar aberto: clareira, praia, topo,</text>
<text x="346" y="310.4" font-size="12" fill="#222" text-anchor="start">campo, telhado, banco de areia.</text>
<text x="346" y="326.8" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Linhas RETAS e cantos vivos: não</text>
<text x="346" y="343.2" font-size="12" fill="#222" text-anchor="start">existem na natureza e chamam atenção.</text>
<text x="346" y="359.6" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Contraste: pano claro, pedras claras ou</text>
<text x="346" y="376.0" font-size="12" fill="#222" text-anchor="start">capim cortado sobre fundo escuro; galhos</text>
<text x="346" y="392.4" font-size="12" fill="#222" text-anchor="start">e terra revirada sobre fundo claro.</text>
<text x="346" y="408.79999999999995" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Valas cavadas ou montes fazem SOMBRA</text>
<text x="346" y="425.2" font-size="12" fill="#222" text-anchor="start">e aparecem melhor com sol baixo.</text>
<text x="346" y="441.6" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Avião BALANÇA AS ASAS (ou pisca as luzes</text>
<text x="346" y="458.0" font-size="12" fill="#222" text-anchor="start">2 vezes à noite) = mensagem entendida.</text>
<text x="340" y="506" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">Com o corpo, de frente para o avião ou helicóptero</text>
