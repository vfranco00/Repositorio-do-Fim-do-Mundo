<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Sinais terra-ar (para aviões e helicópteros)</text>
<text x="340" y="56" font-size="13" fill="#222" text-anchor="middle">Monte no chão, em lugar aberto, com material que CONTRASTE com o fundo</text>
