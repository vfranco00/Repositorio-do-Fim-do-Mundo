<text x="500" y="738" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle">N — um braço para cima, outro para</text>
<text x="500" y="754" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle">baixo: "NÃO PRECISAMOS DE AJUDA"</text>
<text x="340" y="780" font-size="12.5" fill="#444" text-anchor="middle">Agite um pano claro ou colorido na mão para ser visto de mais longe.</text>
