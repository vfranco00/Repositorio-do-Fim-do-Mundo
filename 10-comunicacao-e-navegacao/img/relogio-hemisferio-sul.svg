<text x="530" y="266" font-size="12" fill="#222" font-weight="bold" text-anchor="middle">À tarde (16 h): a linha</text>
<text x="530" y="281" font-size="12" fill="#222" font-weight="bold" text-anchor="middle">do meio fica no 2.</text>
<rect x="400" y="300" width="260" height="216" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="412" y="322.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Só vale no HEMISFÉRIO SUL.</text><text x="412" y="340.5" font-size="12" fill="#222" text-anchor="start">(No hemisfério norte é o ponteiro</text><text x="412" y="359.0" font-size="12" fill="#222" text-anchor="start">das horas que aponta para o sol, e a</text><text x="412" y="377.5" font-size="12" fill="#222" text-anchor="start">linha do meio indica o SUL.)</text><text x="412" y="396.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Horário de verão: use o 1 no</text><text x="412" y="414.5" font-size="12" fill="#222" text-anchor="start">lugar do 12.</text><text x="412" y="433.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Erro de 15° a 30°. Não use perto</text><text x="412" y="451.5" font-size="12" fill="#222" text-anchor="start">do meio-dia nem no Norte e</text><text x="412" y="470.0" font-size="12" fill="#222" text-anchor="start">Nordeste quando o sol está quase</text><text x="412" y="488.5" font-size="12" fill="#222" text-anchor="start">a pino; ali prefira a sombra.</text>
</svg>
