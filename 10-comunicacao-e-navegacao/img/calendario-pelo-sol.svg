<text x="280" y="104" font-size="12" fill="#d62828" font-weight="bold" text-anchor="middle">DEZEMBRO</text>
<text x="280" y="118" font-size="11" fill="#444" text-anchor="middle">solstício</text>
<text x="280" y="131" font-size="11" fill="#444" text-anchor="middle">de verão</text>
<path d="M98 146 Q 180 128 262 146" fill="none" stroke="#888" stroke-width="2"/>
<line x1="240" y1="141" x2="258.1" y2="144.8" stroke="#888" stroke-width="2"/><polygon points="264,146 252.4,148.9 254.5,138.7" fill="#888"/>
<line x1="120" y1="141" x2="101.9" y2="144.8" stroke="#888" stroke-width="2"/><polygon points="96,146 105.5,138.7 107.6,148.9" fill="#888"/>
<text x="40" y="246" font-size="11" fill="#222" font-weight="bold" text-anchor="start">esquerda = NORTE</text>
<text x="320" y="246" font-size="11" fill="#222" font-weight="bold" text-anchor="end">direita = SUL</text>
<text x="180" y="272" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">até 23° a 28° para cada lado</text>
<text x="30" y="296" font-size="11.5" fill="#222" text-anchor="start">Marque, do mesmo lugar, onde o sol nasce</text>
<text x="30" y="311" font-size="11.5" fill="#222" text-anchor="start">(estaca, árvore, morro). Nos extremos ele</text>
<text x="30" y="326" font-size="11.5" fill="#222" text-anchor="start">"para" uns dias e volta: é o solstício.</text>
<rect x="350" y="48" width="310" height="316" rx="8" fill="#f6efe0" stroke="#d6c39b"/>
<text x="505" y="68" font-size="12" fill="#6b4f2a" font-weight="bold" text-anchor="middle">Sombra ao MEIO-DIA de uma vara de 1 m</text>
<text x="505" y="84" font-size="11" fill="#6b4f2a" text-anchor="middle">(exemplo: Brasília, 16° S)</text>
<line x1="360" y1="262" x2="650" y2="262" stroke="#6b4f2a" stroke-width="3"/>
<line x1="470" y1="262" x2="470" y2="132" stroke="#8b5a2b" stroke-width="6"/>
<text x="462" y="197.0" font-size="12" fill="#222" font-weight="bold" text-anchor="end">1 m</text>
<line x1="470" y1="132" x2="576.6" y2="262" stroke="#c26a00" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="470" y1="266" x2="576.6" y2="266" stroke="#c26a00" stroke-width="5"/>
<circle cx="576.6" cy="262" r="4.5" fill="#c26a00"/>
<text x="576.6" y="286" font-size="11.5" fill="#c26a00" font-weight="bold" text-anchor="middle">junho: 82 cm</text>
<line x1="470" y1="132" x2="506.4" y2="262" stroke="#2b8a3e" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="470" y1="266" x2="506.4" y2="266" stroke="#2b8a3e" stroke-width="5"/>
<circle cx="506.4" cy="262" r="4.5" fill="#2b8a3e"/>
<text x="506.4" y="304" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="middle">mar/set: 28 cm</text>
<line x1="470" y1="132" x2="453.1" y2="262" stroke="#d62828" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="470" y1="266" x2="453.1" y2="266" stroke="#d62828" stroke-width="5"/>
<circle cx="453.1" cy="262" r="4.5" fill="#d62828"/>
<text x="457.1" y="286" font-size="11.5" fill="#d62828" font-weight="bold" text-anchor="end">dez: 13 cm</text>
<text x="368" y="256" font-size="11" fill="#444" font-weight="bold" text-anchor="start">NORTE</text>
<text x="646" y="256" font-size="11" fill="#444" font-weight="bold" text-anchor="end">SUL</text>
<text x="505" y="324" font-size="11.5" fill="#222" text-anchor="middle">A sombra mais longa do ano é em junho e</text>
<text x="505" y="339" font-size="11.5" fill="#222" text-anchor="middle">a mais curta em dezembro. Ao norte de</text>
<text x="505" y="354" font-size="11.5" fill="#222" text-anchor="middle">~23° S, em dezembro ela aponta para o norte.</text>
<rect x="20" y="376" width="640" height="76" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="34" y="398" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Solstício de inverno: ~21 de junho (dia mais curto do ano).</text>
<text x="34" y="416" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Equinócios: ~20 de março e ~22 de setembro (dia = noite; o sol nasce no leste exato).</text>
<text x="34" y="434" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Solstício de verão: ~21 de dezembro (dia mais longo do ano).</text>
</svg>
