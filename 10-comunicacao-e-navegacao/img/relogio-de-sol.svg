<text x="36" y="444" font-size="11.5" fill="#3f6d9e" font-weight="bold" text-anchor="start">ângulo = sua</text>
<text x="36" y="458" font-size="11.5" fill="#3f6d9e" font-weight="bold" text-anchor="start">latitude (ex.: 20°)</text>
<line x1="90" y1="464" x2="116" y2="496" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="34" y="534" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">NORTE</text>
<text x="306" y="534" font-size="11.5" fill="#222" font-weight="bold" text-anchor="end">SUL</text>
<text x="170" y="534" font-size="11" fill="#444" text-anchor="middle">placa NIVELADA</text>
<rect x="332" y="380" width="328" height="170" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="344" y="400.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">1. Placa plana e nivelada.</text>
<text x="344" y="415.6" font-size="12" fill="#222" font-weight="bold" text-anchor="start">2. Linha das 12 h no rumo norte–sul</text>
<text x="344" y="431.2" font-size="12" fill="#222" text-anchor="start">verdadeiro (sombra mais curta do dia).</text>
<text x="344" y="446.8" font-size="12" fill="#222" font-weight="bold" text-anchor="start">3. Gnômon com ângulo = latitude.</text>
<text x="344" y="462.4" font-size="12" fill="#222" font-weight="bold" text-anchor="start">4. Horas: use a tabela do texto, ou</text>
<text x="344" y="478.0" font-size="12" fill="#222" text-anchor="start">marque a sombra de hora em hora com</text>
<text x="344" y="493.6" font-size="12" fill="#222" text-anchor="start">um relógio que ainda funcione.</text>
<text x="344" y="509.2" font-size="12" fill="#222" font-weight="bold" text-anchor="start">5. Marca a hora SOLAR: corrija com</text>
<text x="344" y="524.8" font-size="12" fill="#222" text-anchor="start">a tabela do texto. A sombra anda no</text>
<text x="344" y="540.4" font-size="12" fill="#222" text-anchor="start">sentido anti-horário.</text>
