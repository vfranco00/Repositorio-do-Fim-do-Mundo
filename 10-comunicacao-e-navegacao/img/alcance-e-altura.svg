<text x="34" y="632" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">VHF e UHF (rádio de mão, VHF marítimo, radioamador de 2 m) andam em</text>
<text x="34" y="650" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">LINHA RETA, como a luz: manda a ALTURA da antena e não haver morro no meio.</text>
<text x="34" y="668" font-size="12.5" fill="#222" text-anchor="start">Suba num ponto alto para falar. Ondas curtas, AM e PX (27 MHz) podem ir muito mais</text>
<text x="34" y="686" font-size="12.5" fill="#222" text-anchor="start">longe refletindo no céu (ionosfera), sobretudo à noite.</text>
