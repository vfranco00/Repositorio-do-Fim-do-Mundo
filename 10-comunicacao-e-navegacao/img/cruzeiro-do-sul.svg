<text x="123.11160754389098" y="209.0101361653203" font-size="11.5" fill="#3f6d9e" font-weight="bold" text-anchor="middle">Centauri</text>
<text x="159.9538305284533" y="141.42924195261426" font-size="11.5" fill="#3f6d9e" font-weight="bold" text-anchor="middle">Beta Centauri</text>
<text x="138.53271903617213" y="119.71968905896728" font-size="12" fill="#3f6d9e" font-weight="bold" text-anchor="middle">AS GUARDAS</text>
<text x="280.0" y="114.5621777410513" font-size="12" fill="#1d2b4f" font-weight="bold" text-anchor="start">CRUZEIRO</text>
<text x="280.0" y="128.5621777410513" font-size="12" fill="#1d2b4f" font-weight="bold" text-anchor="start">DO SUL</text>
<circle cx="250.0" cy="372.0" r="7" fill="none" stroke="#d62828" stroke-width="3"/>
<text x="264.0" y="396.0" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">Polo Sul Celeste</text>
<text x="264.0" y="410.0" font-size="11" fill="#b3001b" text-anchor="start">(ponto vazio do céu)</text>
<line x1="250.0" y1="380.0" x2="250.0" y2="540.8" stroke="#2b8a3e" stroke-width="3"/>
<polygon points="242.0,530.8 258.0,530.8 250.0,544.8" fill="#2b8a3e"/>
<text x="260.0" y="473.4" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">desça reto</text>
<text x="260.0" y="487.4" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">até o horizonte</text>
<text x="250.0" y="576.8" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">SUL</text>
<text x="30" y="461.4" font-size="11" fill="#444" text-anchor="start">altura do polo</text>
<text x="30" y="474.4" font-size="11" fill="#444" text-anchor="start">= sua latitude</text>
<text x="30" y="487.4" font-size="11" fill="#444" text-anchor="start">(aqui 23°)</text>
<rect x="462" y="46" width="198" height="236" rx="8" fill="#e9eef7" stroke="#9fb3cc"/>
<text x="561.0" y="64" font-size="12" fill="#1d2b4f" font-weight="bold" text-anchor="middle">o Cruzeiro, ampliado</text>
