<text x="603.2647574453172" y="110.40230621757856" font-size="11" fill="#222" font-weight="bold" text-anchor="middle">Gacrux (topo,</text>
<text x="603.2647574453172" y="123.40230621757856" font-size="11" fill="#222" font-weight="bold" text-anchor="middle">alaranjada)</text>
<polygon points="599.8,152.4 601.3,156.0 605.2,156.3 602.2,158.9 603.1,162.7 599.8,160.7 596.4,162.7 597.3,158.9 594.4,156.3 598.3,156.0" fill="#1d2b4f"/>
<text x="605.7580332831424" y="180.1015319556472" font-size="11" fill="#222" font-weight="bold" text-anchor="middle">Pálida</text>
<polygon points="575.5,188.8 576.6,191.4 579.4,191.7 577.2,193.5 577.9,196.3 575.5,194.8 573.0,196.3 573.7,193.5 571.5,191.7 574.4,191.4" fill="#1d2b4f"/>
<text x="597.4694167184933" y="212.93967702135768" font-size="11" fill="#222" font-weight="bold" text-anchor="middle">Intrometida</text>
<text x="466" y="304.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">1. Ache o Cruzeiro: 4 estrelas</text><text x="466" y="320.5" font-size="12" fill="#222" text-anchor="start">em cruz + 1 menor (Intrometida)</text><text x="466" y="337.0" font-size="12" fill="#222" text-anchor="start">e, ao lado, 2 estrelas muito</text><text x="466" y="353.5" font-size="12" fill="#222" text-anchor="start">brilhantes: as Guardas.</text><text x="466" y="370.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">2. Prolongue o braço maior,</text><text x="466" y="386.5" font-size="12" fill="#222" text-anchor="start">do topo para o pé, 4 vezes e</text><text x="466" y="403.0" font-size="12" fill="#222" text-anchor="start">meia o tamanho da cruz.</text><text x="466" y="419.5" font-size="12" fill="#222" font-weight="bold" text-anchor="start">3. Confira: a linha que sai do</text><text x="466" y="436.0" font-size="12" fill="#222" text-anchor="start">meio das Guardas, em ângulo</text><text x="466" y="452.5" font-size="12" fill="#222" text-anchor="start">reto, chega ao mesmo ponto.</text><text x="466" y="469.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">4. Desse ponto, desça reto até</text><text x="466" y="485.5" font-size="12" fill="#222" text-anchor="start">o horizonte: ali é o SUL.</text><text x="466" y="502.0" font-size="12" fill="#222" text-anchor="start">Marque com uma estaca e</text><text x="466" y="518.5" font-size="12" fill="#222" text-anchor="start">espere o dia para conferir.</text>
<rect x="20" y="600.8" width="640" height="76" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="32" y="620.8" font-size="12" fill="#222" text-anchor="start">O Cruzeiro gira em volta do polo durante a noite (pode estar deitado ou de cabeça para baixo):</text><text x="32" y="637.8" font-size="12" fill="#222" text-anchor="start">o método funciona em qualquer posição. Cuidado com o "Falso Cruzeiro": é maior, mais apagado,</text><text x="32" y="654.8" font-size="12" fill="#222" text-anchor="start">sem a 5ª estrela e sem as Guardas ao lado. Punho fechado com o braço esticado ≈ 10° no céu.</text>
</svg>
