<line x1="166" y1="100" x2="262" y2="86" stroke="#555" stroke-width="1.3"/><circle cx="166" cy="100" r="2.5" fill="#555"/><text x="267" y="90" font-size="12" fill="#222" font-weight="bold" text-anchor="start">seta de direção</text><text x="267" y="105" font-size="11.5" fill="#444" text-anchor="start">(aponte para o alvo)</text>
<line x1="162" y1="166" x2="262" y2="128" stroke="#555" stroke-width="1.3"/><circle cx="162" cy="166" r="2.5" fill="#555"/><text x="267" y="132" font-size="12" fill="#222" font-weight="bold" text-anchor="start">índice</text><text x="267" y="147" font-size="11.5" fill="#444" text-anchor="start">(leia o rumo aqui)</text>
<line x1="220" y1="210" x2="262" y2="168" stroke="#555" stroke-width="1.3"/><circle cx="220" cy="210" r="2.5" fill="#555"/><text x="267" y="172" font-size="12" fill="#222" font-weight="bold" text-anchor="start">limbo giratório</text><text x="267" y="187" font-size="11.5" fill="#444" text-anchor="start">(graus de 0 a 360)</text>
<line x1="163" y1="220" x2="262" y2="212" stroke="#555" stroke-width="1.3"/><circle cx="163" cy="220" r="2.5" fill="#555"/><text x="267" y="216" font-size="12" fill="#222" font-weight="bold" text-anchor="start">agulha: parte VERMELHA</text><text x="267" y="231" font-size="11.5" fill="#444" text-anchor="start">aponta o norte magnético</text>
<line x1="150" y1="280" x2="262" y2="256" stroke="#555" stroke-width="1.3"/><circle cx="150" cy="280" r="2.5" fill="#555"/><text x="267" y="260" font-size="12" fill="#222" font-weight="bold" text-anchor="start">seta de orientação</text><text x="267" y="275" font-size="11.5" fill="#444" text-anchor="start">(no fundo do limbo)</text>
<line x1="200" y1="300" x2="262" y2="300" stroke="#555" stroke-width="1.3"/><circle cx="200" cy="300" r="2.5" fill="#555"/><text x="267" y="304" font-size="12" fill="#222" font-weight="bold" text-anchor="start">linhas meridianas</text><text x="267" y="319" font-size="11.5" fill="#444" text-anchor="start">(alinhe com o norte do mapa)</text>
<line x1="80" y1="370" x2="262" y2="346" stroke="#555" stroke-width="1.3"/><circle cx="80" cy="370" r="2.5" fill="#555"/><text x="267" y="350" font-size="12" fill="#222" font-weight="bold" text-anchor="start">régua (para o mapa)</text>
<rect x="470" y="60" width="190" height="340" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="480" y="84.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Tirar um rumo:</text><text x="480" y="101.5" font-size="12" fill="#222" font-weight="bold" text-anchor="start">1. Segure a bússola</text><text x="480" y="119.0" font-size="12" fill="#222" text-anchor="start">na altura do peito,</text><text x="480" y="136.5" font-size="12" fill="#222" text-anchor="start">bem na horizontal, com</text><text x="480" y="154.0" font-size="12" fill="#222" text-anchor="start">a seta de direção</text><text x="480" y="171.5" font-size="12" fill="#222" text-anchor="start">apontando para o alvo.</text><text x="480" y="189.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">2. Gire o limbo até a</text><text x="480" y="206.5" font-size="12" fill="#222" text-anchor="start">seta de orientação</text><text x="480" y="224.0" font-size="12" fill="#222" text-anchor="start">ficar embaixo da parte</text><text x="480" y="241.5" font-size="12" fill="#222" text-anchor="start">VERMELHA da agulha</text><text x="480" y="259.0" font-size="12" fill="#222" text-anchor="start">("vermelho na casinha").</text><text x="480" y="276.5" font-size="12" fill="#222" font-weight="bold" text-anchor="start">3. Leia o número no</text><text x="480" y="294.0" font-size="12" fill="#222" text-anchor="start">índice: é o rumo</text><text x="480" y="311.5" font-size="12" fill="#222" text-anchor="start">magnético (ex.: 120°).</text><text x="480" y="329.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">4. Para seguir: mantenha</text><text x="480" y="346.5" font-size="12" fill="#222" text-anchor="start">o vermelho na casinha e</text><text x="480" y="364.0" font-size="12" fill="#222" text-anchor="start">ande para onde a seta</text><text x="480" y="381.5" font-size="12" fill="#222" text-anchor="start">de direção aponta.</text>
<text x="340" y="428" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="middle">Longe de ferro, carro, cerca de arame, celular, rádio e fios: tudo isso desvia a agulha.</text>
</svg>
