<rect x="20" y="400" width="640" height="94" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="34" y="422" font-size="12.5" fill="#222" text-anchor="start">Não usa pilha: a energia vem da própria onda de rádio. Pega estações AM fortes (até</text>
<text x="34" y="440" font-size="12.5" fill="#222" text-anchor="start">50–150 km de dia, mais longe à noite). Gire o capacitor devagar para trocar de estação.</text>
<text x="34" y="462" font-size="12.5" fill="#222" text-anchor="start">Sem capacitor variável: faça uma bobina com várias derivações (ex.: a cada 10 voltas)</text>
<text x="34" y="480" font-size="12.5" fill="#222" text-anchor="start">e encoste um fio em cada uma até ouvir a estação.</text>
</svg>
