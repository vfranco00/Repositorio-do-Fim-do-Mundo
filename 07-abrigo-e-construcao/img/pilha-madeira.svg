<text x="494" y="86" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">telhado ou chapa com</text>
<text x="494" y="100" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">beiral + peso em cima</text>
<line x1="492.0" y1="94.0" x2="470.0" y2="128.0" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
<text x="494" y="150.0" font-size="11.5" fill="#6a4320" font-weight="bold" text-anchor="start">tabiques: sarrafos SECOS</text><text x="494" y="164.95" font-size="11.5" fill="#6a4320" font-weight="bold" text-anchor="start">de 2–2,5 cm, a cada</text><text x="494" y="179.9" font-size="11.5" fill="#6a4320" font-weight="bold" text-anchor="start">40–60 cm, sempre um</text><text x="494" y="194.85" font-size="11.5" fill="#6a4320" font-weight="bold" text-anchor="start">EM CIMA do outro</text>
<line x1="492.0" y1="160.0" x2="445.0" y2="200.0" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
<text x="494" y="238.0" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">pontas pintadas</text><text x="494" y="252.95" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">(tinta, cera ou parafina):</text><text x="494" y="267.9" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">não racham</text>
<line x1="492.0" y1="244.0" x2="466.0" y2="250.0" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
<text x="494" y="290.0" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">base nivelada,</text><text x="494" y="304.95" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">30–50 cm do chão</text>
<line x1="492.0" y1="292.0" x2="462.0" y2="300.0" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
<rect x="14" y="368" width="652" height="52" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="26" y="388" font-size="11.5" fill="#1e3a5f" font-weight="bold" text-anchor="start">Tempo de secagem ao ar: cerca de 1 ano para cada 2,5 cm de espessura (menos no calor seco).</text>
<text x="26" y="406" font-size="11.5" fill="#222" text-anchor="start">Tabique fora de prumo = tábua empenada. Lugar ventilado e à sombra, longe do chão úmido e de cupins.</text>
