<text x="178" y="80.0" font-size="11.5" fill="#8a6100" font-weight="bold" text-anchor="start">sol de verão (alto): bate no</text><text x="178" y="94.95" font-size="11.5" fill="#8a6100" font-weight="bold" text-anchor="start">telhado; o beiral faz sombra</text>
<text x="10" y="170.0" font-size="11.5" fill="#8a6100" font-weight="bold" text-anchor="start">sol de inverno (baixo):</text><text x="10" y="184.95" font-size="11.5" fill="#8a6100" font-weight="bold" text-anchor="start">entra pela janela</text>
<text x="400" y="104.0" font-size="11.5" fill="#e8590c" font-weight="bold" text-anchor="start">ar quente sai pelo</text><text x="400" y="118.95" font-size="11.5" fill="#e8590c" font-weight="bold" text-anchor="start">lanternim (topo)</text>
<line x1="398.0" y1="112.0" x2="372.0" y2="150.0" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
<text x="452" y="172.0" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">telhado claro</text>
<text x="232" y="304.0" font-size="11" fill="#444" text-anchor="start">forro + colchão de ar ventilado;</text><text x="232" y="318.3" font-size="11" fill="#444" text-anchor="start">manta refletora sob a telha</text>
<line x1="300.0" y1="288.0" x2="290.0" y2="252.0" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
<text x="232" y="392.0" font-size="11" fill="#1d5fa8" font-weight="bold" text-anchor="start">janelas grandes do lado do vento,</text><text x="232" y="406.3" font-size="11" fill="#1d5fa8" font-weight="bold" text-anchor="start">saída alta do lado oposto</text>
<text x="358" y="284.0" font-size="11" fill="#444" text-anchor="start">pé-direito 2,8–3 m</text>
<text x="10" y="268.0" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">beiral largo</text>
<line x1="80.0" y1="264.0" x2="134.0" y2="278.0" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
<text x="560" y="220.0" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">árvore e</text><text x="560" y="234.95" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">varanda:</text><text x="560" y="249.9" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="start">sombra</text>
<text x="420" y="466.0" font-size="11" fill="#222" text-anchor="start">piso acima do chão, calçada em volta</text>
<text x="10" y="466.0" font-size="11" fill="#222" text-anchor="start">paredes claras (cal)</text>
<rect x="14" y="486" width="652" height="92" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="26" y="506" font-size="11.5" fill="#222" text-anchor="start">Calor úmido (litoral, Norte): casa leve, aberta, sombreada, piso elevado; paredes grossas ajudam pouco.</text>
<text x="26" y="524" font-size="11.5" fill="#222" text-anchor="start">Calor de dia e frio à noite (sertão, cerrado, serras): paredes grossas de terra ou pedra (massa térmica).</text>
<text x="26" y="542" font-size="11.5" fill="#222" text-anchor="start">Inverno frio (Sul, serras): janelas para o NORTE, frestas vedadas, forro isolado, fogão a lenha no centro.</text>
<text x="26" y="562" font-size="11.5" fill="#1e3a5f" font-weight="bold" text-anchor="start">Do Sudeste ao Sul o sol fica ao norte quase o ano todo; perto do Equador, quase a pino.</text>
</svg>
