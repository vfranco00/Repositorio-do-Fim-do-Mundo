<text x="26" y="696" font-size="13" fill="#1e3a5f" font-weight="bold" text-anchor="start">Amarrações</text>
<text x="26" y="715" font-size="11.5" fill="#222" text-anchor="start">• Corda da cumeeira: lais de guia numa árvore e nó de caminhoneiro na outra (estica e solta fácil).</text>
<text x="26" y="732" font-size="11.5" fill="#222" text-anchor="start">• Estacas de 25–30 cm cravadas inclinadas 45°, com a cabeça para FORA do abrigo.</text>
<text x="26" y="749" font-size="11.5" fill="#222" text-anchor="start">• Lona sem ilhós: embrulhe uma pedrinha na ponta, amarre a corda por trás dela (não rasga).</text>
<text x="26" y="766" font-size="11.5" fill="#222" text-anchor="start">• Lona bem esticada, sem barriga: água empoçada pesa e rasga. Confira os nós antes de dormir.</text>
