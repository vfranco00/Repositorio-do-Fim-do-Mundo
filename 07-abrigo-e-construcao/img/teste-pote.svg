<text x="232" y="342.0" font-size="12" fill="#6b4a10" font-weight="bold" text-anchor="start">AREIA — 6 cm = 60%</text><text x="232" y="357.6" font-size="12" fill="#6b4a10" font-weight="bold" text-anchor="start">assenta em ~1 minuto</text>
<text x="232" y="290.0" font-size="12" fill="#5a4630" font-weight="bold" text-anchor="start">SILTE — 2 cm = 20%</text><text x="232" y="305.6" font-size="12" fill="#5a4630" font-weight="bold" text-anchor="start">em ~2 horas</text>
<text x="232" y="240.0" font-size="12" fill="#6e3a22" font-weight="bold" text-anchor="start">ARGILA — 2 cm = 20%</text><text x="232" y="255.6" font-size="12" fill="#6e3a22" font-weight="bold" text-anchor="start">em 1–2 dias (água clareia)</text>
<line x1="228.0" y1="258.0" x2="228.0" y2="274.0" stroke="#6e3a22" stroke-width="1.5" stroke-linecap="round"/>
<text x="232" y="140.0" font-size="11.5" fill="#2a5d91" text-anchor="start">água</text><text x="232" y="154.95" font-size="11.5" fill="#2a5d91" text-anchor="start">(turva até a argila assentar)</text>
<text x="232" y="104.0" font-size="11" fill="#444" text-anchor="start">restos de raiz e folha boiando</text>
<text x="130.0" y="408" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">total de terra assentada: 10 cm</text>
<line x1="440.0" y1="56.0" x2="440.0" y2="400.0" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
<text x="452" y="66" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Como fazer</text>
<circle cx="462.0" cy="92.0" r="11" fill="#3f6d9e" stroke="#1e1e1e" stroke-width="1.5"/><text x="462" y="96.5" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="480" y="96.0" font-size="11.5" fill="#222" text-anchor="start">Pote de vidro liso e reto (~1 L).</text><text x="480" y="110.95" font-size="11.5" fill="#222" text-anchor="start">Encha 1/3 com terra peneirada,</text><text x="480" y="125.9" font-size="11.5" fill="#222" text-anchor="start">tirada a 30–50 cm de fundura.</text>
<circle cx="462.0" cy="168.0" r="11" fill="#3f6d9e" stroke="#1e1e1e" stroke-width="1.5"/><text x="462" y="172.5" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="480" y="172.0" font-size="11.5" fill="#222" text-anchor="start">Complete com água até 3/4.</text><text x="480" y="186.95" font-size="11.5" fill="#222" text-anchor="start">1 colher (chá) de sal ajuda</text><text x="480" y="201.9" font-size="11.5" fill="#222" text-anchor="start">a argila a assentar.</text>
<circle cx="462.0" cy="244.0" r="11" fill="#3f6d9e" stroke="#1e1e1e" stroke-width="1.5"/><text x="462" y="248.5" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="480" y="248.0" font-size="11.5" fill="#222" text-anchor="start">Tampe e agite forte por</text><text x="480" y="262.95" font-size="11.5" fill="#222" text-anchor="start">2 minutos. Deixe parado em</text><text x="480" y="277.9" font-size="11.5" fill="#222" text-anchor="start">lugar plano, sem mexer.</text>
<circle cx="462.0" cy="320.0" r="11" fill="#3f6d9e" stroke="#1e1e1e" stroke-width="1.5"/><text x="462" y="324.5" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
<text x="480" y="324.0" font-size="11.5" fill="#222" text-anchor="start">Marque com caneta a areia</text><text x="480" y="338.95" font-size="11.5" fill="#222" text-anchor="start">(1 min), o silte (2 h) e a</text><text x="480" y="353.9" font-size="11.5" fill="#222" text-anchor="start">argila (quando a água clarear).</text>
<rect x="14" y="418" width="652" height="126" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="26" y="438" font-size="12" fill="#1e3a5f" font-weight="bold" text-anchor="start">Conta: % = altura da camada ÷ altura total × 100.</text>
<text x="26" y="455" font-size="11.5" fill="#1e3a5f" text-anchor="start">O teste é aproximado: confirme sempre fazendo tijolos de prova.</text>
<text x="30" y="480" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">ARGILA abaixo de 10%</text>
<text x="30" y="498.0" font-size="11.5" fill="#222" text-anchor="start">terra fraca, esfarela.</text><text x="30" y="512.95" font-size="11.5" fill="#222" text-anchor="start">Junte terra argilosa ou</text><text x="30" y="527.9" font-size="11.5" fill="#222" text-anchor="start">use cal/cimento.</text>
<text x="244" y="480" font-size="12" fill="#1f6b2e" font-weight="bold" text-anchor="start">ARGILA de 10% a 30%</text>
<text x="244" y="498.0" font-size="11.5" fill="#222" text-anchor="start">boa para adobe, taipa,</text><text x="244" y="512.95" font-size="11.5" fill="#222" text-anchor="start">cob e superadobe.</text><text x="244" y="527.9" font-size="11.5" fill="#222" text-anchor="start">Ajuste com o teste.</text>
<text x="458" y="480" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">ARGILA acima de 30%</text>
<text x="458" y="498.0" font-size="11.5" fill="#222" text-anchor="start">racha ao secar.</text><text x="458" y="512.95" font-size="11.5" fill="#222" text-anchor="start">Misture areia e palha</text><text x="458" y="527.9" font-size="11.5" fill="#222" text-anchor="start">(serve p/ pau-a-pique).</text>
</svg>
