<text x="311.0" y="185.5" font-size="10.5" fill="#b3001b" text-anchor="start">(por dentro)</text>
<text x="36" y="268.0" font-size="11.5" fill="#222" text-anchor="start">tábuas de 2,5 cm; alças nas pontas.</text><text x="36" y="282.95" font-size="11.5" fill="#222" text-anchor="start">Tijolo pronto: ~30 × 15 × 10 cm, ~8 kg.</text>
<line x1="372.0" y1="50.0" x2="372.0" y2="300.0" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
<text x="386" y="62" font-size="14" fill="#222" font-weight="bold" text-anchor="start">2. Moldar</text>
<circle cx="396.0" cy="86.0" r="11" fill="#3f6d9e" stroke="#1e1e1e" stroke-width="1.5"/><text x="396" y="90.5" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="414" y="90.0" font-size="11.5" fill="#222" text-anchor="start">Terreiro plano, varrido e</text><text x="414" y="104.95" font-size="11.5" fill="#222" text-anchor="start">polvilhado com areia.</text>
<circle cx="396.0" cy="130.0" r="11" fill="#3f6d9e" stroke="#1e1e1e" stroke-width="1.5"/><text x="396" y="134.5" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="414" y="134.0" font-size="11.5" fill="#222" text-anchor="start">Molhe a forma e passe areia</text><text x="414" y="148.95" font-size="11.5" fill="#222" text-anchor="start">por dentro (solta fácil).</text>
<circle cx="396.0" cy="174.0" r="11" fill="#3f6d9e" stroke="#1e1e1e" stroke-width="1.5"/><text x="396" y="178.5" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="414" y="178.0" font-size="11.5" fill="#222" text-anchor="start">Jogue bolas de barro COM FORÇA</text><text x="414" y="192.95" font-size="11.5" fill="#222" text-anchor="start">para encher bem os cantos.</text>
<circle cx="396.0" cy="218.0" r="11" fill="#3f6d9e" stroke="#1e1e1e" stroke-width="1.5"/><text x="396" y="222.5" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
<text x="414" y="222.0" font-size="11.5" fill="#222" text-anchor="start">Rase com a mão molhada ou</text><text x="414" y="236.95" font-size="11.5" fill="#222" text-anchor="start">uma régua; tire o excesso.</text>
<circle cx="396.0" cy="262.0" r="11" fill="#3f6d9e" stroke="#1e1e1e" stroke-width="1.5"/><text x="396" y="266.5" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">5</text>
<text x="414" y="266.0" font-size="11.5" fill="#222" text-anchor="start">Levante a forma reto para cima.</text><text x="414" y="280.95" font-size="11.5" fill="#222" text-anchor="start">Lave e repita ao lado.</text>
