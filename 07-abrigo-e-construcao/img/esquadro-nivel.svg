<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 466" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="466" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Esquadro 3-4-5 e nível de mangueira</text>
<text x="170" y="62" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">Esquadro 3-4-5 (vista de cima)</text>
<line x1="70.0" y1="330.0" x2="355.2" y2="330.0" stroke="#444" stroke-width="2" stroke-linecap="round"/>
<line x1="70.0" y1="330.0" x2="70.0" y2="106.8" stroke="#444" stroke-width="2" stroke-linecap="round"/>
<line x1="70.0" y1="144.0" x2="318.0" y2="330.0" stroke="#d62828" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/>
<rect x="70.0" y="312.0" width="18.0" height="18.0" rx="0" fill="none" stroke="#1f6b2e" stroke-width="2"/>
<circle cx="70.0" cy="330.0" r="6" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="1.5"/>
<circle cx="318.0" cy="330.0" r="6" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="1.5"/>
<circle cx="70.0" cy="144.0" r="6" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="194.0" y="352" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">4 m</text>
<text x="60" y="242.0" font-size="14" fill="#222" font-weight="bold" text-anchor="end">3 m</text>
<text x="208.0" y="229.0" font-size="15" fill="#d62828" font-weight="bold" text-anchor="start">5 m</text>
<text x="92" y="306" font-size="12" fill="#1f6b2e" font-weight="bold" text-anchor="start">90°</text>
<text x="20" y="372.0" font-size="11.5" fill="#222" text-anchor="start">Estaque o canto. Meça 3 m numa linha e 4 m na</text><text x="20" y="386.95" font-size="11.5" fill="#222" text-anchor="start">outra. A distância entre as duas marcas tem que</text><text x="20" y="401.9" font-size="11.5" fill="#222" text-anchor="start">dar EXATAMENTE 5 m. Deu mais? Feche o ângulo.</text><text x="20" y="416.85" font-size="11.5" fill="#222" text-anchor="start">Deu menos? Abra. Mesma regra: 60-80-100 cm,</text><text x="20" y="431.8" font-size="11.5" fill="#222" text-anchor="start">1,5-2-2,5 m ou 6-8-10 m (maior = mais preciso).</text>
<text x="20" y="448" font-size="11.5" fill="#1f6b2e" font-weight="bold" text-anchor="start">Retângulo certo: as 2 diagonais dão iguais.</text>
<line x1="340.0" y1="50.0" x2="340.0" y2="456.0" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
<text x="508" y="62" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">Nível de mangueira</text>
<rect x="346.0" y="330.0" width="334.0" height="20.0" rx="0" fill="#e8d3b0" stroke="none" stroke-width="0"/>
<line x1="346.0" y1="330.0" x2="680.0" y2="330.0" stroke="#6b4f2a" stroke-width="2.5" stroke-linecap="round"/>
<rect x="366.0" y="90.0" width="22.0" height="240.0" rx="0" fill="#d9cbb0" stroke="#1e1e1e" stroke-width="2"/>
<text x="377" y="84" font-size="10.5" fill="#444" text-anchor="middle">parede</text>
<rect x="624.0" y="120.0" width="14.0" height="210.0" rx="0" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="2"/>
<text x="631" y="114" font-size="10.5" fill="#444" text-anchor="middle">estaca</text>
<path d="M398 128 L398 316 Q398 326 410 326 L604 326 Q614 326 614 316 L614 140" fill="none" stroke="#7a8a96" stroke-width="13" stroke-linecap="round"/>
<path d="M398 128 L398 316 Q398 326 410 326 L604 326 Q614 326 614 316 L614 140" fill="none" stroke="#eef6fb" stroke-width="8" stroke-linecap="round"/>
<path d="M398 170 L398 316 Q398 326 410 326 L604 326 Q614 326 614 316 L614 170" fill="none" stroke="#4a90d9" stroke-width="7"/>
<line x1="388.0" y1="170.0" x2="640.0" y2="170.0" stroke="#d62828" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 5"/>
<line x1="364.0" y1="170.0" x2="392.0" y2="170.0" stroke="#1e1e1e" stroke-width="3" stroke-linecap="round"/>
<line x1="620.0" y1="170.0" x2="642.0" y2="170.0" stroke="#1e1e1e" stroke-width="3" stroke-linecap="round"/>
<text x="406" y="148.0" font-size="11" fill="#222" font-weight="bold" text-anchor="start">1. marca de referência</text>
<line x1="404.0" y1="152.0" x2="384.0" y2="166.0" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
<text x="504" y="104.0" font-size="11" fill="#222" font-weight="bold" text-anchor="start">3. marque onde</text><text x="504" y="118.3" font-size="11" fill="#222" font-weight="bold" text-anchor="start">a água parou</text>
<line x1="560.0" y1="112.0" x2="610.0" y2="160.0" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
<text x="506" y="190" font-size="12" fill="#d62828" font-weight="bold" text-anchor="middle">mesmo nível</text>
<text x="412" y="236.0" font-size="10.5" fill="#444" text-anchor="start">2. suba ou desça a ponta da</text><text x="412" y="249.65" font-size="10.5" fill="#444" text-anchor="start">estaca até a água ficar na</text><text x="412" y="263.3" font-size="10.5" fill="#444" text-anchor="start">marca da parede</text>
<text x="354" y="368.0" font-size="11" fill="#222" text-anchor="start">• Mangueira transparente de 5/16" ou 3/8",</text><text x="354" y="382.3" font-size="11" fill="#222" text-anchor="start">  cheia de água SEM bolhas (dê batidinhas).</text><text x="354" y="396.6" font-size="11" fill="#222" text-anchor="start">• Pontas abertas na hora de ler; espere a água</text><text x="354" y="410.9" font-size="11" fill="#222" text-anchor="start">  parar de mexer. Erro: ~1 mm.</text><text x="354" y="425.2" font-size="11" fill="#222" text-anchor="start">• Água com corante ou café enxerga melhor.</text>
</svg>
