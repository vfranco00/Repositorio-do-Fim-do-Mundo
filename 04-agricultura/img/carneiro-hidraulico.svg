<text x="34" y="423.0" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Água que chega lá em cima ≈ água que entra × H ÷ h × 0,6</text><text x="34" y="438.5" font-size="12.5" fill="#222" text-anchor="start">Ex.: entram 20 L/min, H = 2 m, h = 16 m → 20 × 2 ÷ 16 × 0,6 = 1,5 L/min ≈ 2.100 L por dia.</text><text x="34" y="454.0" font-size="12.5" fill="#222" text-anchor="start">Funciona dia e noite, sem luz nem combustível. (Desenho fora de escala.)</text>
