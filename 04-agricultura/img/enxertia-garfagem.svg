<text x="28" y="595.0" font-size="12.5" fill="#222" text-anchor="start">Pegou: as gemas incham e brotam em 15–40 dias. Tire o saquinho aos poucos (abra, depois tire).</text><text x="28" y="610.5" font-size="12.5" fill="#222" text-anchor="start">Não pegou: garfo seco e escuro em 30 dias. Corte a fita 60–90 dias depois, antes que estrangule.</text><text x="28" y="626.0" font-size="12.5" fill="#222" text-anchor="start">Canivete limpo e afiado; cada corte de um golpe só; não toque nos cortes; faça na sombra.</text><text x="28" y="641.5" font-size="12.5" fill="#222" text-anchor="start">Cavalo e garfo da mesma espécie (ou parentes), com a grossura de um lápis a um dedo.</text>
