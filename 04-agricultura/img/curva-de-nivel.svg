<text x="332" y="197.0" font-size="15" fill="#b3001b" font-weight="bold" text-anchor="start">h</text>
<text x="440" y="92" font-size="12" fill="#222" text-anchor="start">Apoie o pé de CIMA no chão.</text><text x="440" y="107" font-size="12" fill="#222" text-anchor="start">Levante o pé de BAIXO até o</text><text x="440" y="122" font-size="12" fill="#222" text-anchor="start">fio ficar na marca do nível.</text><text x="440" y="137" font-size="12" fill="#222" text-anchor="start">Meça a altura h (em cm).</text>
<rect x="440" y="160" width="225" height="62" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="452" y="182.0" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Declividade (%) = h ÷ 2</text><text x="452" y="197.5" font-size="12.5" fill="#222" text-anchor="start">Ex.: h = 20 cm → 10 %</text><text x="452" y="213.0" font-size="12.5" fill="#222" text-anchor="start">(vale para A de 2 m)</text>
<line x1="20" y1="266" x2="660" y2="266" stroke="#bbb" stroke-width="1"/>
