<polygon points="560,318 552,334 568,334" fill="#555"/>
<text x="572" y="340" font-size="12" fill="#333" font-weight="bold" text-anchor="start">morro</text><text x="572" y="355" font-size="12" fill="#333" text-anchor="start">acima</text>
<text x="572" y="480" font-size="12" fill="#333" font-weight="bold" text-anchor="start">morro</text><text x="572" y="495" font-size="12" fill="#333" text-anchor="start">abaixo</text>
<text x="572" y="396" font-size="12" fill="#2b8a3e" font-weight="bold" text-anchor="start">linha</text><text x="572" y="411" font-size="12" fill="#2b8a3e" text-anchor="start">verde =</text><text x="572" y="426" font-size="12" fill="#2b8a3e" text-anchor="start">curva de</text><text x="572" y="441" font-size="12" fill="#2b8a3e" text-anchor="start">nível</text>
<text x="20" y="552.0" font-size="12.5" fill="#222" text-anchor="start">Crave a estaca 1. Ponha um pé do A nela e gire o outro pé, para cima ou para baixo do morro,</text><text x="20" y="567.5" font-size="12.5" fill="#222" text-anchor="start">até o fio parar na marca do meio: crave a estaca 2. Leve o A para a frente e repita. Depois</text><text x="20" y="583.0" font-size="12.5" fill="#222" text-anchor="start">acerte estacas fora da linha para a curva ficar suave. Plante e faça valas seguindo a linha.</text>
