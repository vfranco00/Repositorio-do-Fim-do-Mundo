<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Curva de nível com o nível “A”</text>
<text x="20" y="62" font-size="14" fill="#222" font-weight="bold" text-anchor="start">1. Medir a declividade do terreno (vista de lado)</text>
