<path d="M196 420 Q 210 380 192 340 Q 176 300 196 260" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
<circle cx="206" cy="320" r="6" fill="#ffd54f" stroke="#1e1e1e" stroke-width="1"/>
<ellipse cx="430" cy="442" rx="20" ry="6" fill="#d7b98e" stroke="#1e1e1e" stroke-width="1.2" transform="rotate(25 430 442)"/>
<ellipse cx="458" cy="442" rx="20" ry="6" fill="#d7b98e" stroke="#1e1e1e" stroke-width="1.2" transform="rotate(25 458 442)"/>
<line x1="130" y1="120" x2="526" y2="100" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<text x="532" y="104" font-size="11.5" fill="#2f7d32" font-weight="bold" text-anchor="start">EMERGENTE (20 m +)</text>
<text x="532" y="118.0" font-size="10.5" fill="#333" text-anchor="start">castanha, jatobá, ipê,</text><text x="532" y="131.5" font-size="10.5" fill="#333" text-anchor="start">cajá, eucalipto, cedro</text>
<line x1="245" y1="215" x2="526" y2="200" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<text x="532" y="204" font-size="11.5" fill="#43a047" font-weight="bold" text-anchor="start">ALTO (10–20 m)</text>
<text x="532" y="218.0" font-size="10.5" fill="#333" text-anchor="start">manga, jaca, abacate,</text><text x="532" y="231.5" font-size="10.5" fill="#333" text-anchor="start">ingá, pequi</text>
<line x1="325" y1="300" x2="526" y2="272" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<text x="532" y="276" font-size="11.5" fill="#5a9a3a" font-weight="bold" text-anchor="start">MÉDIO (3–10 m)</text>
<text x="532" y="290.0" font-size="10.5" fill="#333" text-anchor="start">citros, goiaba, banana,</text><text x="532" y="303.5" font-size="10.5" fill="#333" text-anchor="start">mamão, café, cacau</text>
<line x1="466" y1="350" x2="526" y2="340" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<text x="532" y="344" font-size="11.5" fill="#558b2f" font-weight="bold" text-anchor="start">BAIXO (até 3 m)</text>
<text x="532" y="358.0" font-size="10.5" fill="#333" text-anchor="start">mandioca, abacaxi,</text><text x="532" y="371.5" font-size="10.5" fill="#333" text-anchor="start">guandu, milho</text>
<line x1="404" y1="410" x2="526" y2="394" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<text x="532" y="398" font-size="11.5" fill="#b05a00" font-weight="bold" text-anchor="start">RASTEIRO</text>
<text x="532" y="412.0" font-size="10.5" fill="#333" text-anchor="start">abóbora, batata-doce</text>
<text x="20" y="444.0" font-size="11.5" fill="#5a4630" font-weight="bold" text-anchor="start">raízes: mandioca, batata-doce, inhame, cará</text><text x="20" y="458.5" font-size="11.5" fill="#5a4630" text-anchor="start">trepadeiras: maracujá, chuchu, cará, feijão</text>
<text x="150" y="76" font-size="12" fill="#1e5e2a" font-weight="bold" text-anchor="start">Cada andar aproveita uma faixa de luz: as plantas</text><text x="150" y="91" font-size="12" fill="#1e5e2a" text-anchor="start">de cima pegam sol pleno, as de baixo aguentam meia-sombra.</text>
<rect x="20" y="486" width="640" height="70" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="34" y="507.0" font-size="12.5" fill="#222" text-anchor="start">Plante tudo junto e bem denso. Colhe primeiro o rápido (milho, feijão, abóbora: meses);</text><text x="34" y="522.5" font-size="12.5" fill="#222" text-anchor="start">depois mandioca, banana, mamão (1–2 anos); frutíferas (3–8 anos); madeira (15 anos ou +).</text><text x="34" y="538.0" font-size="12.5" fill="#222" text-anchor="start">Pode as árvores de serviço várias vezes por ano: a rama vira adubo no chão e abre luz.</text>
</svg>
