<text x="392" y="442" font-size="12" fill="#222" font-weight="bold" text-anchor="start">3 partes de MARROM (carbono)</text><text x="392" y="457" font-size="12" fill="#222" text-anchor="start">para 1 parte de VERDE (nitrogênio)</text><text x="392" y="472" font-size="12" fill="#222" text-anchor="start">— mais ou menos 30 de C para 1 de N</text>
<text x="20" y="516" font-size="13" fill="#222" font-weight="bold" text-anchor="start">Teste da esponja: aperte um punhado com força</text>
