<text x="340" y="600" font-size="12.5" fill="#2b8a3e" font-weight="bold" text-anchor="middle">CERTO: 1 ou 2 gotas</text>
<text x="340" y="616" font-size="12" fill="#333" text-anchor="middle">(como esponja torcida)</text>
<ellipse cx="570" cy="548" rx="26" ry="18" fill="#5a4630" stroke="#1e1e1e" stroke-width="2"/><path d="M542 570 q -5 9 0 13 q 5 -4 0 -13 Z" fill="#4a90d9" stroke="#2a5d93" stroke-width="1"/><path d="M556 570 q -5 9 0 13 q 5 -4 0 -13 Z" fill="#4a90d9" stroke="#2a5d93" stroke-width="1"/><path d="M570 570 q -5 9 0 13 q 5 -4 0 -13 Z" fill="#4a90d9" stroke="#2a5d93" stroke-width="1"/><path d="M584 570 q -5 9 0 13 q 5 -4 0 -13 Z" fill="#4a90d9" stroke="#2a5d93" stroke-width="1"/><path d="M598 570 q -5 9 0 13 q 5 -4 0 -13 Z" fill="#4a90d9" stroke="#2a5d93" stroke-width="1"/>
<text x="570" y="600" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="middle">ENCHARCADO: escorre</text>
<text x="570" y="616" font-size="12" fill="#333" text-anchor="middle">→ junte marrom e revire</text>
<rect x="20" y="630" width="640" height="54" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="34" y="651.0" font-size="12.5" fill="#222" text-anchor="start">Revire (bordas para o meio) aos 7–15 dias e depois a cada 15 dias. Pronto em 2–4 meses:</text><text x="34" y="666.5" font-size="12.5" fill="#222" text-anchor="start">escuro, esfarelando, cheiro de terra de mata, frio no meio. Sem revirar: 4–6 meses.</text>
