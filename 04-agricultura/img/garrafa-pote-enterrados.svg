<text x="34" y="422.0" font-size="12.5" fill="#222" text-anchor="start">Os dois molham a raiz, não a superfície: quase nada evapora e não molha a folha (menos doença).</text><text x="34" y="437.5" font-size="12.5" fill="#222" text-anchor="start">Sempre tampados: água parada aberta vira criadouro do mosquito da dengue.</text>
