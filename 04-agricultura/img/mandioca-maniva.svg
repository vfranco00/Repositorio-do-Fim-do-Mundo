<text x="116" y="80" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="middle">base: NÃO</text>
<text x="335" y="80" font-size="13" fill="#2b8a3e" font-weight="bold" text-anchor="middle">TERÇO MÉDIO: SIM</text>
<text x="540" y="80" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="middle">ponta: NÃO</text>
<text x="335" y="156" font-size="12" fill="#333" text-anchor="middle">A base (grossa e lenhosa) e a ponta (verde e fina) brotam mal, secam ou apodrecem.</text>
<text x="335" y="172" font-size="12" fill="#333" text-anchor="middle">Use rama de 2 a 3 cm de grossura, com miolo branco (medula) de no máximo metade dela.</text>
