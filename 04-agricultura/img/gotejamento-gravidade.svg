<text x="34" y="425.0" font-size="12.5" fill="#222" text-anchor="start">Cada linha: até 15–20 m, sem subida. Quanto mais alto o tambor, mais forte e igual a vazão.</text><text x="34" y="440.5" font-size="12.5" fill="#222" text-anchor="start">Quanto gastar: horta no calor ≈ 4–6 L por m² por dia. Um tambor de 200 L rega ~40 m²/dia.</text><text x="34" y="456.0" font-size="12.5" fill="#222" text-anchor="start">Meça: ponha um copo sob 3 furos (começo, meio, fim) por 10 minutos e compare.</text>
