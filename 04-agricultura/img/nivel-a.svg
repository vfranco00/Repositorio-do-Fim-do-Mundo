<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 462" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="462" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Nível “A” (pé-de-galinha)</text>
<text x="20" y="62" font-size="15" fill="#222" font-weight="bold" text-anchor="start">Como fazer</text>
<line x1="20" y1="400" x2="322" y2="400" stroke="#6b4f2a" stroke-width="3"/>
<g transform="rotate(0 110 400)"><line x1="110" y1="400" x2="218.0" y2="160.2" stroke="#8b5a2b" stroke-width="9" stroke-linecap="round"/><line x1="310" y1="400" x2="202.0" y2="160.2" stroke="#8b5a2b" stroke-width="9" stroke-linecap="round"/><line x1="154.0" y1="289.0" x2="266.0" y2="289.0" stroke="#a0703a" stroke-width="8" stroke-linecap="round"/><line x1="210.0" y1="281.0" x2="210.0" y2="297.0" stroke="#d62828" stroke-width="3.5"/></g><line x1="210.0" y1="178.0" x2="210.0" y2="355.6" stroke="#333" stroke-width="1.3"/><circle cx="210.0" cy="359.6" r="8" fill="#777" stroke="#1e1e1e" stroke-width="1.5"/>
<line x1="110" y1="424" x2="310" y2="424" stroke="#333" stroke-width="1.5"/><line x1="110" y1="418" x2="110" y2="430" stroke="#333" stroke-width="1.5"/><line x1="310" y1="418" x2="310" y2="430" stroke="#333" stroke-width="1.5"/><text x="210.0" y="440" font-size="12" fill="#333" font-weight="bold" text-anchor="middle">2 m entre os pés</text>
<text x="20" y="120.0" font-size="11.5" fill="#333" font-weight="bold" text-anchor="start">amarre ou pregue</text><text x="20" y="134.5" font-size="11.5" fill="#333" text-anchor="start">bem firme no topo</text>
<line x1="120" y1="130" x2="204" y2="172" stroke="#555" stroke-width="1.2"/><circle cx="204" cy="172" r="2.5" fill="#555"/>
<text x="20" y="196.0" font-size="11.5" fill="#333" font-weight="bold" text-anchor="start">pernas de</text><text x="20" y="210.5" font-size="11.5" fill="#333" text-anchor="start">2 a 2,2 m (ripa,</text><text x="20" y="225.0" font-size="11.5" fill="#333" text-anchor="start">bambu, caibro)</text>
<line x1="112" y1="214" x2="192" y2="248" stroke="#555" stroke-width="1.2"/><circle cx="192" cy="248" r="2.5" fill="#555"/>
<text x="20" y="262.0" font-size="11.5" fill="#333" font-weight="bold" text-anchor="start">fio de prumo:</text><text x="20" y="276.5" font-size="11.5" fill="#333" text-anchor="start">barbante + pedra</text>
<line x1="124" y1="266" x2="209" y2="270" stroke="#555" stroke-width="1.2"/><circle cx="209" cy="270" r="2.5" fill="#555"/>
<text x="20" y="316.0" font-size="11.5" fill="#333" font-weight="bold" text-anchor="start">travessa a</text><text x="20" y="330.5" font-size="11.5" fill="#333" text-anchor="start">meia altura</text>
<line x1="96" y1="312" x2="166" y2="290" stroke="#555" stroke-width="1.2"/><circle cx="166" cy="290" r="2.5" fill="#555"/>
<text x="222" y="330.0" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">marca</text><text x="222" y="344.5" font-size="11.5" fill="#b3001b" text-anchor="start">do nível</text>
<line x1="232" y1="318" x2="212" y2="296" stroke="#b3001b" stroke-width="1.2"/><circle cx="212" cy="296" r="2.5" fill="#b3001b"/>
<line x1="334" y1="56" x2="334" y2="450" stroke="#bbb" stroke-width="1"/>
<text x="346" y="62" font-size="15" fill="#222" font-weight="bold" text-anchor="start">Como achar a marca do nível</text>
<circle cx="352" cy="82" r="11" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="352" y="86.5" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<line x1="360" y1="148.1" x2="478.8" y2="166.9" stroke="#6b4f2a" stroke-width="2"/><rect x="369" y="148" width="6" height="10" fill="#555"/><rect x="463.8" y="163.0" width="6" height="10" fill="#555"/>
<g transform="rotate(9 372 150)"><line x1="372" y1="150" x2="423.8" y2="67.9" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/><line x1="468" y1="150" x2="416.2" y2="67.9" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/><line x1="390.0" y1="112.0" x2="450.0" y2="112.0" stroke="#a0703a" stroke-width="4" stroke-linecap="round"/></g><line x1="431.3" y1="82.4" x2="431.3" y2="143.2" stroke="#333" stroke-width="1.3"/><circle cx="431.3" cy="147.2" r="4" fill="#777" stroke="#1e1e1e" stroke-width="1.5"/>
<g transform="rotate(9 372 150)"><line x1="372" y1="150" x2="423.8" y2="67.9" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/><line x1="468" y1="150" x2="416.2" y2="67.9" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/><line x1="390.0" y1="112.0" x2="450.0" y2="112.0" stroke="#a0703a" stroke-width="4" stroke-linecap="round"/><line x1="426.0227269040489" y1="104.0" x2="426.0227269040489" y2="120.0" stroke="#ef8a2b" stroke-width="3.5"/></g><line x1="431.3" y1="82.4" x2="431.3" y2="143.2" stroke="#333" stroke-width="1.3"/><circle cx="431.3" cy="147.2" r="4" fill="#777" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="380" y="140" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle">E</text>
<text x="462" y="148" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle">D</text>
<text x="486" y="92" font-size="12" fill="#222" text-anchor="start">Ponha o A no chão e</text><text x="486" y="107" font-size="12" fill="#222" text-anchor="start">crave uma estaca em</text><text x="486" y="122" font-size="12" fill="#222" text-anchor="start">cada pé. Risque na</text><text x="486" y="137" font-size="12" fill="#222" text-anchor="start">travessa onde o fio</text><text x="486" y="152" font-size="12" fill="#222" text-anchor="start">passa: marca 1.</text>
<circle cx="352" cy="202" r="11" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="352" y="206.5" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<line x1="360" y1="268.1" x2="478.8" y2="286.9" stroke="#6b4f2a" stroke-width="2"/><rect x="369" y="268" width="6" height="10" fill="#555"/><rect x="463.8" y="283.0" width="6" height="10" fill="#555"/>
<g transform="rotate(9 372 270)"><line x1="372" y1="270" x2="423.8" y2="187.9" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/><line x1="468" y1="270" x2="416.2" y2="187.9" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/><line x1="390.0" y1="232.0" x2="450.0" y2="232.0" stroke="#a0703a" stroke-width="4" stroke-linecap="round"/><line x1="413.9772730959511" y1="224.0" x2="413.9772730959511" y2="240.0" stroke="#ef8a2b" stroke-width="3.5"/><line x1="426.0227269040489" y1="224.0" x2="426.0227269040489" y2="240.0" stroke="#7048e8" stroke-width="3.5"/></g><line x1="431.3" y1="202.4" x2="431.3" y2="263.2" stroke="#333" stroke-width="1.3"/><circle cx="431.3" cy="267.2" r="4" fill="#777" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="380" y="260" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle">D</text>
<text x="462" y="268" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle">E</text>
<text x="486" y="212" font-size="12" fill="#222" text-anchor="start">VIRE o A: o pé E vai</text><text x="486" y="227" font-size="12" fill="#222" text-anchor="start">para a estaca do D e</text><text x="486" y="242" font-size="12" fill="#222" text-anchor="start">vice-versa. O fio cai</text><text x="486" y="257" font-size="12" fill="#222" text-anchor="start">em outro ponto da</text><text x="486" y="272" font-size="12" fill="#222" text-anchor="start">travessa: marca 2.</text>
<circle cx="352" cy="318" r="11" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="352" y="322.5" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<rect x="372" y="334" width="200" height="20" rx="4" fill="#a0703a" stroke="#1e1e1e" stroke-width="1.5"/>
<line x1="430" y1="328" x2="430" y2="360" stroke="#ef8a2b" stroke-width="3"/>
<line x1="514" y1="328" x2="514" y2="360" stroke="#7048e8" stroke-width="3"/>
<line x1="472" y1="322" x2="472" y2="366" stroke="#d62828" stroke-width="4"/>
<text x="430" y="378" font-size="12" fill="#ef8a2b" font-weight="bold" text-anchor="middle">1</text>
<text x="514" y="378" font-size="12" fill="#7048e8" font-weight="bold" text-anchor="middle">2</text>
<text x="472" y="394" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="middle">NÍVEL (meio)</text>
<text x="584" y="336" font-size="12" fill="#222" text-anchor="start">Marque o</text><text x="584" y="351" font-size="12" fill="#222" text-anchor="start">MEIO entre</text><text x="584" y="366" font-size="12" fill="#222" text-anchor="start">1 e 2.</text><text x="584" y="381" font-size="12" fill="#222" text-anchor="start">Pinte bem.</text>
<rect x="346" y="404" width="320" height="46" rx="8" fill="#eaf6ec" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="358" y="423" font-size="12" fill="#1e5e2a" font-weight="bold" text-anchor="start">Fio na marca do meio = os dois pés</text><text x="358" y="438" font-size="12" fill="#1e5e2a" text-anchor="start">estão na mesma altura (em nível).</text>
</svg>
