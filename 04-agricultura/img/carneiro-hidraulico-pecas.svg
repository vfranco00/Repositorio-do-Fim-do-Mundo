<rect x="380" y="220" width="40" height="30" rx="4" fill="#7fb36a" stroke="#1e1e1e" stroke-width="2"/>
<line x1="400" y1="280" x2="400.0" y2="230.0" stroke="#1c64b8" stroke-width="3"/><polygon points="400,224 405.2,234.8 394.8,234.8" fill="#1c64b8"/>
<rect x="366" y="62" width="68" height="150" rx="10" fill="#fff" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="368" y="150" width="64" height="60" fill="#cfe6fb"/>
<line x1="368" y1="150" x2="432" y2="150" stroke="#4a90d9" stroke-width="2"/>
<text x="400" y="102" font-size="16" fill="#555" font-weight="bold" text-anchor="middle">AR</text>
<text x="400" y="118" font-size="11" fill="#555" text-anchor="middle">(mola)</text>
<text x="400" y="188" font-size="12" fill="#1e4e86" font-weight="bold" text-anchor="middle">água</text>
<rect x="434" y="188.0" width="166" height="16" fill="#3a3a3a" stroke="#1e1e1e" stroke-width="2"/>
<rect x="520" y="182" width="22" height="28" rx="3" fill="#c08a2a" stroke="#1e1e1e" stroke-width="2"/>
<line x1="560" y1="196" x2="644.0" y2="196.0" stroke="#1c64b8" stroke-width="3"/><polygon points="650,196 639.2,201.2 639.2,190.8" fill="#1c64b8"/>
<text x="560" y="166.0" font-size="11.5" fill="#1e4e86" font-weight="bold" text-anchor="start">para a caixa</text><text x="560" y="180.5" font-size="11.5" fill="#1e4e86" text-anchor="start">lá em cima</text>
<rect x="420" y="285" width="10" height="30" fill="#bbb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="170" y="316" width="270" height="18" fill="#b5b5b5" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="305" y="352" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">base firme (concreto ou estacas): ele vibra</text>
<circle cx="165" cy="240" r="11" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="165" y="244.5" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<circle cx="250" cy="214" r="11" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="250" y="218.5" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<circle cx="440" cy="236" r="11" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="440" y="240.5" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<circle cx="350" cy="82" r="11" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="350" y="86.5" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
<circle cx="531" cy="168" r="11" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="531" y="172.5" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text>
<circle cx="30" cy="382" r="11" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="30" y="386.5" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="48" y="386" font-size="12.5" fill="#222" text-anchor="start">Registro: abre e fecha a entrada de água.</text>
<circle cx="30" cy="406" r="11" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="30" y="410.5" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="48" y="410" font-size="12.5" fill="#222" text-anchor="start">Válvula de impulso (de escape): fica ABERTA parada; a água rápida a FECHA.</text>
<circle cx="30" cy="430" r="11" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="30" y="434.5" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="48" y="434" font-size="12.5" fill="#222" text-anchor="start">Válvula de retenção: deixa a água subir para a câmara e não deixa voltar.</text>
<circle cx="30" cy="454" r="11" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="30" y="458.5" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
<text x="48" y="458" font-size="12.5" fill="#222" text-anchor="start">Câmara de ar: tubo largo (75–100 mm), 60–100 cm, tampado em cima.</text>
<circle cx="30" cy="478" r="11" fill="#ef8a2b" stroke="#1e1e1e" stroke-width="1.5"/><text x="30" y="482.5" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text>
<text x="48" y="482" font-size="12.5" fill="#222" text-anchor="start">Saída para o tubo de recalque, com registro.</text>
<rect x="20" y="506" width="640" height="112" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="34" y="528" font-size="13" fill="#1e4e86" font-weight="bold" text-anchor="start">Como funciona (repete 40 a 80 vezes por minuto):</text>
<text x="34" y="548.0" font-size="12.5" fill="#222" text-anchor="start">a) A água desce pelo tubo e sai pela válvula de impulso (2), ganhando velocidade.</text><text x="34" y="563.5" font-size="12.5" fill="#222" text-anchor="start">b) A água rápida fecha a válvula de uma vez (“tac”): a pancada (golpe de aríete) sobe a pressão.</text><text x="34" y="579.0" font-size="12.5" fill="#222" text-anchor="start">c) A pressão abre a retenção (3) e empurra um pouco de água para a câmara (4); o ar</text><text x="34" y="594.5" font-size="12.5" fill="#222" text-anchor="start">    comprimido empurra essa água morro acima, sem parar. A válvula (2) reabre e tudo recomeça.</text>
</svg>
