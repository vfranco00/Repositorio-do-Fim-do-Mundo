<path d="M290 198 q 14 -18 30.800000000000004 -34" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
<text x="290" y="150" font-size="11.5" fill="#1e4e86" font-weight="bold" text-anchor="middle">a água sai aqui</text>
