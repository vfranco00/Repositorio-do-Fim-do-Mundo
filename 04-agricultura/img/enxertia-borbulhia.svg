<rect x="458" y="302" width="208" height="240" rx="8" fill="#eaf6ec" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="470" y="324" font-size="12" fill="#1e5e2a" text-anchor="start">Quando: com a planta</text><text x="470" y="339" font-size="12" fill="#1e5e2a" text-anchor="start">crescendo e a casca</text><text x="470" y="354" font-size="12" fill="#1e5e2a" text-anchor="start">soltando fácil (teste</text><text x="470" y="369" font-size="12" fill="#1e5e2a" text-anchor="start">com a ponta do canivete).</text><text x="470" y="384" font-size="12" fill="#1e5e2a" text-anchor="start"></text><text x="470" y="399" font-size="12" fill="#1e5e2a" text-anchor="start">Em lugar de muita chuva,</text><text x="470" y="414" font-size="12" fill="#1e5e2a" text-anchor="start">faça o T de cabeça para</text><text x="470" y="429" font-size="12" fill="#1e5e2a" text-anchor="start">baixo (⊥): a água não</text><text x="470" y="444" font-size="12" fill="#1e5e2a" text-anchor="start">entra no corte.</text><text x="470" y="459" font-size="12" fill="#1e5e2a" text-anchor="start"></text><text x="470" y="474" font-size="12" fill="#1e5e2a" text-anchor="start">Usada em citros, pêssego,</text><text x="470" y="489" font-size="12" fill="#1e5e2a" text-anchor="start">abacate, rosa, seringueira.</text>
