<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 468" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="468" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Fossa seca ventilada (latrina sem cheiro e sem moscas)</text>
<rect x="0" y="250" width="680" height="218" fill="#e8d3b0"/>
<line x1="0" y1="250" x2="680" y2="250" stroke="#6b4f2a" stroke-width="3"/>
<rect x="150" y="262" width="200" height="160" fill="#8a7458" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="152" y="380" width="196" height="40" fill="#5a4630"/>
<rect x="140" y="252" width="220" height="12" fill="#9a9a9a" stroke="#1e1e1e" stroke-width="2"/>
<rect x="140" y="110" width="220" height="142" fill="#d9cbb0" stroke="#1e1e1e" stroke-width="2.5"/>
<polygon points="128,112 250,80 372,112" fill="#a0522d" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="160" y="150" width="54" height="100" fill="#4b3a2a" stroke="#1e1e1e" stroke-width="2"/>
<text x="187" y="204" font-size="11" fill="#fff" text-anchor="middle">porta</text>
<rect x="250" y="226" width="60" height="26" rx="6" fill="#bfbfbf" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="280" cy="252" rx="18" ry="4" fill="#1e1e1e"/>
<text x="272" y="220" font-size="11" fill="#222" text-anchor="middle">assento</text>
<rect x="318" y="66" width="20" height="196" fill="#1e1e1e"/>
<rect x="314" y="56" width="28" height="14" fill="#c0c0c0" stroke="#1e1e1e" stroke-width="1.5"/>
<line x1="328" y1="236" x2="328.0" y2="212.0" stroke="#f08c00" stroke-width="3"/><polygon points="328,206 333.2,216.8 322.8,216.8" fill="#f08c00"/>
<line x1="328" y1="186" x2="328.0" y2="162.0" stroke="#f08c00" stroke-width="3"/><polygon points="328,156 333.2,166.8 322.8,166.8" fill="#f08c00"/>
<line x1="328" y1="136" x2="328.0" y2="112.0" stroke="#f08c00" stroke-width="3"/><polygon points="328,106 333.2,116.8 322.8,116.8" fill="#f08c00"/>
<line x1="328" y1="106" x2="328.0" y2="82.0" stroke="#f08c00" stroke-width="3"/><polygon points="328,76 333.2,86.8 322.8,86.8" fill="#f08c00"/>
<line x1="240" y1="300" x2="314.4" y2="272.1" stroke="#f08c00" stroke-width="3"/><polygon points="320,270 311.7,278.7 308.0,268.9" fill="#f08c00"/>
<text x="352" y="66" font-size="12" fill="#222" font-weight="bold" text-anchor="start">tela contra moscas</text>
<text x="352" y="82" font-size="11.5" fill="#222" text-anchor="start">(as moscas vão para a luz</text>
<text x="352" y="96" font-size="11.5" fill="#222" text-anchor="start">no topo e ficam presas)</text>
<text x="352" y="136" font-size="12" fill="#222" font-weight="bold" text-anchor="start">tubo PRETO, do lado do sol,</text>
<text x="352" y="152" font-size="11.5" fill="#222" text-anchor="start">50 cm acima do telhado:</text>
<text x="352" y="166" font-size="11.5" fill="#222" text-anchor="start">esquenta e puxa o cheiro</text>
<text x="352" y="180" font-size="11.5" fill="#222" text-anchor="start">para cima</text>
<text x="380" y="300" font-size="12" fill="#222" font-weight="bold" text-anchor="start">buraco: 2–3 m de fundo,</text>
<text x="380" y="316" font-size="11.5" fill="#222" text-anchor="start">~1 m de largura</text>
<text x="380" y="340" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">fundo pelo menos 2 m acima</text>
<text x="380" y="356" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">do lençol de água</text>
<text x="380" y="380" font-size="11.5" fill="#222" text-anchor="start">cheio até 50 cm do topo: cubra</text>
<text x="380" y="396" font-size="11.5" fill="#222" text-anchor="start">com terra, plante uma árvore e</text>
<text x="380" y="412" font-size="11.5" fill="#222" text-anchor="start">faça outra fossa ao lado</text>
<text x="20" y="440" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">Interior escuro (as moscas preferem a luz do tubo).</text>
<text x="20" y="458" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">Pelo menos 30 m de poços, nascentes e rios, e ABAIXO deles no terreno.</text>
</svg>
