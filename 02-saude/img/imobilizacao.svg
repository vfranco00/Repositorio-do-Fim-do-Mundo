<circle cx="524" cy="132" r="8" fill="#e9e1c8" stroke="#1e1e1e" stroke-width="2"/>
<line x1="532" y1="130" x2="590" y2="112" stroke="#555"/>
<text x="592" y="108" font-size="12" fill="#222" text-anchor="start">nó do lado</text>
<text x="592" y="123" font-size="12" fill="#222" text-anchor="start">do pescoço</text>
<line x1="452" y1="200" x2="410" y2="168" stroke="#555"/>
<text x="352" y="150" font-size="12" fill="#222" text-anchor="start">mão acima</text>
<text x="352" y="165" font-size="12" fill="#222" text-anchor="start">do cotovelo</text>
<line x1="572" y1="236" x2="600" y2="250" stroke="#555"/>
<text x="586" y="266" font-size="12" fill="#222" text-anchor="start">pano apoia</text>
<text x="586" y="281" font-size="12" fill="#222" text-anchor="start">o antebraço</text>
<text x="362" y="300" font-size="12.5" fill="#222" text-anchor="start">Faça com pano triangular (quadrado de ~1 m</text>
<text x="362" y="316" font-size="12.5" fill="#222" text-anchor="start">dobrado na diagonal), camisa ou cachecol.</text>
<text x="362" y="334" font-size="12.5" fill="#222" text-anchor="start">Deixe os dedos de fora para ver a cor.</text>
</svg>
