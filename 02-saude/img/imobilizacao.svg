<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="356" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Imobilização de fraturas</text>
<text x="170" y="64" font-size="15" fill="#222" font-weight="bold" text-anchor="middle">A) Tala na perna</text>
<polyline points="40,150 290,154" fill="none" stroke="#1e1e1e" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/><polyline points="40,150 290,154" fill="none" stroke="#f2c9a5" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M290 134 L316 112 L326 122 L304 172 Z" fill="#f2c9a5" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="30" y="116" width="270" height="11" rx="3" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="177" width="270" height="11" rx="3" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="2"/>
<rect x="52" y="112" width="12" height="80" rx="3" fill="#e9e1c8" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="120" y="112" width="12" height="80" rx="3" fill="#e9e1c8" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="214" y="112" width="12" height="80" rx="3" fill="#e9e1c8" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="272" y="112" width="12" height="80" rx="3" fill="#e9e1c8" stroke="#1e1e1e" stroke-width="1.5"/>
<path d="M160 132 l8 10 l-8 10 l8 10 l-8 10" fill="none" stroke="#d62828" stroke-width="3"/>
<text x="164" y="214" font-size="12.5" fill="#b22" font-weight="bold" text-anchor="middle">fratura</text>
<text x="84" y="104" font-size="11.5" fill="#444" text-anchor="start">↓ joelho</text>
<text x="250" y="104" font-size="11.5" fill="#444" text-anchor="start">tornozelo ↓</text>
<text x="20" y="250" font-size="12.5" fill="#222" text-anchor="start">• Tala dos dois lados, acolchoada com pano.</text>
<text x="20" y="268" font-size="12.5" fill="#222" text-anchor="start">• Pegue a articulação ACIMA e a ABAIXO.</text>
<text x="20" y="286" font-size="12.5" fill="#222" text-anchor="start">• Amarre acima e abaixo da fratura,</text>
<text x="20" y="302" font-size="12.5" fill="#222" text-anchor="start">  nunca em cima dela.</text>
<text x="20" y="320" font-size="12.5" fill="#222" text-anchor="start">• Confira depois: dedos rosados, quentes</text>
<text x="20" y="336" font-size="12.5" fill="#222" text-anchor="start">  e com sensibilidade. Roxo/frio = afrouxe.</text>
<line x1="345" y1="48" x2="345" y2="350" stroke="#ccc" stroke-width="2"/>
<text x="512" y="64" font-size="15" fill="#222" font-weight="bold" text-anchor="middle">B) Tipoia (braço, punho, clavícula)</text>
<polyline points="500,150 500,262" fill="none" stroke="#1e1e1e" stroke-width="85" stroke-linecap="round" stroke-linejoin="round"/><polyline points="500,150 500,262" fill="none" stroke="#6f8aa3" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="500" cy="102" r="26" fill="#6f8aa3" stroke="#1e1e1e" stroke-width="2.5"/>
<polyline points="452,150 438,226 434,272" fill="none" stroke="#1e1e1e" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/><polyline points="452,150 438,226 434,272" fill="none" stroke="#6f8aa3" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="548,150 562,226 468,208" fill="none" stroke="#1e1e1e" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/><polyline points="548,150 562,226 468,208" fill="none" stroke="#6f8aa3" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="460" cy="206" r="11" fill="#f2c9a5" stroke="#1e1e1e" stroke-width="2"/>
<path d="M478 132 L452 204" stroke="#1e1e1e" stroke-width="13" stroke-linecap="round"/><path d="M478 132 L452 204" stroke="#e9e1c8" stroke-width="9" stroke-linecap="round"/>
<path d="M522 132 L566 214" stroke="#1e1e1e" stroke-width="13" stroke-linecap="round"/><path d="M522 132 L566 214" stroke="#e9e1c8" stroke-width="9" stroke-linecap="round"/>
