<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="400" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Torneira de pé para lavar as mãos (sem tocar em nada)</text>
<rect x="0" y="330" width="680" height="70" fill="#e8d3b0"/>
<ellipse cx="250" cy="340" rx="110" ry="16" fill="#9a9a9a" stroke="#555"/>
<text x="250" y="384" font-size="11.5" fill="#444" text-anchor="middle">buraco com pedras/brita (a água infiltra, não vira lama)</text>
<rect x="90" y="80" width="16" height="262" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="2"/>
<rect x="394" y="80" width="16" height="262" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="2"/>
<rect x="80" y="76" width="340" height="14" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="2"/>
<g transform="rotate(-20 250 150)"><rect x="210" y="110" width="80" height="96" rx="10" fill="#e8f3fd" stroke="#1e1e1e" stroke-width="2.5"/><rect x="214" y="150" width="72" height="52" fill="#9fc5ec"/><rect x="236" y="96" width="24" height="16" fill="#3f6d9e" stroke="#1e1e1e" stroke-width="2"/><path d="M290 122 q24 6 0 40" fill="none" stroke="#1e1e1e" stroke-width="4"/></g>
<line x1="250" y1="90" x2="262" y2="112" stroke="#555" stroke-width="2.5"/>
<line x1="270" y1="90" x2="276" y2="118" stroke="#555" stroke-width="2.5"/>
<circle cx="212" cy="122" r="3" fill="#1e1e1e"/>
<path d="M209 124 Q 196 160 200 210" fill="none" stroke="#4a90d9" stroke-width="3"/>
<line x1="302" y1="190" x2="320" y2="318" stroke="#555" stroke-width="2.5"/>
<rect x="300" y="314" width="120" height="10" rx="3" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="2" transform="rotate(-6 300 319)"/>
<ellipse cx="440" cy="314" rx="22" ry="10" fill="#555"/>
<line x1="140" y1="90" x2="140" y2="150" stroke="#555" stroke-width="2"/><rect x="126" y="150" width="28" height="18" rx="5" fill="#f7e98a" stroke="#1e1e1e" stroke-width="2"/>
