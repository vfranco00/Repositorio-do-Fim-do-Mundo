<circle cx="214" cy="236" r="13" fill="#f2c9a5" stroke="#1e1e1e" stroke-width="2"/>
<text x="450" y="118" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">1. Galão de 5 L com</text>
<text x="450" y="134" font-size="12.5" fill="#222" text-anchor="start">   furinho perto da tampa</text>
<text x="450" y="168" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">2. Pise no pedal: o galão</text>
<text x="450" y="184" font-size="12.5" fill="#222" text-anchor="start">   inclina e sai um fio de água</text>
<text x="450" y="218" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">3. Sabão pendurado</text>
<text x="450" y="234" font-size="12.5" fill="#222" text-anchor="start">   num barbante (não some,</text>
<text x="450" y="250" font-size="12.5" fill="#222" text-anchor="start">   não fica na lama)</text>
<text x="450" y="284" font-size="12.5" fill="#2b6a1e" font-weight="bold" text-anchor="start">Sem tocar em nada com</text>
<text x="450" y="300" font-size="12.5" fill="#2b6a1e" font-weight="bold" text-anchor="start">a mão suja. Gasta ~0,5 L.</text>
<text x="300" y="350" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">pedal amarrado na corda</text>
</svg>
