<text x="522" y="264" font-size="11.5" fill="#222" text-anchor="start">2 dedos, centro do peito,</text>
<text x="522" y="278" font-size="11.5" fill="#222" text-anchor="start">abaixo dos mamilos</text>
<text x="356" y="374" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">3. Repita 5 tapas + 5 compressões até sair.</text>
<text x="356" y="391" font-size="11.5" fill="#222" text-anchor="start">Desmaiou: RCP de bebê. Tire o objeto só se visível.</text>
