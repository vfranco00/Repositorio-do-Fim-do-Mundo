<text x="244" y="170" font-size="11.5" fill="#b22" font-weight="bold" text-anchor="start">para dentro</text>
<text x="244" y="186" font-size="11.5" fill="#b22" font-weight="bold" text-anchor="start">e para cima</text>
<text x="242" y="248" font-size="12" fill="#222" text-anchor="start">punho entre o</text>
<text x="242" y="263" font-size="12" fill="#222" text-anchor="start">umbigo e o fim</text>
<text x="242" y="278" font-size="12" fill="#222" text-anchor="start">do esterno</text>
<text x="240" y="96" font-size="11" fill="#444" text-anchor="start">vítima com a</text>
<text x="240" y="109" font-size="11" fill="#444" text-anchor="start">mão na garganta</text>
<text x="30" y="374" font-size="12" fill="#222" text-anchor="start">Repita até o objeto sair. Grávida ou obeso: mãos</text>
<text x="30" y="390" font-size="12" fill="#222" text-anchor="start">no centro do peito. Desmaiou: deite e faça RCP.</text>
