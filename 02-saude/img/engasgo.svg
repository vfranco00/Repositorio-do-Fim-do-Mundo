<text x="512" y="62" font-size="14.5" fill="#222" font-weight="bold" text-anchor="middle">Bebê (menos de 1 ano)</text>
<text x="356" y="90" font-size="13" fill="#222" font-weight="bold" text-anchor="start">1. Cinco tapas nas costas</text>
