<text x="536" y="104" font-size="11.5" fill="#222" text-anchor="start">entre as escápulas,</text>
<text x="536" y="118" font-size="11.5" fill="#222" text-anchor="start">com a base da mão</text>
<text x="356" y="206" font-size="11.5" fill="#444" text-anchor="start">cabeça MAIS BAIXA que o corpo;</text>
<text x="356" y="220" font-size="11.5" fill="#444" text-anchor="start">segure pelo queixo, não pela garganta</text>
<text x="356" y="250" font-size="13" fill="#222" font-weight="bold" text-anchor="start">2. Vire: cinco compressões no peito</text>
