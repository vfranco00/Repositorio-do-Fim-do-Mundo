<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="436" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Banheiro seco de balde (sem água)</text>
<rect x="40" y="150" width="200" height="130" fill="#c9a26b" stroke="#1e1e1e" stroke-width="2.5"/>
<ellipse cx="140" cy="150" rx="70" ry="12" fill="#e6e6e6" stroke="#1e1e1e" stroke-width="2.5"/>
<ellipse cx="140" cy="150" rx="40" ry="7" fill="#555"/>
<path d="M80 172 L80 270 L200 270 L200 172" fill="#7aa36a" fill-opacity="0.5" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="140" y="230" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">balde de 20 L</text>
<text x="140" y="300" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">1. Assento sobre um balde</text>
<path d="M290 190 L300 270 L370 270 L380 190 Z" fill="#f1dfa6" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M296 196 Q 335 180 374 196" fill="#e3c98a" stroke="#1e1e1e" stroke-width="1.5"/>
<path d="M340 160 l26 -4 l-2 30 l-26 2 Z" fill="#9a9a9a" stroke="#1e1e1e" stroke-width="2"/>
<text x="335" y="300" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">2. Após cada uso, cubra</text>
<text x="335" y="316" font-size="12" fill="#222" text-anchor="middle">com 1 caneca de serragem,</text>
<text x="335" y="332" font-size="12" fill="#222" text-anchor="middle">cinza, cal ou terra seca</text>
<rect x="430" y="170" width="100" height="100" fill="#8a7458" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="540" y="170" width="100" height="100" fill="#6b5a40" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="430" y="150" width="210" height="20" fill="#a0522d" stroke="#1e1e1e" stroke-width="2"/>
<text x="480" y="226" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">em uso</text>
<text x="590" y="218" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">descansando</text>
<text x="590" y="234" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1 ano</text>
<text x="535" y="300" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">3. Balde cheio: esvazie numa</text>
<text x="535" y="316" font-size="12" fill="#222" text-anchor="middle">composteira de 2 baias; cubra</text>
<text x="535" y="332" font-size="12" fill="#222" text-anchor="middle">com palha. Depois de 1 ano em</text>
<text x="535" y="348" font-size="12" fill="#222" text-anchor="middle">repouso, use em ÁRVORES</text>
<line x1="240" y1="215" x2="276.0" y2="215.0" stroke="#555" stroke-width="3"/><polygon points="282,215 271.2,220.2 271.2,209.8" fill="#555"/>
<line x1="388" y1="215" x2="418.0" y2="215.0" stroke="#555" stroke-width="3"/><polygon points="424,215 413.2,220.2 413.2,209.8" fill="#555"/>
<rect x="30" y="368" width="620" height="58" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="44" y="390" font-size="12.5" fill="#222" text-anchor="start">Separar a urina (balde ou garrafa à parte) reduz muito o cheiro. Dilua 1 parte em 5–10 de</text>
<text x="44" y="408" font-size="12.5" fill="#222" text-anchor="start">água e use em árvores e capim. Fezes NUNCA em horta de folhas comidas cruas.</text>
<text x="340" y="72" font-size="13" fill="#2b6a1e" font-weight="bold" text-anchor="middle">Não precisa de água nem de buraco. Funciona dentro de casa.</text>
</svg>
