<text x="34" y="390" font-size="13.5" fill="#222" text-anchor="start"><tspan font-weight="bold">Ritmo:</tspan> 100–120/min · <tspan font-weight="bold">Profundidade:</tspan> 5–6 cm · <tspan font-weight="bold">30 compressões : 2 ventilações</tspan></text>
<text x="34" y="409" font-size="13" fill="#222" text-anchor="start">Sem treino para ventilar? Só compressões, sem parar. Troque de pessoa a cada 2 minutos.</text>
<text x="34" y="426" font-size="12.5" fill="#222" text-anchor="start">Criança: 1–2 mãos, ~5 cm · Bebê: 2 dedos, ~4 cm · Afogado: 5 ventilações primeiro.</text>
