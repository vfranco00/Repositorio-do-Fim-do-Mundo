<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 562" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="562" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Como reconhecer cobras peçonhentas do Brasil</text>
<text x="240" y="72" font-size="14" fill="#b3001b" font-weight="bold" text-anchor="middle">Peçonhenta (jararaca, cascavel, surucucu)</text>
<path d="M60 178 C 64 148, 112 130, 180 130 C 250 130, 300 142, 345 160 L 470 168 L 470 220 L 345 222 C 280 228, 190 230, 116 214 C 82 207, 60 196, 60 178 Z" fill="#a98a5b" stroke="#1e1e1e" stroke-width="3"/>
<path d="M360 168 l18 22 l18 -22" fill="none" stroke="#4a3a22" stroke-width="7" stroke-linejoin="round"/>
<path d="M410 168 l18 22 l18 -22" fill="none" stroke="#4a3a22" stroke-width="7" stroke-linejoin="round"/>
<path d="M452 168 l18 22 l18 -22" fill="none" stroke="#4a3a22" stroke-width="7" stroke-linejoin="round"/>
<path d="M70 190 Q 190 206 320 200" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<circle cx="186" cy="160" r="15" fill="#e8d36a" stroke="#1e1e1e" stroke-width="2.5"/><ellipse cx="186" cy="160" rx="3.5" ry="12" fill="#1e1e1e"/>
<ellipse cx="86" cy="166" rx="6" ry="5" fill="#1e1e1e"/>
<ellipse cx="134" cy="172" rx="9" ry="7.5" fill="#1e1e1e"/>
<circle cx="134" cy="172" r="19" fill="none" stroke="#d62828" stroke-width="3.5"/>
<line x1="128" y1="190" x2="110" y2="246" stroke="#d62828" stroke-width="2.5"/>
<text x="20" y="262" font-size="13.5" fill="#b3001b" font-weight="bold" text-anchor="start">FOSSETA LOREAL: um buraco ENTRE o olho e a narina</text>
<text x="20" y="280" font-size="13" fill="#b3001b" text-anchor="start">(órgão que sente calor). Tem fosseta = PEÇONHENTA.</text>
<text x="196" y="124" font-size="11.5" fill="#444" text-anchor="start">pupila em fenda</text>
<text x="40" y="140" font-size="11.5" fill="#444" text-anchor="start">narina ↓</text>
<text x="586" y="92" font-size="13" fill="#2b6a1e" font-weight="bold" text-anchor="middle">Em geral não</text>
<text x="586" y="108" font-size="13" fill="#2b6a1e" font-weight="bold" text-anchor="middle">peçonhenta</text>
<path d="M520 170 C 522 150, 548 138, 585 138 C 625 138, 650 150, 665 162 L 665 196 C 640 204, 600 206, 560 200 C 532 196, 520 186, 520 170 Z" fill="#7aa36a" stroke="#1e1e1e" stroke-width="3"/>
<circle cx="580" cy="160" r="12" fill="#f0e6c0" stroke="#1e1e1e" stroke-width="2.5"/><circle cx="580" cy="160" r="6" fill="#1e1e1e"/>
<ellipse cx="534" cy="162" rx="4.5" ry="4" fill="#1e1e1e"/>
<text x="512" y="226" font-size="12" fill="#2b6a1e" text-anchor="start">sem fosseta,</text>
<text x="512" y="241" font-size="12" fill="#2b6a1e" text-anchor="start">pupila redonda</text>
<text x="512" y="258" font-size="11.5" fill="#444" text-anchor="start">(NÃO pegue: há</text>
<text x="512" y="272" font-size="11.5" fill="#444" text-anchor="start">exceções, como a coral)</text>
<line x1="20" y1="296" x2="660" y2="296" stroke="#ccc" stroke-width="2"/>
<text x="340" y="322" font-size="15" fill="#222" font-weight="bold" text-anchor="middle">Reconheça pela cauda e pelas cores</text>
<path d="M20 364 C 80 364, 130 372, 158 380 C 130 386, 80 396, 20 396 Z" fill="#a98a5b" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M34 368 l10 12 l10 -12" fill="none" stroke="#4a3a22" stroke-width="5"/>
<path d="M72 368 l10 12 l10 -12" fill="none" stroke="#4a3a22" stroke-width="5"/>
<path d="M108 368 l10 12 l10 -12" fill="none" stroke="#4a3a22" stroke-width="5"/>
<text x="20" y="420" font-size="13" fill="#222" font-weight="bold" text-anchor="start">JARARACA</text>
<text x="20" y="436" font-size="11.5" fill="#222" text-anchor="start">desenhos em "V" ou</text>
<text x="20" y="450" font-size="11.5" fill="#222" text-anchor="start">"gancho de telefone";</text>
<text x="20" y="464" font-size="11.5" fill="#222" text-anchor="start">cauda lisa e fina</text>
<text x="20" y="480" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">~ 80% dos acidentes</text>
<path d="M185 364 C 225 364, 255 370, 271 372 L 271 388 C 255 390, 225 396, 185 396 Z" fill="#b59a66" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="271" y="369" width="13" height="22" rx="5" fill="#e9dcb8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="283" y="370" width="13" height="20" rx="5" fill="#e9dcb8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="295" y="371" width="13" height="18" rx="5" fill="#e9dcb8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="307" y="372" width="13" height="16" rx="5" fill="#e9dcb8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="319" y="373" width="13" height="14" rx="5" fill="#e9dcb8" stroke="#1e1e1e" stroke-width="2"/>
<text x="185" y="420" font-size="13" fill="#222" font-weight="bold" text-anchor="start">CASCAVEL</text>
<text x="185" y="436" font-size="11.5" fill="#222" text-anchor="start">chocalho (guizo) na</text>
<text x="185" y="450" font-size="11.5" fill="#222" text-anchor="start">ponta da cauda; faz</text>
<text x="185" y="464" font-size="11.5" fill="#222" text-anchor="start">barulho de chiado</text>
<text x="185" y="480" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">ataca nervos e rins</text>
<path d="M350 364 C 410 364, 460 372, 488 380 C 460 386, 410 396, 350 396 Z" fill="#c79a52" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M442 372 l6 -10 l6 9 l6 -10 l6 9 l6 -9 l6 8 l4 -6 L 488 380 L 478 385 l-6 8 l-6 -7 l-6 8 l-6 -7 l-6 8 l-6 -8 Z" fill="#3a2a16" stroke="#1e1e1e" stroke-width="1.5"/>
<path d="M360 366 l14 14 l14 -14 Z" fill="#3a2a16"/>
<path d="M396 366 l14 14 l14 -14 Z" fill="#3a2a16"/>
<text x="350" y="420" font-size="13" fill="#222" font-weight="bold" text-anchor="start">SURUCUCU</text>
<text x="350" y="436" font-size="11.5" fill="#222" text-anchor="start">(pico-de-jaca): ponta da</text>
<text x="350" y="450" font-size="11.5" fill="#222" text-anchor="start">cauda com escamas</text>
<text x="350" y="464" font-size="11.5" fill="#222" text-anchor="start">arrepiadas e escuras</text>
<text x="350" y="480" font-size="11.5" fill="#444" text-anchor="start">Amazônia e</text>
<text x="350" y="494" font-size="11.5" fill="#444" text-anchor="start">Mata Atlântica</text>
<clipPath id="cc"><path d="M515 365 C 575 365, 635 368, 660 380 C 635 392, 575 395, 515 395 Z"/></clipPath>
<g clip-path="url(#cc)"><rect x="515" y="360" width="16" height="40" fill="#d62828"/><rect x="531" y="360" width="10" height="40" fill="#1e1e1e"/><rect x="541" y="360" width="7" height="40" fill="#f4f1e6"/><rect x="548" y="360" width="10" height="40" fill="#1e1e1e"/><rect x="558" y="360" width="7" height="40" fill="#f4f1e6"/><rect x="565" y="360" width="10" height="40" fill="#1e1e1e"/><rect x="575" y="360" width="16" height="40" fill="#d62828"/><rect x="591" y="360" width="10" height="40" fill="#1e1e1e"/><rect x="601" y="360" width="7" height="40" fill="#f4f1e6"/><rect x="608" y="360" width="10" height="40" fill="#1e1e1e"/><rect x="618" y="360" width="30" height="40" fill="#d62828"/></g>
<path d="M515 365 C 575 365, 635 368, 660 380 C 635 392, 575 395, 515 395 Z" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<text x="515" y="420" font-size="13" fill="#222" font-weight="bold" text-anchor="start">CORAL</text>
<text x="515" y="436" font-size="11.5" fill="#222" text-anchor="start">anéis vermelhos, pretos</text>
<text x="515" y="450" font-size="11.5" fill="#222" text-anchor="start">e brancos/amarelos que</text>
<text x="515" y="464" font-size="11.5" fill="#222" text-anchor="start">dão a VOLTA no corpo</text>
<text x="515" y="480" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">sem fosseta, mas</text>
<text x="515" y="494" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="start">MUITO perigosa</text>
<rect x="20" y="506" width="640" height="46" rx="8" fill="#fdecea" stroke="#d62828" stroke-width="1.5"/>
<text x="34" y="526" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Cabeça triangular NÃO é sinal confiável. Existem corais falsas iguais às verdadeiras.</text>
<text x="34" y="543" font-size="12.5" fill="#222" text-anchor="start">Na dúvida, trate TODA cobra como perigosa: não chegue perto, não pegue, não tente matar.</text>
</svg>
