<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="680" height="420" fill="#fff"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Captação de água de chuva com descarte da primeira água</text>
  <!-- chuva -->
  <g stroke="#4a90d9" stroke-width="2" stroke-linecap="round">
    <line x1="90" y1="45" x2="84" y2="60"/><line x1="140" y1="42" x2="134" y2="57"/><line x1="190" y1="48" x2="184" y2="63"/>
    <line x1="240" y1="44" x2="234" y2="59"/><line x1="290" y1="47" x2="284" y2="62"/><line x1="115" y1="70" x2="109" y2="85"/>
    <line x1="265" y1="72" x2="259" y2="87"/>
  </g>
  <!-- casa -->
  <polygon points="30,160 200,70 370,160" fill="#c8553d" stroke="#222" stroke-width="2"/>
  <rect x="60" y="160" width="280" height="200" fill="#f3e9d8" stroke="#222" stroke-width="2"/>
  <rect x="170" y="270" width="60" height="90" fill="#8b5a2b" stroke="#222" stroke-width="2"/>
  <rect x="90" y="200" width="55" height="45" fill="#cfe6fb" stroke="#222" stroke-width="2"/>
  <rect x="255" y="200" width="55" height="45" fill="#cfe6fb" stroke="#222" stroke-width="2"/>
  <!-- calha -->
  <path d="M355 156 L392 156 L392 170 L355 170 Z" fill="#9aa5b1" stroke="#222" stroke-width="2"/>
  <!-- cano descendo -->
  <rect x="368" y="170" width="14" height="38" fill="#e6e6e6" stroke="#222" stroke-width="2"/>
  <!-- horizontal ate a caixa -->
  <rect x="368" y="200" width="200" height="14" fill="#e6e6e6" stroke="#222" stroke-width="2"/>
  <!-- tubo de descarte -->
  <rect x="425" y="214" width="24" height="130" fill="#e6e6e6" stroke="#222" stroke-width="2"/>
  <rect x="427" y="262" width="20" height="80" fill="#a7c7e7"/>
  <circle cx="437" cy="256" r="9" fill="#f5c542" stroke="#222" stroke-width="1.5"/>
  <rect x="428" y="344" width="18" height="10" fill="#555" stroke="#222"/>
  <!-- caixa d'agua -->
  <rect x="540" y="214" width="120" height="150" rx="6" fill="#f0f4f8" stroke="#222" stroke-width="2.5"/>
  <rect x="543" y="250" width="114" height="111" fill="#a7c7e7"/>
  <rect x="534" y="204" width="132" height="12" rx="3" fill="#3f6d9e" stroke="#222" stroke-width="2"/>
  <rect x="555" y="214" width="16" height="6" fill="#222"/>
  <!-- ladrao -->
  <rect x="660" y="232" width="16" height="10" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
  <!-- torneira de saida -->
  <rect x="520" y="338" width="22" height="10" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
  <path d="M520 338 L512 338 L512 356" fill="none" stroke="#222" stroke-width="3"/>
  <!-- lodo -->
  <rect x="543" y="352" width="114" height="9" fill="#8a7458"/>
  <!-- chao -->
  <line x1="10" y1="364" x2="670" y2="364" stroke="#6b4f2a" stroke-width="3"/>
  <!-- rotulos -->
  <g font-size="13" fill="#222">
    <line x1="374" y1="150" x2="390" y2="92" stroke="#555"/>
    <text x="360" y="70">1. Calha com tela</text>
    <text x="360" y="86" font-size="11.5" fill="#444">(segura folhas e insetos)</text>
    <line x1="437" y1="356" x2="437" y2="370" stroke="#555"/>
    <text x="405" y="384">2. Descarte da 1ª água</text>
    <text x="405" y="400" font-size="11.5" fill="#444">enche primeiro; a bola boia e fecha.</text>
    <text x="405" y="414" font-size="11.5" fill="#444">Esvazie pelo registro após cada chuva.</text>
    <line x1="590" y1="200" x2="590" y2="160" stroke="#555"/>
    <text x="500" y="138">3. Caixa FECHADA</text>
    <text x="500" y="154" font-size="11.5" fill="#444">(sem luz, sem mosquito)</text>
    <text x="566" y="314" font-size="12" fill="#14385f">água limpa</text>
    <text x="580" y="196" font-size="11" fill="#14385f">ladrão c/ tela ↓</text>
  </g>
  <g font-size="11.5" fill="#222">
    <text x="12" y="384">Saída 10 cm acima do fundo: o lodo fica no fundo.</text>
    <text x="12" y="400">Volume captado ≈ área do telhado (m²) × chuva (mm) × 0,8 litros</text>
  </g>
</svg>
