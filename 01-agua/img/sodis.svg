<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="680" height="350" fill="#fff"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">SODIS — desinfecção solar da água</text>
  <!-- sol -->
  <circle cx="600" cy="80" r="30" fill="#f7c331" stroke="#e09b00" stroke-width="2"/>
  <g stroke="#e09b00" stroke-width="3" stroke-linecap="round">
    <line x1="600" y1="36" x2="600" y2="24"/><line x1="600" y1="124" x2="600" y2="136"/>
    <line x1="556" y1="80" x2="544" y2="80"/><line x1="644" y1="80" x2="656" y2="80"/>
    <line x1="569" y1="49" x2="561" y2="41"/><line x1="631" y1="111" x2="639" y2="119"/>
    <line x1="631" y1="49" x2="639" y2="41"/><line x1="569" y1="111" x2="561" y2="119"/>
  </g>
  <g stroke="#f0a020" stroke-width="2" stroke-dasharray="6 6">
    <line x1="565" y1="112" x2="495" y2="212"/><line x1="580" y1="120" x2="370" y2="212"/>
  </g>
  <!-- passos -->
  <g font-size="13" fill="#222">
    <text x="20" y="64" font-weight="bold">1. Garrafa PET</text>
    <text x="20" y="80">transparente, até 2 L,</text>
    <text x="20" y="96">sem rótulo, sem riscos.</text>
    <text x="210" y="64" font-weight="bold">2. Água clara</text>
    <text x="210" y="80">Encha 3/4, agite 20 s,</text>
    <text x="210" y="96">complete e feche.</text>
    <text x="400" y="64" font-weight="bold">3. Deite no sol</text>
    <text x="400" y="80">sobre telhado ou</text>
    <text x="400" y="96">chapa de metal.</text>
  </g>
  <!-- garrafa em pe -->
  <g transform="translate(60,110)">
    <path d="M20 0 h20 v14 q14 10 14 28 v70 q0 8 -8 8 h-32 q-8 0 -8 -8 v-70 q0 -18 14 -28z" fill="#e8f3fd" stroke="#222" stroke-width="2"/>
    <rect x="18" y="-8" width="24" height="10" fill="#3f6d9e" stroke="#222"/>
  </g>
  <!-- teste de leitura -->
  <g transform="translate(220,108)">
    <rect x="0" y="40" width="120" height="70" fill="#fdfdf6" stroke="#999"/>
    <g fill="#333" font-size="10"><text x="8" y="58">JORNAL jornal</text><text x="8" y="72">texto legível</text><text x="8" y="86">através da</text><text x="8" y="100">garrafa = OK</text></g>
    <circle cx="60" cy="74" r="32" fill="#cfe6fb" fill-opacity="0.45" stroke="#3f6d9e" stroke-width="2"/>
  </g>
  <!-- telhado com garrafas deitadas -->
  <polygon points="150,250 600,250 640,290 110,290" fill="#9aa5b1" stroke="#222" stroke-width="2"/>
  <g>
    <g transform="translate(180,218)"><rect x="0" y="0" width="100" height="30" rx="10" fill="#e8f3fd" stroke="#222" stroke-width="2"/><rect x="100" y="8" width="14" height="14" fill="#3f6d9e" stroke="#222"/></g>
    <g transform="translate(310,218)"><rect x="0" y="0" width="100" height="30" rx="10" fill="#e8f3fd" stroke="#222" stroke-width="2"/><rect x="100" y="8" width="14" height="14" fill="#3f6d9e" stroke="#222"/></g>
    <g transform="translate(440,218)"><rect x="0" y="0" width="100" height="30" rx="10" fill="#e8f3fd" stroke="#222" stroke-width="2"/><rect x="100" y="8" width="14" height="14" fill="#3f6d9e" stroke="#222"/></g>
  </g>
  <g font-size="13.5" fill="#222">
    <text x="20" y="314"><tspan font-weight="bold">Tempo:</tspan> 6 horas de sol forte · 2 dias seguidos se o céu estiver mais da metade nublado.</text>
    <text x="20" y="334">Chuva contínua: <tspan font-weight="bold" fill="#b22">NÃO funciona</tspan> — use fervura ou cloro.</text>
  </g>
</svg>
