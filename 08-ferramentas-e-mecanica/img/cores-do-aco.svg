<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 552" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="552" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Cores do aço: temperatura e revenido</text>
<text x="20" y="62" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">1. Cor do aço aquecido (olhe na SOMBRA; no sol forte parece mais frio do que está)</text>
<rect x="20" y="92" width="80" height="46" fill="#3d0805" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="60.0" y="84" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">~550 °C</text>
<text x="60.0" y="152" font-size="11.5" fill="#222" text-anchor="middle">vermelho</text>
<text x="60.0" y="166" font-size="11.5" fill="#222" text-anchor="middle">quase preto</text>
<rect x="100" y="92" width="80" height="46" fill="#6e0e08" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="140.0" y="84" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">~650 °C</text>
<text x="140.0" y="152" font-size="11.5" fill="#222" text-anchor="middle">vermelho</text>
<text x="140.0" y="166" font-size="11.5" fill="#222" text-anchor="middle">sangue</text>
<rect x="180" y="92" width="80" height="46" fill="#a5180c" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="220.0" y="84" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">~750 °C</text>
<text x="220.0" y="152" font-size="11.5" fill="#222" text-anchor="middle">vermelho</text>
<text x="220.0" y="166" font-size="11.5" fill="#222" text-anchor="middle">escuro</text>
<rect x="260" y="92" width="80" height="46" fill="#d0301a" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="300.0" y="84" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">~820 °C</text>
<text x="300.0" y="152" font-size="11.5" fill="#222" text-anchor="middle">cereja</text>
<rect x="340" y="92" width="80" height="46" fill="#ea5a1c" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="380.0" y="84" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">~900 °C</text>
<text x="380.0" y="152" font-size="11.5" fill="#222" text-anchor="middle">cereja</text>
<text x="380.0" y="166" font-size="11.5" fill="#222" text-anchor="middle">claro</text>
<rect x="420" y="92" width="80" height="46" fill="#f58a1f" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="460.0" y="84" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">~1.000 °C</text>
<text x="460.0" y="152" font-size="11.5" fill="#222" text-anchor="middle">laranja</text>
<rect x="500" y="92" width="80" height="46" fill="#f8c63a" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="540.0" y="84" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">~1.100 °C</text>
<text x="540.0" y="152" font-size="11.5" fill="#222" text-anchor="middle">amarelo</text>
<rect x="580" y="92" width="80" height="46" fill="#fdf3c0" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="620.0" y="84" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">~1.250 °C</text>
<text x="620.0" y="152" font-size="11.5" fill="#222" text-anchor="middle">amarelo-</text>
<text x="620.0" y="166" font-size="11.5" fill="#222" text-anchor="middle">branco</text>
<path d="M264 182 L264 190 L576 190 L576 182" fill="none" stroke="#a35a00" stroke-width="2.5"/><text x="420.0" y="206" font-size="12" fill="#a35a00" font-weight="bold" text-anchor="middle">FORJAR (bater)</text><text x="420.0" y="221" font-size="11" fill="#333" text-anchor="middle">do amarelo até o cereja</text>
<path d="M266 230 L266 238 L390 238 L390 230" fill="none" stroke="#b3001b" stroke-width="2.5"/><text x="328.0" y="254" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="middle">TEMPERAR</text><text x="328.0" y="269" font-size="11" fill="#333" text-anchor="middle">~800 °C</text>
<path d="M24 182 L24 190 L256 190 L256 182" fill="none" stroke="#555" stroke-width="2.5"/><text x="140.0" y="206" font-size="12" fill="#555" font-weight="bold" text-anchor="middle">NÃO bata: racha</text><text x="140.0" y="221" font-size="11" fill="#333" text-anchor="middle">reaqueça</text>
<path d="M584 182 L584 190 L656 190 L656 182" fill="none" stroke="#b3001b" stroke-width="2.5"/><text x="620.0" y="206" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="middle">queima</text><text x="620.0" y="221" font-size="11" fill="#333" text-anchor="middle">faíscas</text>
<text x="400" y="242.0" font-size="11.5" fill="#222" text-anchor="start">Ímã: quando para de grudar (~770 °C),</text>
<text x="400" y="256.95" font-size="11.5" fill="#222" text-anchor="start">aqueça mais um tom e mergulhe.</text>
<text x="20" y="290" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">2. Cores do REVENIDO (lixe até brilhar e aqueça DEVAGAR; a cor aparece na superfície)</text>
<rect x="20" y="316" width="80" height="46" fill="#efe2a6" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="60.0" y="344" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">200 °C</text>
<text x="60.0" y="378" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">palha clara</text>
<text x="60.0" y="394" font-size="10.5" fill="#444" text-anchor="middle">navalha,</text>
<text x="60.0" y="407" font-size="10.5" fill="#444" text-anchor="middle">raspador</text>
<rect x="100" y="316" width="80" height="46" fill="#e2c56a" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="140.0" y="344" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">220 °C</text>
<text x="140.0" y="378" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">palha</text>
<text x="140.0" y="394" font-size="10.5" fill="#444" text-anchor="middle">faca,</text>
<text x="140.0" y="407" font-size="10.5" fill="#444" text-anchor="middle">plaina</text>
<rect x="180" y="316" width="80" height="46" fill="#c99838" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="220.0" y="344" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">240 °C</text>
<text x="220.0" y="378" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">palha escura</text>
<text x="220.0" y="394" font-size="10.5" fill="#444" text-anchor="middle">faca de lida,</text>
<text x="220.0" y="407" font-size="10.5" fill="#444" text-anchor="middle">formão</text>
<rect x="260" y="316" width="80" height="46" fill="#9a6430" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="300.0" y="344" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">255 °C</text>
<text x="300.0" y="378" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">bronze</text>
<text x="300.0" y="394" font-size="10.5" fill="#444" text-anchor="middle">tesoura,</text>
<text x="300.0" y="407" font-size="10.5" fill="#444" text-anchor="middle">talhadeira</text>
<rect x="340" y="316" width="80" height="46" fill="#7a3a6c" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="380.0" y="344" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">270 °C</text>
<text x="380.0" y="378" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">roxo</text>
<text x="380.0" y="394" font-size="10.5" fill="#444" text-anchor="middle">machado,</text>
<text x="380.0" y="407" font-size="10.5" fill="#444" text-anchor="middle">enxó</text>
<rect x="420" y="316" width="80" height="46" fill="#2b3d8c" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="460.0" y="344" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">290 °C</text>
<text x="460.0" y="378" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">azul escuro</text>
<text x="460.0" y="394" font-size="10.5" fill="#444" text-anchor="middle">facão, mola,</text>
<text x="460.0" y="407" font-size="10.5" fill="#444" text-anchor="middle">chave de fenda</text>
<rect x="500" y="316" width="80" height="46" fill="#4f7fc4" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="540.0" y="344" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">310 °C</text>
<text x="540.0" y="378" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">azul claro</text>
<text x="540.0" y="394" font-size="10.5" fill="#444" text-anchor="middle">mola,</text>
<text x="540.0" y="407" font-size="10.5" fill="#444" text-anchor="middle">serrote</text>
<rect x="580" y="316" width="80" height="46" fill="#8ea1b5" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="620.0" y="344" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">330+ °C</text>
<text x="620.0" y="378" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">cinza</text>
<text x="620.0" y="394" font-size="10.5" fill="#444" text-anchor="middle">mole demais:</text>
<text x="620.0" y="407" font-size="10.5" fill="#444" text-anchor="middle">perdeu</text>
<line x1="30" y1="436" x2="644.0" y2="436.0" stroke="#555" stroke-width="3"/><polygon points="650,436 639.2,441.2 639.2,430.8" fill="#555"/>
<text x="30" y="454" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">mais DURO (segura fio, quebra fácil)</text>
<text x="650" y="454" font-size="11.5" fill="#222" font-weight="bold" text-anchor="end">mais TENAZ (dobra, não quebra)</text>
<rect x="15" y="468" width="650" height="74" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="28" y="489" font-size="12" fill="#1e1e1e" text-anchor="start">Teste da LIMA depois da têmpera: lima nova escorrega sem morder = temperou. Se morde, repita.</text>
<text x="28" y="508" font-size="12" fill="#1e1e1e" text-anchor="start">Revenir LOGO (em até 1 hora): aço temperado sem revenir é quebradiço como vidro.</text>
<text x="28" y="527" font-size="12" fill="#1e1e1e" text-anchor="start">Forno de cozinha: 1 hora a 200–220 °C para facas; esfrie e repita mais 1 vez.</text>
</svg>
