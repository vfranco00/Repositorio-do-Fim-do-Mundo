<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 594" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="594" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Chupeta: ordem certa dos cabos</text>
<rect x="30" y="130" width="200" height="104" rx="6" fill="#4d4d4d" stroke="#1e1e1e" stroke-width="2.5"/><rect x="30" y="130" width="200" height="16" rx="4" fill="#666" stroke="#1e1e1e" stroke-width="2"/><text x="130" y="188" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">DESCARREGADA</text><text x="130" y="210" font-size="11.5" fill="#ddd" text-anchor="middle">no carro PARADO</text><rect x="178" y="116" width="24" height="16" fill="#d62828" stroke="#1e1e1e" stroke-width="2"/><rect x="58" y="116" width="24" height="16" fill="#9a9a9a" stroke="#1e1e1e" stroke-width="2"/><text x="190" y="164" font-size="22" fill="#ff8a8a" font-weight="bold" text-anchor="middle">+</text><text x="70" y="164" font-size="22" fill="#ddd" font-weight="bold" text-anchor="middle">−</text>
<rect x="450" y="130" width="200" height="104" rx="6" fill="#4d4d4d" stroke="#1e1e1e" stroke-width="2.5"/><rect x="450" y="130" width="200" height="16" rx="4" fill="#666" stroke="#1e1e1e" stroke-width="2"/><text x="550" y="188" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">BOA</text><text x="550" y="210" font-size="11.5" fill="#ddd" text-anchor="middle">no carro que vai ajudar</text><rect x="478" y="116" width="24" height="16" fill="#d62828" stroke="#1e1e1e" stroke-width="2"/><rect x="598" y="116" width="24" height="16" fill="#9a9a9a" stroke="#1e1e1e" stroke-width="2"/><text x="490" y="164" font-size="22" fill="#ff8a8a" font-weight="bold" text-anchor="middle">+</text><text x="610" y="164" font-size="22" fill="#ddd" font-weight="bold" text-anchor="middle">−</text>
<rect x="30" y="300" width="230" height="74" rx="8" fill="#a0a0a0" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="48" y="286" width="26" height="16" rx="3" fill="#8a8a8a" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="88" y="286" width="26" height="16" rx="3" fill="#8a8a8a" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="128" y="286" width="26" height="16" rx="3" fill="#8a8a8a" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="168" y="286" width="26" height="16" rx="3" fill="#8a8a8a" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="128" y="330" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle">MOTOR do carro parado</text>
<text x="128" y="348" font-size="11" fill="#1e1e1e" text-anchor="middle">parafuso ou suporte de metal</text>
<text x="128" y="362" font-size="11" fill="#1e1e1e" text-anchor="middle">SEM tinta, longe da bateria</text>
<rect x="232" y="318" width="22" height="22" fill="#cfcfcf" stroke="#1e1e1e" stroke-width="2"/>
<path d="M190 104 C 230 52, 450 52, 490 104" fill="none" stroke="#1e1e1e" stroke-width="11" stroke-linecap="round"/>
<path d="M190 104 C 230 52, 450 52, 490 104" fill="none" stroke="#d62828" stroke-width="7" stroke-linecap="round"/>
<path d="M610 104 C 670 70, 662 250, 560 300 C 470 334, 360 330, 262 330" fill="none" stroke="#777" stroke-width="11" stroke-linecap="round"/>
<path d="M610 104 C 670 70, 662 250, 560 300 C 470 334, 360 330, 262 330" fill="none" stroke="#1e1e1e" stroke-width="7" stroke-linecap="round"/>
<rect x="181" y="98" width="18" height="20" rx="3" fill="#d62828" stroke="#1e1e1e" stroke-width="2"/><line x1="185" y1="118" x2="185" y2="124" stroke="#1e1e1e" stroke-width="3"/><line x1="195" y1="118" x2="195" y2="124" stroke="#1e1e1e" stroke-width="3"/>
<rect x="481" y="98" width="18" height="20" rx="3" fill="#d62828" stroke="#1e1e1e" stroke-width="2"/><line x1="485" y1="118" x2="485" y2="124" stroke="#1e1e1e" stroke-width="3"/><line x1="495" y1="118" x2="495" y2="124" stroke="#1e1e1e" stroke-width="3"/>
<rect x="601" y="98" width="18" height="20" rx="3" fill="#333" stroke="#1e1e1e" stroke-width="2"/><line x1="605" y1="118" x2="605" y2="124" stroke="#1e1e1e" stroke-width="3"/><line x1="615" y1="118" x2="615" y2="124" stroke="#1e1e1e" stroke-width="3"/>
<rect x="254" y="320" width="20" height="18" rx="3" fill="#333" stroke="#1e1e1e" stroke-width="2"/>
<circle cx="160" cy="96" r="14" fill="#d62828" stroke="#fff" stroke-width="2.5"/><text x="160" y="101.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<circle cx="520" cy="96" r="14" fill="#d62828" stroke="#fff" stroke-width="2.5"/><text x="520" y="101.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<circle cx="578" cy="96" r="14" fill="#1e1e1e" stroke="#fff" stroke-width="2.5"/><text x="578" y="101.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<circle cx="284" cy="308" r="14" fill="#1e1e1e" stroke="#fff" stroke-width="2.5"/><text x="284" y="313.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="340" y="108" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="middle">cabo VERMELHO</text>
<text x="450" y="296" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle">cabo PRETO</text>
<rect x="15" y="392" width="650" height="168" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<circle cx="36" cy="410" r="10" fill="#d62828" stroke="#fff" stroke-width="2.5"/><text x="36" y="414.5" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="54" y="415" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">VERMELHO no + da bateria DESCARREGADA.</text>
<circle cx="36" cy="435" r="10" fill="#d62828" stroke="#fff" stroke-width="2.5"/><text x="36" y="439.5" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="54" y="440" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Outra ponta do vermelho no + da bateria BOA.</text>
<circle cx="36" cy="460" r="10" fill="#1e1e1e" stroke="#fff" stroke-width="2.5"/><text x="36" y="464.5" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="54" y="465" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">PRETO no − da bateria BOA.</text>
<circle cx="36" cy="485" r="10" fill="#1e1e1e" stroke="#fff" stroke-width="2.5"/><text x="36" y="489.5" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="54" y="490" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Outra ponta do preto em METAL SEM TINTA do motor do carro parado</text>
<text x="54" y="508" font-size="11.5" fill="#555" text-anchor="start">(não no − da fraca: a faísca pode explodir o gás que sai da bateria).</text>
<text x="28" y="530" font-size="12" fill="#222" text-anchor="start">Ligue o carro bom, espere 3–5 min, dê partida no parado (máx. 10 s, 1 min entre tentativas).</text>
<text x="28" y="550" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start">Para TIRAR: ordem inversa  4 → 3 → 2 → 1.  Nunca deixe as garras se encostarem.</text>
<text x="340" y="580" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="middle">Bateria estufada, rachada, vazando ou congelada: NÃO faça chupeta. Use óculos.</text>
</svg>
