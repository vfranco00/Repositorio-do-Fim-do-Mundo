<text x="28" y="543" font-size="12" fill="#1e1e1e" text-anchor="start">Monte: ponha um pouco de ar na câmara, encaixe o bico primeiro, entre o pneu com as mãos.</text>
<text x="28" y="561" font-size="12" fill="#1e1e1e" text-anchor="start">Confira se a câmara não ficou presa entre o pneu e o aro. Encha até a pressão escrita no pneu.</text>
</svg>
