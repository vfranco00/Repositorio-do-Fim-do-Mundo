<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 586" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="586" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Remendo de câmara de bicicleta, passo a passo</text>
<rect x="15" y="46" width="210" height="228" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
<circle cx="35" cy="68" r="13" fill="#3f6d9e"/><text x="35" y="73" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="55" y="66" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Tire o pneu de um lado</text>
<text x="55" y="82" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">com 2 ou 3 espátulas</text>
<text x="120.0" y="246" font-size="11.5" fill="#333" text-anchor="middle">Não use chave de fenda:</text>
<text x="120.0" y="261" font-size="11.5" fill="#333" text-anchor="middle">ela fura a câmara.</text>
<rect x="235" y="46" width="210" height="228" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
<circle cx="255" cy="68" r="13" fill="#3f6d9e"/><text x="255" y="73" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="275" y="66" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Encha um pouco e ache</text>
<text x="275" y="82" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">o furo: bolhas na água</text>
<text x="340.0" y="246" font-size="11.5" fill="#333" text-anchor="middle">Marque o furo com giz ou</text>
<text x="340.0" y="261" font-size="11.5" fill="#333" text-anchor="middle">caneta. Sem bacia: ouça o ar.</text>
<rect x="455" y="46" width="210" height="228" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
<circle cx="475" cy="68" r="13" fill="#3f6d9e"/><text x="475" y="73" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="495" y="66" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Lixe em volta do furo</text>
<text x="495" y="82" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">(maior que o remendo)</text>
<text x="560.0" y="246" font-size="11.5" fill="#333" text-anchor="middle">Lixa fina, até a borracha</text>
<text x="560.0" y="261" font-size="11.5" fill="#333" text-anchor="middle">ficar opaca e áspera.</text>
<rect x="15" y="284" width="210" height="228" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
<circle cx="35" cy="306" r="13" fill="#3f6d9e"/><text x="35" y="311" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="55" y="304" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Cola em camada fina;</text>
<text x="55" y="320" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">espere ficar FOSCA</text>
<text x="120.0" y="484" font-size="11.5" fill="#333" text-anchor="middle">3–5 min (até 10 no frio).</text>
<text x="120.0" y="499" font-size="11.5" fill="#333" text-anchor="middle">Não sopre, não toque.</text>
<rect x="235" y="284" width="210" height="228" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
<circle cx="255" cy="306" r="13" fill="#3f6d9e"/><text x="255" y="311" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
<text x="275" y="304" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Aperte o remendo do</text>
<text x="275" y="320" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">centro para as bordas</text>
<text x="340.0" y="484" font-size="11.5" fill="#333" text-anchor="middle">Aperte forte 1–2 min.</text>
<text x="340.0" y="499" font-size="11.5" fill="#333" text-anchor="middle">Tire o plástico de cima depois.</text>
<rect x="455" y="284" width="210" height="228" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
<circle cx="475" cy="306" r="13" fill="#3f6d9e"/><text x="475" y="311" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
<text x="495" y="304" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Ache o espinho no pneu</text>
<text x="495" y="320" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">antes de montar</text>
<text x="560.0" y="484" font-size="11.5" fill="#333" text-anchor="middle">Passe a mão DEVAGAR por</text>
<text x="560.0" y="499" font-size="11.5" fill="#333" text-anchor="middle">dentro do pneu e do aro.</text>
