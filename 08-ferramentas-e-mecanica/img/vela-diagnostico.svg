<text x="580" y="252" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">Branca, com</text>
<text x="580" y="268" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">bolinhas</text>
<rect x="502" y="278" width="156" height="82" rx="7" fill="#fff" stroke="#b3001b" stroke-width="2"/>
<text x="580" y="296" font-size="13" fill="#b3001b" font-weight="bold" text-anchor="middle">Mistura POBRE</text>
<text x="580" y="313" font-size="11.5" fill="#222" text-anchor="middle">superaquecendo:</text>
<text x="580" y="329" font-size="11.5" fill="#222" text-anchor="middle">entrada de ar, gicleur</text>
<text x="580" y="345" font-size="11.5" fill="#222" text-anchor="middle">entupido. PARE!</text>
<rect x="15" y="372" width="650" height="86" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="28" y="393" font-size="12" fill="#1e1e1e" text-anchor="start">Folga entre os eletrodos (meça com calibre de lâminas): motores pequenos 0,5–0,8 mm;</text>
<text x="28" y="411" font-size="12" fill="#1e1e1e" text-anchor="start">carros 0,8–1,1 mm (veja o manual ou a etiqueta). Limpe com escova de latão, sem lixa grossa.</text>
<text x="28" y="429" font-size="12" fill="#1e1e1e" text-anchor="start">Aperto da vela nova com anel: à mão até encostar + 1/2 volta. Vela já usada: + 1/8 de volta.</text>
<text x="28" y="447" font-size="12" fill="#1e1e1e" text-anchor="start">Eletrodo gasto e arredondado, isolador trincado: troque a vela.</text>
