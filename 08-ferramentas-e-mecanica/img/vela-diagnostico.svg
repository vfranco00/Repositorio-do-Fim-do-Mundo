<text x="416" y="268" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">e oleosa</text>
<rect x="338" y="278" width="156" height="82" rx="7" fill="#fff" stroke="#a35a00" stroke-width="2"/>
<text x="416" y="296" font-size="13" fill="#a35a00" font-weight="bold" text-anchor="middle">ÓLEO demais</text>
<text x="416" y="313" font-size="11.5" fill="#222" text-anchor="middle">muito óleo na</text>
<text x="416" y="329" font-size="11.5" fill="#222" text-anchor="middle">mistura 2T, anéis</text>
<text x="416" y="345" font-size="11.5" fill="#222" text-anchor="middle">gastos, afogado</text>
