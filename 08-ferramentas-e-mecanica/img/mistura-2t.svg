<text x="32" y="158" font-size="9.5" fill="#444" text-anchor="start">motores antigos, alguns</text>
<text x="32" y="169" font-size="9.5" fill="#444" text-anchor="start">rabetas e motos 2T</text>
<text x="229.0" y="144" font-size="19" fill="#1e1e1e" font-weight="bold" text-anchor="middle">20</text>
