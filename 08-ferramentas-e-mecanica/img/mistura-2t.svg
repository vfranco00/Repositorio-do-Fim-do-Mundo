<text x="32" y="224" font-size="9.5" fill="#444" text-anchor="start">várias roçadeiras e</text>
<text x="32" y="235" font-size="9.5" fill="#444" text-anchor="start">motosserras de entrada</text>
<text x="229.0" y="210" font-size="19" fill="#1e1e1e" font-weight="bold" text-anchor="middle">12,5</text>
<text x="229.0" y="228" font-size="10.5" fill="#444" text-anchor="middle">mL de óleo</text>
<text x="307.0" y="210" font-size="19" fill="#1e1e1e" font-weight="bold" text-anchor="middle">25</text>
<text x="307.0" y="228" font-size="10.5" fill="#444" text-anchor="middle">mL de óleo</text>
<text x="385.0" y="210" font-size="19" fill="#1e1e1e" font-weight="bold" text-anchor="middle">50</text>
<text x="385.0" y="228" font-size="10.5" fill="#444" text-anchor="middle">mL de óleo</text>
<text x="463.0" y="210" font-size="19" fill="#1e1e1e" font-weight="bold" text-anchor="middle">125</text>
<text x="463.0" y="228" font-size="10.5" fill="#444" text-anchor="middle">mL de óleo</text>
