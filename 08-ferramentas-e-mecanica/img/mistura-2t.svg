<rect x="20" y="246" width="638" height="60" fill="#e3f1e6" stroke="#1d6b2c" stroke-width="1.5" rx="6"/>
<text x="32" y="274" font-size="22" fill="#1d6b2c" font-weight="bold" text-anchor="start">1:50</text>
<text x="32" y="290" font-size="9.5" fill="#444" text-anchor="start">maioria das motosserras e</text>
<text x="32" y="301" font-size="9.5" fill="#444" text-anchor="start">roçadeiras atuais</text>
<text x="229.0" y="276" font-size="19" fill="#1e1e1e" font-weight="bold" text-anchor="middle">10</text>
<text x="229.0" y="294" font-size="10.5" fill="#444" text-anchor="middle">mL de óleo</text>
<text x="307.0" y="276" font-size="19" fill="#1e1e1e" font-weight="bold" text-anchor="middle">20</text>
<text x="307.0" y="294" font-size="10.5" fill="#444" text-anchor="middle">mL de óleo</text>
<text x="385.0" y="276" font-size="19" fill="#1e1e1e" font-weight="bold" text-anchor="middle">40</text>
<text x="385.0" y="294" font-size="10.5" fill="#444" text-anchor="middle">mL de óleo</text>
<text x="463.0" y="276" font-size="19" fill="#1e1e1e" font-weight="bold" text-anchor="middle">100</text>
<text x="463.0" y="294" font-size="10.5" fill="#444" text-anchor="middle">mL de óleo</text>
<text x="541.0" y="276" font-size="19" fill="#1e1e1e" font-weight="bold" text-anchor="middle">200</text>
<text x="541.0" y="294" font-size="10.5" fill="#444" text-anchor="middle">mL de óleo</text>
<text x="619.0" y="276" font-size="19" fill="#1e1e1e" font-weight="bold" text-anchor="middle">400</text>
<text x="619.0" y="294" font-size="10.5" fill="#444" text-anchor="middle">mL de óleo</text>
<line x1="186" y1="252" x2="186" y2="300" stroke="#1d6b2c" stroke-width="1"/>
<text x="340" y="332" font-size="12" fill="#222" font-weight="bold" text-anchor="middle">Conta: mL de óleo = litros × 1.000 ÷ número da proporção   (ex.: 5 L a 1:40 → 5.000 ÷ 40 = 125 mL)</text>
<rect x="15" y="348" width="650" height="150" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
<path d="M40 388 L60 378 L110 378 L110 478 L40 478 Z" fill="#d62828" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="48" y="366" width="16" height="16" fill="#333" stroke="#1e1e1e" stroke-width="2"/>
<rect x="50" y="418" width="52" height="30" fill="#fff" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="76" y="431" font-size="9" fill="#1e1e1e" font-weight="bold" text-anchor="middle">MISTURA</text>
<text x="76" y="443" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle">1:50</text>
<rect x="130" y="400" width="80" height="18" rx="3" fill="#eef5ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="132" y="402" width="48" height="14" fill="#c9a227"/>
<line x1="140" y1="400" x2="140" y2="407" stroke="#1e1e1e" stroke-width="1"/>
