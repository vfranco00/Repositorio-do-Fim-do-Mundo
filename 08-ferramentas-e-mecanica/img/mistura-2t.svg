<line x1="170" y1="400" x2="170" y2="407" stroke="#1e1e1e" stroke-width="1"/>
<line x1="180" y1="400" x2="180" y2="407" stroke="#1e1e1e" stroke-width="1"/>
<line x1="190" y1="400" x2="190" y2="407" stroke="#1e1e1e" stroke-width="1"/>
<line x1="200" y1="400" x2="200" y2="407" stroke="#1e1e1e" stroke-width="1"/>
<rect x="210" y="406" width="12" height="6" fill="#ddd" stroke="#1e1e1e" stroke-width="1.5"/>
<line x1="112" y1="409" x2="130" y2="409" stroke="#1e1e1e" stroke-width="3"/>
<rect x="104" y="396" width="8" height="26" fill="#ddd" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="170" y="440.0" font-size="10.5" fill="#444" text-anchor="middle">seringa ou copo</text>
<text x="170" y="453.65" font-size="10.5" fill="#444" text-anchor="middle">dosador só para</text>
<text x="170" y="467.3" font-size="10.5" fill="#444" text-anchor="middle">o óleo 2T</text>
<text x="250" y="372" font-size="12" fill="#222" text-anchor="start">1. Galão limpo, só para mistura, com a proporção escrita nele.</text>
<text x="250" y="390" font-size="12" fill="#222" text-anchor="start">2. Ponha METADE da gasolina, depois TODO o óleo medido.</text>
<text x="250" y="408" font-size="12" fill="#222" text-anchor="start">3. Feche e agite. Complete a gasolina e agite de novo.</text>
<text x="250" y="426" font-size="12" fill="#222" text-anchor="start">4. Agite também antes de cada abastecimento.</text>
<text x="250" y="444" font-size="12" fill="#222" text-anchor="start">Óleo próprio para 2 tempos (JASO FC/FD ou API TC).</text>
<text x="250" y="462" font-size="12" fill="#222" text-anchor="start">Nunca gasolina pura num 2T: funde o motor em minutos.</text>
<text x="250" y="480" font-size="12" fill="#222" text-anchor="start">Mistura velha (mais de 30 dias) estraga carburador e motor.</text>
</svg>
