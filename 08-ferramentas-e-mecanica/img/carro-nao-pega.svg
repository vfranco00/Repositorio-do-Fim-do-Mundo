<polygon points="478,441.04999999999995 490,441.04999999999995 484,448.04999999999995" fill="#555"/>
<line x1="626" y1="380.2" x2="626" y2="442.04999999999995" stroke="#555" stroke-width="2.5"/>
<polygon points="620,441.04999999999995 632,441.04999999999995 626,448.04999999999995" fill="#555"/>
<text x="572" y="394.2" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="middle">não</text>
<text x="644" y="394.2" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="middle">sim</text>
<rect x="426" y="449.04999999999995" width="116" height="119" rx="9" fill="#fff4e5" stroke="#ef8a2b" stroke-width="2"/><text x="484.0" y="467.54999999999995" font-size="11.5" fill="#1e1e1e" text-anchor="middle">SEM FAÍSCA:</text>
<text x="484.0" y="482.49999999999994" font-size="11.5" fill="#1e1e1e" text-anchor="middle">bobina, cabos</text>
<text x="484.0" y="497.44999999999993" font-size="11.5" fill="#1e1e1e" text-anchor="middle">de vela, vela,</text>
<text x="484.0" y="512.4" font-size="11.5" fill="#1e1e1e" text-anchor="middle">platinado,</text>
<text x="484.0" y="527.3499999999999" font-size="11.5" fill="#1e1e1e" text-anchor="middle">sensor de</text>
<text x="484.0" y="542.3" font-size="11.5" fill="#1e1e1e" text-anchor="middle">rotação,</text>
<text x="484.0" y="557.25" font-size="11.5" fill="#1e1e1e" text-anchor="middle">fusível</text>
<rect x="548" y="449.04999999999995" width="120" height="119" rx="9" fill="#fff4e5" stroke="#ef8a2b" stroke-width="2"/><text x="608.0" y="467.54999999999995" font-size="11.5" fill="#1e1e1e" text-anchor="middle">COM FAÍSCA:</text>
<text x="608.0" y="482.49999999999994" font-size="11.5" fill="#1e1e1e" text-anchor="middle">afogado? (pise</text>
<text x="608.0" y="497.44999999999993" font-size="11.5" fill="#1e1e1e" text-anchor="middle">o acelerador</text>
<text x="608.0" y="512.4" font-size="11.5" fill="#1e1e1e" text-anchor="middle">todo e dê</text>
<text x="608.0" y="527.3499999999999" font-size="11.5" fill="#1e1e1e" text-anchor="middle">partida 5 s)</text>
<text x="608.0" y="542.3" font-size="11.5" fill="#1e1e1e" text-anchor="middle">alarme ou</text>
<text x="608.0" y="557.25" font-size="11.5" fill="#1e1e1e" text-anchor="middle">imobilizador?</text>
<rect x="12" y="577.6999999999999" width="656" height="74" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
<text x="24" y="597.6999999999999" font-size="11.5" fill="#222" text-anchor="start">Flex com álcool no frio: encha o tanquinho de partida (gasolina). Diesel: troque o filtro e sangre o ar.</text>
<text x="24" y="615.6999999999999" font-size="11.5" fill="#222" text-anchor="start">Teste de faísca: segure o cabo com alicate de cabo isolado, a rosca da vela encostada no motor.</text>
<text x="24" y="633.6999999999999" font-size="11.5" fill="#222" text-anchor="start">Faísca AZUL e forte = boa; amarela, fraca ou nenhuma = problema na ignição.</text>
</svg>
