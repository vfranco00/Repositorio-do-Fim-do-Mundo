<polygon points="313.0,122 325.0,122 319.0,132" fill="#555"/>
<rect x="226" y="132" width="186" height="45" rx="9" fill="#f2f2f2" stroke="#777" stroke-width="2"/><text x="319.0" y="151.0" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">Gira DEVAGAR</text>
<text x="319.0" y="166.6" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">(rrrr... rrrr...)</text>
<path d="M340 94 L340 106 L547.0 106 L547.0 128" fill="none" stroke="#555" stroke-width="2.5"/>
