<text x="547.0" y="166.6" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">mas não pega</text>
<line x1="112.0" y1="184" x2="112.0" y2="196.0" stroke="#555" stroke-width="2.5"/><polygon points="112.0,202 106.8,191.2 117.2,191.2" fill="#555"/>
<rect x="12" y="206" width="200" height="45" rx="9" fill="#eef5ff" stroke="#3f6d9e" stroke-width="2"/><text x="112.0" y="225.0" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">Acenda o farol.</text>
<text x="112.0" y="240.6" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">A luz fica forte?</text>
<line x1="62" y1="251.2" x2="62" y2="275.2" stroke="#555" stroke-width="2.5"/>
<line x1="162" y1="251.2" x2="162" y2="275.2" stroke="#555" stroke-width="2.5"/>
<text x="34" y="267.2" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="middle">fraca</text>
<text x="188" y="267.2" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="middle">forte</text>
<rect x="12" y="277.2" width="98" height="119" rx="9" fill="#fff4e5" stroke="#ef8a2b" stroke-width="2"/><text x="61.0" y="295.7" font-size="11.5" fill="#1e1e1e" text-anchor="middle">BATERIA</text>
<text x="61.0" y="310.65" font-size="11.5" fill="#1e1e1e" text-anchor="middle">fraca ou</text>
<text x="61.0" y="325.59999999999997" font-size="11.5" fill="#1e1e1e" text-anchor="middle">terminal</text>
<text x="61.0" y="340.55" font-size="11.5" fill="#1e1e1e" text-anchor="middle">solto/sujo:</text>
<text x="61.0" y="355.5" font-size="11.5" fill="#1e1e1e" text-anchor="middle">limpe,</text>
<text x="61.0" y="370.45" font-size="11.5" fill="#1e1e1e" text-anchor="middle">aperte,</text>
<text x="61.0" y="385.4" font-size="11.5" fill="#1e1e1e" text-anchor="middle">chupeta</text>
<rect x="114" y="277.2" width="98" height="134" rx="9" fill="#fff4e5" stroke="#ef8a2b" stroke-width="2"/><text x="163.0" y="295.7" font-size="11.5" fill="#1e1e1e" text-anchor="middle">MOTOR DE</text>
<text x="163.0" y="310.65" font-size="11.5" fill="#1e1e1e" text-anchor="middle">ARRANQUE,</text>
<text x="163.0" y="325.59999999999997" font-size="11.5" fill="#1e1e1e" text-anchor="middle">relé ou cabo</text>
<text x="163.0" y="340.55" font-size="11.5" fill="#1e1e1e" text-anchor="middle">de massa:</text>
<text x="163.0" y="355.5" font-size="11.5" fill="#1e1e1e" text-anchor="middle">bata de leve</text>
<text x="163.0" y="370.45" font-size="11.5" fill="#1e1e1e" text-anchor="middle">nele com o</text>
<text x="163.0" y="385.4" font-size="11.5" fill="#1e1e1e" text-anchor="middle">cabo do</text>
<text x="163.0" y="400.35" font-size="11.5" fill="#1e1e1e" text-anchor="middle">martelo</text>
<rect x="12" y="418.8" width="200" height="44" rx="9" fill="#eaf6ec" stroke="#2b8a3e" stroke-width="2"/><text x="112.0" y="437.3" font-size="11.5" fill="#1e1e1e" text-anchor="middle">Carro manual: tente</text>
<text x="112.0" y="452.25" font-size="11.5" fill="#1e1e1e" text-anchor="middle">pegar no TRANCO</text>
<line x1="319.0" y1="184" x2="319.0" y2="196.0" stroke="#555" stroke-width="2.5"/><polygon points="319.0,202 313.8,191.2 324.2,191.2" fill="#555"/>
<rect x="226" y="206" width="186" height="170" rx="9" fill="#fff4e5" stroke="#ef8a2b" stroke-width="2"/><text x="319.0" y="225.0" font-size="12" fill="#1e1e1e" text-anchor="middle">Bateria fraca ou</text>
<text x="319.0" y="240.6" font-size="12" fill="#1e1e1e" text-anchor="middle">terminal com zinabre</text>
<text x="319.0" y="256.2" font-size="12" fill="#1e1e1e" text-anchor="middle">(pó branco/verde):</text>
<text x="319.0" y="271.8" font-size="12" fill="#1e1e1e" text-anchor="middle">limpe com água e</text>
<text x="319.0" y="287.4" font-size="12" fill="#1e1e1e" text-anchor="middle">bicarbonato, aperte,</text>
<text x="319.0" y="303.0" font-size="12" fill="#1e1e1e" text-anchor="middle">faça chupeta.</text>
<text x="319.0" y="318.6" font-size="12" fill="#1e1e1e" text-anchor="middle"></text>
<text x="319.0" y="334.20000000000005" font-size="12" fill="#1e1e1e" text-anchor="middle">No frio, óleo grosso</text>
<text x="319.0" y="349.8" font-size="12" fill="#1e1e1e" text-anchor="middle">e gasolina velha</text>
<text x="319.0" y="365.4" font-size="12" fill="#1e1e1e" text-anchor="middle">pioram a partida.</text>
<line x1="547.0" y1="184" x2="547.0" y2="196.0" stroke="#555" stroke-width="2.5"/><polygon points="547.0,202 541.8,191.2 552.2,191.2" fill="#555"/>
<rect x="426" y="206" width="242" height="76" rx="9" fill="#eef5ff" stroke="#3f6d9e" stroke-width="2"/><text x="547.0" y="225.0" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">Tem COMBUSTÍVEL?</text>
<text x="547.0" y="240.6" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">(marcador; cheiro de gasolina no</text>
<text x="547.0" y="256.2" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">escapamento; a bomba zumbe 2 s</text>
<text x="547.0" y="271.8" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle">ao ligar a chave)</text>
<line x1="466" y1="282.4" x2="466" y2="304.4" stroke="#555" stroke-width="2.5"/>
<line x1="601" y1="282.4" x2="601" y2="304.4" stroke="#555" stroke-width="2.5"/>
<text x="442" y="297.4" font-size="11.5" fill="#b3001b" font-weight="bold" text-anchor="middle">não</text>
<text x="626" y="297.4" font-size="11.5" fill="#2b8a3e" font-weight="bold" text-anchor="middle">sim</text>
<rect x="426" y="306.4" width="92" height="119" rx="9" fill="#fff4e5" stroke="#ef8a2b" stroke-width="2"/><text x="472.0" y="324.9" font-size="11.5" fill="#1e1e1e" text-anchor="middle">Abasteça.</text>
<text x="472.0" y="339.84999999999997" font-size="11.5" fill="#1e1e1e" text-anchor="middle">Fusível e</text>
<text x="472.0" y="354.79999999999995" font-size="11.5" fill="#1e1e1e" text-anchor="middle">relé da</text>
<text x="472.0" y="369.75" font-size="11.5" fill="#1e1e1e" text-anchor="middle">bomba.</text>
<text x="472.0" y="384.7" font-size="11.5" fill="#1e1e1e" text-anchor="middle">Filtro.</text>
<text x="472.0" y="399.65" font-size="11.5" fill="#1e1e1e" text-anchor="middle">Água no</text>
<text x="472.0" y="414.59999999999997" font-size="11.5" fill="#1e1e1e" text-anchor="middle">tanque?</text>
<rect x="524" y="306.4" width="144" height="74" rx="9" fill="#eef5ff" stroke="#3f6d9e" stroke-width="2"/><text x="596.0" y="324.9" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle">Tem FAÍSCA?</text>
<text x="596.0" y="339.84999999999997" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle">(teste da vela</text>
<text x="596.0" y="354.79999999999995" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle">encostada no</text>
<text x="596.0" y="369.75" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle">metal do motor)</text>
