<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Carro não pega: o que verificar</text>
<rect x="170" y="46" width="340" height="48" rx="9" fill="#eef5ff" stroke="#3f6d9e" stroke-width="2"/><text x="340.0" y="66.0" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle">Gire a chave para dar partida.</text>
<text x="340.0" y="82.9" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle">O motor de arranque gira o motor?</text>
