<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 610" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="610" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Afiação: ângulos e como segurar na pedra</text>
<text x="340" y="56" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">Ângulo do fio (corte da lâmina visto pela ponta)</text>
<rect x="15" y="66" width="210" height="250" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/><text x="120" y="88" font-size="13.5" fill="#222" font-weight="bold" text-anchor="middle">FACA</text>
<polygon points="96.1,104 143.9,104 143.9,170.2 120,236 96.1,170.2" fill="#b8c2cc" stroke="#1e1e1e" stroke-width="2.5"/>
<line x1="120" y1="140" x2="120" y2="244" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M120.0 190.0 A 46 46 0 0 1 135.7 192.8" fill="none" stroke="#d62828" stroke-width="2.5"/>
<text x="142" y="186" font-size="14" fill="#b3001b" font-weight="bold" text-anchor="start">20°</text>
<text x="120" y="258" font-size="11" fill="#555" text-anchor="middle">fio</text>
<text x="120" y="280.0" font-size="12" fill="#222" text-anchor="middle">15–20° de cada lado</text>
<text x="120" y="295.6" font-size="12" fill="#222" text-anchor="middle">(30–40° no total)</text>
<text x="120" y="308" font-size="11" fill="#555" text-anchor="middle">corta fino, lasca se bater</text>
<rect x="235" y="66" width="210" height="250" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/><text x="340" y="88" font-size="13.5" fill="#222" font-weight="bold" text-anchor="middle">FACÃO e MACHADO</text>
<polygon points="292,104 388,104 371.0,177.7 340,236 309.0,177.7" fill="#b8c2cc" stroke="#1e1e1e" stroke-width="2.5"/>
<line x1="340" y1="140" x2="340" y2="244" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M340.0 192.0 A 44 44 0 0 1 360.7 197.2" fill="none" stroke="#d62828" stroke-width="2.5"/>
<text x="366" y="190" font-size="14" fill="#b3001b" font-weight="bold" text-anchor="start">25–30°</text>
<text x="340" y="258" font-size="11" fill="#555" text-anchor="middle">fio</text>
<text x="340" y="280.0" font-size="12" fill="#222" text-anchor="middle">25–30° de cada lado</text>
<text x="340" y="295.6" font-size="12" fill="#222" text-anchor="middle">(50–60° no total)</text>
<text x="340" y="308" font-size="11" fill="#555" text-anchor="middle">fio mais grosso aguenta pancada</text>
<rect x="455" y="66" width="210" height="250" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/><text x="560" y="88" font-size="13.5" fill="#222" font-weight="bold" text-anchor="middle">ENXADA e PÁ</text>
<polygon points="543.0,104 577.0,104 577.0,187.4 543.0,236" fill="#b8c2cc" stroke="#1e1e1e" stroke-width="2.5"/>
<line x1="543.0" y1="140" x2="543.0" y2="244" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M543.0 184.0 A 52 52 0 0 1 572.8 193.4" fill="none" stroke="#d62828" stroke-width="2.5"/>
<text x="583.0" y="214" font-size="14" fill="#b3001b" font-weight="bold" text-anchor="start">30–40°</text>
<text x="535.0" y="150.0" font-size="11" fill="#555" text-anchor="end">lado</text>
<text x="535.0" y="164.3" font-size="11" fill="#555" text-anchor="end">liso</text>
<text x="585.0" y="118.0" font-size="11" fill="#555" text-anchor="start">chanfro</text>
<text x="585.0" y="132.3" font-size="11" fill="#555" text-anchor="start">(lado</text>
<text x="585.0" y="146.6" font-size="11" fill="#555" text-anchor="start">de dentro,</text>
<text x="585.0" y="160.9" font-size="11" fill="#555" text-anchor="start">do cabo)</text>
<text x="543.0" y="258" font-size="11" fill="#555" text-anchor="middle">fio</text>
<text x="560" y="280.0" font-size="12" fill="#222" text-anchor="middle">30–40° num lado só</text>
<text x="560" y="295.6" font-size="12" fill="#222" text-anchor="middle">(siga o chanfro de fábrica)</text>
<text x="560" y="308" font-size="11" fill="#555" text-anchor="middle">lime só o chanfro</text>
<text x="20" y="344" font-size="14" fill="#222" font-weight="bold" text-anchor="start">Como segurar a faca na pedra (visto pela ponta da faca)</text>
<rect x="30" y="440" width="370" height="38" rx="4" fill="#8f8f8f" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="30" y="440" width="370" height="8" fill="#a8a8a8"/>
<text x="215" y="468" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">pedra molhada (água ou óleo)</text>
<polygon points="150,440 288.9,383.1 291.4,389.8" fill="#b8c2cc" stroke="#1e1e1e" stroke-width="2.5"/>
<line x1="150" y1="440" x2="320" y2="440" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M223.3 413.3 A 78 78 0 0 1 228.0 440.0" fill="none" stroke="#d62828" stroke-width="2.5"/>
<text x="236" y="432" font-size="14" fill="#b3001b" font-weight="bold" text-anchor="start">20°</text>
<line x1="305.0" y1="388.7" x2="305.0" y2="440" stroke="#2b8a3e" stroke-width="2"/>
<line x1="299.0" y1="388.7" x2="311.0" y2="388.7" stroke="#2b8a3e" stroke-width="2"/>
<text x="314.95389311788625" y="396.6969785011497" font-size="11.5" fill="#1d6b2c" font-weight="bold" text-anchor="start">dorso levantado</text>
<text x="314.95389311788625" y="411.6469785011497" font-size="11.5" fill="#1d6b2c" font-weight="bold" text-anchor="start">≈ 1/3 da largura</text>
<text x="314.95389311788625" y="426.5969785011497" font-size="11.5" fill="#1d6b2c" font-weight="bold" text-anchor="start">da lâmina</text>
<text x="40" y="372.0" font-size="11.5" fill="#555" text-anchor="start">fio</text>
<text x="40" y="386.95" font-size="11.5" fill="#555" text-anchor="start">encostado</text>
<line x1="70" y1="392" x2="146" y2="436" stroke="#555" stroke-width="1.5"/>
<line x1="150" y1="500" x2="66.0" y2="500.0" stroke="#555" stroke-width="3"/><polygon points="60,500 70.8,494.8 70.8,505.2" fill="#555"/>
<text x="160" y="498.0" font-size="11.5" fill="#333" text-anchor="start">empurre o fio, como quem tira</text>
<text x="160" y="512.95" font-size="11.5" fill="#333" text-anchor="start">uma fatia fina da pedra</text>
<rect x="425" y="356" width="240" height="156" rx="8" fill="#eef5ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="545" y="376" font-size="12.5" fill="#1e3f66" font-weight="bold" text-anchor="middle">Truque para achar 20°</text>
<line x1="439" y1="452" x2="509" y2="452" stroke="#555" stroke-width="5"/>
<line x1="445" y1="452" x2="445.0" y2="402.0" stroke="#1e1e1e" stroke-width="4" stroke-linecap="round"/>
<text x="473" y="474" font-size="10.5" fill="#222" text-anchor="middle">90°</text>
<line x1="515" y1="452" x2="585" y2="452" stroke="#555" stroke-width="5"/>
<line x1="521" y1="452" x2="556.4" y2="416.6" stroke="#1e1e1e" stroke-width="4" stroke-linecap="round"/>
<text x="549" y="474" font-size="10.5" fill="#222" text-anchor="middle">metade: 45°</text>
<line x1="591" y1="452" x2="661" y2="452" stroke="#555" stroke-width="5"/>
<line x1="597" y1="452" x2="643.4" y2="433.3" stroke="#1e1e1e" stroke-width="4" stroke-linecap="round"/>
<text x="625" y="474" font-size="10.5" fill="#222" text-anchor="middle">metade: ~22°</text>
<text x="545" y="498" font-size="11.5" fill="#1e3f66" font-weight="bold" text-anchor="middle">baixe só mais um pouquinho = 20°</text>
<rect x="15" y="524" width="650" height="76" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="28" y="545" font-size="12" fill="#222" text-anchor="start">1. Lado GROSSO da pedra até sentir rebarba (fio de arame) em TODO o comprimento, do lado oposto.</text>
<text x="28" y="563" font-size="12" fill="#222" text-anchor="start">2. Vire e repita do outro lado. 3. Lado FINO, mesmo ângulo, passadas leves e alternadas.</text>
<text x="28" y="581" font-size="12" fill="#222" text-anchor="start">4. Tire a rebarba com 3–5 passadas bem leves de cada lado. Mantenha SEMPRE o mesmo ângulo.</text>
</svg>
