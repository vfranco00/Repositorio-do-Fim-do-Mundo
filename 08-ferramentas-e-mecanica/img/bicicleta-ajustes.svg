<circle cx="38" cy="490" r="11" fill="#ef8a2b"/><text x="38" y="495" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="56" y="494" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Pneu: pressão escrita na lateral</text>
<text x="56" y="509" font-size="11" fill="#333" text-anchor="start">(ex.: 40–65 psi); com carga, perto do máximo</text>
<circle cx="38" cy="532" r="11" fill="#ef8a2b"/><text x="38" y="537" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="56" y="536" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Freio: sapata a 1–2 mm do aro,</text>
<text x="56" y="551" font-size="11" fill="#333" text-anchor="start">sem tocar no pneu; manete firme antes da metade</text>
<circle cx="38" cy="574" r="11" fill="#ef8a2b"/><text x="38" y="579" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="56" y="578" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Corrente: limpe e lubrifique a cada</text>
<text x="56" y="593" font-size="11" fill="#333" text-anchor="start">100–200 km; sem marchas, folga de 1–1,5 cm</text>
<circle cx="38" cy="616" r="11" fill="#ef8a2b"/><text x="38" y="621" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="56" y="620" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Pedal ESQUERDO tem rosca INVERTIDA</text>
<text x="56" y="635" font-size="11" fill="#333" text-anchor="start">(aperta girando para trás da bicicleta)</text>
<circle cx="368" cy="490" r="11" fill="#ef8a2b"/><text x="368" y="495" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
<text x="386" y="494" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Raios: todos com o mesmo aperto</text>
<text x="386" y="509" font-size="11" fill="#333" text-anchor="start">(toque: mesmo som); aro sem empeno</text>
<circle cx="368" cy="532" r="11" fill="#ef8a2b"/><text x="368" y="537" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
<text x="386" y="536" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Cubos: balance a roda: sem folga,</text>
<text x="386" y="551" font-size="11" fill="#333" text-anchor="start">girando livre e sem ranger</text>
<circle cx="368" cy="574" r="11" fill="#ef8a2b"/><text x="368" y="579" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">7</text>
<text x="386" y="578" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="start">Selim: pedal embaixo, perna quase</text>
<text x="386" y="593" font-size="11" fill="#333" text-anchor="start">esticada (joelho levemente dobrado)</text>
