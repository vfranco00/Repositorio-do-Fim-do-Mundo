<text x="398" y="100.0" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">Gerador ligado na tomada com</text>
<text x="398" y="116.25" font-size="12.5" fill="#222" font-weight="bold" text-anchor="start">cabo "macho-macho" (cabo suicida):</text>
<text x="398" y="136.0" font-size="12" fill="#222" text-anchor="start">• a energia VOLTA para a rede; o</text>
<text x="398" y="151.6" font-size="12" fill="#222" text-anchor="start">  transformador eleva para milhares de</text>
<text x="398" y="167.2" font-size="12" fill="#222" text-anchor="start">  volts e MATA o eletricista no poste;</text>
<text x="398" y="182.8" font-size="12" fill="#222" text-anchor="start">• quando a luz volta: gerador queima,</text>
<text x="398" y="198.4" font-size="12" fill="#222" text-anchor="start">  fios esquentam, risco de incêndio.</text>
<text x="398" y="216.0" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">Gerador dentro de casa, garagem,</text>
<text x="398" y="231.6" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">varanda fechada ou sob a janela:</text>
<text x="398" y="247.2" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">MONÓXIDO DE CARBONO (sem cheiro)</text>
<text x="398" y="262.8" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">mata quem está dormindo.</text>
