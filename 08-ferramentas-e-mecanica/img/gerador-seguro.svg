<text x="28" y="576" font-size="12" fill="#1e1e1e" text-anchor="start">Chave reversora (instalada por eletricista): DESLIGA a rua antes de ligar o gerador na casa.</text>
<text x="28" y="595" font-size="12" fill="#1e1e1e" text-anchor="start">Sem chave reversora: ligue cada aparelho DIRETO no gerador, com extensão grossa (2,5 mm² ou mais).</text>
<text x="28" y="614" font-size="12" fill="#1e1e1e" text-anchor="start">Detector de CO dentro de casa. Abasteça só com o motor desligado e frio.</text>
