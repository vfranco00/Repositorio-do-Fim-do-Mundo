<text x="244" y="420.95" font-size="11.5" fill="#222" text-anchor="start">longe de portas e janelas</text>
<text x="586" y="410.0" font-size="11" fill="#222" text-anchor="start">coberto,</text>
<text x="586" y="424.3" font-size="11" fill="#222" text-anchor="start">laterais</text>
<text x="586" y="438.6" font-size="11" fill="#222" text-anchor="start">abertas,</text>
<text x="586" y="452.9" font-size="11" fill="#222" text-anchor="start">nunca</text>
<text x="586" y="467.2" font-size="11" fill="#222" text-anchor="start">molhado</text>
<text x="474" y="546" font-size="10.5" fill="#1d6b2c" font-weight="bold" text-anchor="start">haste de terra</text>
