<text x="20" y="486" font-size="12.5" fill="#222" text-anchor="start">Queima: 1) fogo pequeno na boca 2–3 h (secar; até ~100–200 °C); 2) aumente aos poucos por 2–3 h;</text>
<text x="20" y="504" font-size="12.5" fill="#222" text-anchor="start">3) fogo forte 2–4 h até o brilho cereja (800–900 °C); mantenha 30–60 min; 4) feche boca e topo</text>
<text x="20" y="522" font-size="12.5" fill="#222" text-anchor="start">e espere esfriar 12–24 h. Abrir quente racha tudo. Lenha: ~1 a 2 m³ por queima (forno pequeno).</text>
<text x="20" y="540" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start">Cimento comum não aguenta o calor: use tijolo e barro. Afaste de casas e de mato seco.</text>
</svg>
