<text x="380" y="230" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">40–50 cm</text>
<line x1="372" y1="204" x2="372" y2="294" stroke="#222" stroke-width="1.5"/>
<text x="210" y="318" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">≈ 1 m de largura</text>
<text x="14" y="330" font-size="11" fill="#222" font-weight="bold" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">fundo: serragem, palha</text>
<text x="14" y="344" font-size="11" fill="#222" font-weight="bold" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ou esterco seco</text>
<line x1="70" y1="326" x2="96" y2="292" stroke="#555" stroke-width="1.5"/>
<text x="160" y="356" font-size="11" fill="#222" font-weight="bold" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">potes BEM SECOS, de boca para baixo,</text>
<text x="160" y="370" font-size="11" fill="#222" font-weight="bold" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">cobertos de gravetos, casca e esterco seco</text>
<text x="14" y="100" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">pilha de lenha</text>
<text x="14" y="114" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">em forma de oca</text>
<line x1="430" y1="50" x2="430" y2="396" stroke="#ccc" stroke-width="2"/>
<circle cx="452" cy="70" r="12" fill="#1e1e1e"/><text x="452" y="75" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="472" y="75" font-size="13" fill="#222" font-weight="bold" text-anchor="start">Esquente devagar</text>
<text x="446" y="94" font-size="11.5" fill="#222" text-anchor="start">Potes ao lado da fogueira</text><text x="446" y="109" font-size="11.5" fill="#222" text-anchor="start">1–2 h, virando, até ficarem</text><text x="446" y="124" font-size="11.5" fill="#222" text-anchor="start">quentes demais para tocar.</text>
<circle cx="452" cy="152" r="12" fill="#1e1e1e"/><text x="452" y="157" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="472" y="157" font-size="13" fill="#222" font-weight="bold" text-anchor="start">Monte o buraco</text>
<text x="446" y="176" font-size="11.5" fill="#222" text-anchor="start">Fundo com serragem/esterco,</text><text x="446" y="191" font-size="11.5" fill="#222" text-anchor="start">potes, gravetos e lenha por</text><text x="446" y="206" font-size="11.5" fill="#222" text-anchor="start">cima (como no desenho).</text>
<circle cx="452" cy="234" r="12" fill="#1e1e1e"/><text x="452" y="239" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="472" y="239" font-size="13" fill="#222" font-weight="bold" text-anchor="start">Queime 2–4 h</text>
<text x="446" y="258" font-size="11.5" fill="#222" text-anchor="start">Mantenha fogo forte. Os</text><text x="446" y="273" font-size="11.5" fill="#222" text-anchor="start">potes devem brilhar vermelho</text><text x="446" y="288" font-size="11.5" fill="#222" text-anchor="start">escuro: 600–800 °C.</text>
<circle cx="452" cy="316" r="12" fill="#1e1e1e"/><text x="452" y="321" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
<text x="472" y="321" font-size="13" fill="#222" font-weight="bold" text-anchor="start">Abafe e espere</text>
<text x="446" y="340" font-size="11.5" fill="#222" text-anchor="start">Cubra com cacos, chapas e</text><text x="446" y="355" font-size="11.5" fill="#222" text-anchor="start">terra. Espere esfriar sozinho</text><text x="446" y="370" font-size="11.5" fill="#222" text-anchor="start">(12 h ou mais).</text>
<rect x="8" y="404" width="664" height="50" rx="8" fill="#fdecec" stroke="#d62828" stroke-width="1.5"/>
<text x="20" y="424" font-size="12.5" fill="#b3001b" font-weight="bold" text-anchor="start">Pote úmido explode no fogo: seque 1–3 semanas à sombra. Perdas de 10–30% são normais.</text>
<text x="20" y="442" font-size="12.5" fill="#222" text-anchor="start">Abaixo de ~600 °C o barro NÃO vira cerâmica (desmancha na água). Teste um caco fervendo.</text>
</svg>
