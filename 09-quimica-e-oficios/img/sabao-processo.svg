<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 604" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="680" height="604" fill="#fff"/>
<text x="340.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Sabão em barra com soda: passo a passo</text>
<rect x="8" y="44" width="664" height="44" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="340" y="62" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Receita base (óleo de soja, girassol, milho ou de fritura bem coado):</text>
<text x="340" y="80" font-size="13.5" fill="#b3001b" font-weight="bold" text-anchor="middle">1 kg de óleo  +  130 g de soda cáustica (escamas 97–99%)  +  350 mL de água</text>
<rect x="8" y="98" width="212" height="182" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/><circle cx="26" cy="118" r="12" fill="#1e1e1e"/><text x="26" y="123" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="44" y="123" font-size="13.5" fill="#222" font-weight="bold" text-anchor="start">Pese tudo</text><rect x="64" y="194" width="100" height="18" rx="4" fill="#bfc6cc" stroke="#1e1e1e" stroke-width="2"/><rect x="100" y="198" width="28" height="10" rx="2" fill="#dff3d9" stroke="#1e1e1e" stroke-width="1.2"/><text x="114" y="207" font-size="8" fill="#222" font-weight="bold" text-anchor="middle">130 g</text><path d="M74 190 L 154 190 L 144 162 L 84 162 Z" fill="#fff" stroke="#1e1e1e" stroke-width="2"/><rect x="94" y="176" width="7" height="5" rx="1.5" fill="#f0f0f0" stroke="#777" stroke-width="1"/><rect x="104" y="176" width="7" height="5" rx="1.5" fill="#f0f0f0" stroke="#777" stroke-width="1"/><rect x="114" y="176" width="7" height="5" rx="1.5" fill="#f0f0f0" stroke="#777" stroke-width="1"/><rect x="124" y="176" width="7" height="5" rx="1.5" fill="#f0f0f0" stroke="#777" stroke-width="1"/><rect x="134" y="176" width="7" height="5" rx="1.5" fill="#f0f0f0" stroke="#777" stroke-width="1"/><rect x="94" y="169" width="7" height="5" rx="1.5" fill="#f0f0f0" stroke="#777" stroke-width="1"/><rect x="104" y="169" width="7" height="5" rx="1.5" fill="#f0f0f0" stroke="#777" stroke-width="1"/><rect x="114" y="169" width="7" height="5" rx="1.5" fill="#f0f0f0" stroke="#777" stroke-width="1"/><rect x="124" y="169" width="7" height="5" rx="1.5" fill="#f0f0f0" stroke="#777" stroke-width="1"/><text x="18" y="226" font-size="11.5" fill="#222" text-anchor="start">Balança de cozinha. Óleo de</text><text x="18" y="241" font-size="11.5" fill="#222" text-anchor="start">fritura: coe em pano e deixe</text><text x="18" y="256" font-size="11.5" fill="#222" text-anchor="start">assentar; use só o de cima.</text>
<rect x="234" y="98" width="212" height="182" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/><circle cx="252" cy="118" r="12" fill="#1e1e1e"/><text x="252" y="123" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="270" y="123" font-size="13.5" fill="#222" font-weight="bold" text-anchor="start">SODA NA ÁGUA</text><path d="M294 154 L 304 214 L 376 214 L 386 154 Z" fill="#fff" stroke="#1e1e1e" stroke-width="2.5"/><path d="M297 172 L 304 214 L 376 214 L 383 172 Z" fill="#cfe6fb" stroke="none"/><path d="M402 136 l 20 -6 l 4 16 l -20 6 Z" fill="#eee" stroke="#1e1e1e" stroke-width="2"/><rect x="384" y="150" width="5" height="4" rx="1" fill="#fafafa" stroke="#777" stroke-width="1"/><rect x="377" y="155" width="5" height="4" rx="1" fill="#fafafa" stroke="#777" stroke-width="1"/><rect x="370" y="160" width="5" height="4" rx="1" fill="#fafafa" stroke="#777" stroke-width="1"/><rect x="363" y="165" width="5" height="4" rx="1" fill="#fafafa" stroke="#777" stroke-width="1"/><rect x="356" y="170" width="5" height="4" rx="1" fill="#fafafa" stroke="#777" stroke-width="1"/><rect x="349" y="175" width="5" height="4" rx="1" fill="#fafafa" stroke="#777" stroke-width="1"/><path d="M324 164 q -6 -8 0 -16 q 6 -8 0 -16" fill="none" stroke="#999" stroke-width="2"/><path d="M346 164 q -6 -8 0 -16 q 6 -8 0 -16" fill="none" stroke="#999" stroke-width="2"/><text x="340" y="202" font-size="10.5" fill="#1d4f80" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">água fria</text><text x="402" y="164" font-size="10.5" fill="#222" font-weight="bold" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">soda</text><text x="244" y="226" font-size="11.5" fill="#222" text-anchor="start">Ao ar livre, de óculos e luvas.</text><text x="244" y="241" font-size="11.5" fill="#222" text-anchor="start">Esquenta a ~90 °C e solta</text><text x="244" y="256" font-size="11.5" fill="#222" text-anchor="start">vapor: não respire. Esfrie.</text>
<rect x="460" y="98" width="212" height="182" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/><circle cx="478" cy="118" r="12" fill="#1e1e1e"/><text x="478" y="123" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="496" y="123" font-size="13.5" fill="#222" font-weight="bold" text-anchor="start">Junte devagar</text><path d="M500 164 L 506 214 L 610 214 L 616 164 Z" fill="#fff" stroke="#1e1e1e" stroke-width="2.5"/><path d="M502 178 L 506 214 L 610 214 L 614 178 Z" fill="#f6dd84"/><g transform="rotate(35 630 154)"><rect x="612" y="138" width="34" height="40" rx="4" fill="#fff" stroke="#1e1e1e" stroke-width="2"/><rect x="614" y="154" width="30" height="22" fill="#cfe6fb"/></g><path d="M610 160 Q 600 164 596 178" fill="none" stroke="#4a90d9" stroke-width="3"/><text x="556" y="202" font-size="10.5" fill="#6b4a00" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">óleo 40–50 °C</text><text x="628" y="134" font-size="10.5" fill="#1d4f80" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">lixívia</text><text x="470" y="226" font-size="11.5" fill="#222" text-anchor="start">Lixívia e óleo ambos a</text><text x="470" y="241" font-size="11.5" fill="#222" text-anchor="start">40–50 °C. Despeje a lixívia</text><text x="470" y="256" font-size="11.5" fill="#222" text-anchor="start">em fio no óleo, mexendo.</text>
<rect x="8" y="290" width="212" height="182" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/><circle cx="26" cy="310" r="12" fill="#1e1e1e"/><text x="26" y="315" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="44" y="315" font-size="13.5" fill="#222" font-weight="bold" text-anchor="start">Mexa até o traço</text><path d="M48 356 L 54 406 L 158 406 L 164 356 Z" fill="#fff" stroke="#1e1e1e" stroke-width="2.5"/><path d="M50 368 L 54 406 L 158 406 L 162 368 Z" fill="#f3e6b8"/><path d="M70 370 q 14 -5 28 0 q 14 5 28 0" fill="none" stroke="#c9b26a" stroke-width="3"/><rect x="136" y="324" width="10" height="44" rx="4" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="2" transform="rotate(20 141 346)"/><ellipse cx="128" cy="370" rx="12" ry="5" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="2"/><path d="M128 376 L 128 386" stroke="#c9b26a" stroke-width="3"/><text x="78" y="340" font-size="10.5" fill="#222" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">o "fio" que cai</text><text x="78" y="352" font-size="10.5" fill="#222" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">fica marcado</text><text x="18" y="418" font-size="11.5" fill="#222" text-anchor="start">15 min a 2 h (à mão, mexa</text><text x="18" y="433" font-size="11.5" fill="#222" text-anchor="start">5 min, descanse 10). Ponto de</text><text x="18" y="448" font-size="11.5" fill="#222" text-anchor="start">mingau ralo, que marca.</text>
<rect x="234" y="290" width="212" height="182" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/><circle cx="252" cy="310" r="12" fill="#1e1e1e"/><text x="252" y="315" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="270" y="315" font-size="13.5" fill="#222" font-weight="bold" text-anchor="start">Forma 24–48 h</text><path d="M290 360 L 290 406 L 390 406 L 390 360" fill="#fff" stroke="#1e1e1e" stroke-width="2.5"/><rect x="292" y="372" width="96" height="32" fill="#f6eecb"/><path d="M280 354 Q 340 334 400 354" fill="none" stroke="#7a8fa6" stroke-width="5"/><text x="340" y="394" font-size="10.5" fill="#222" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">caixa de leite</text><text x="340" y="336" font-size="10.5" fill="#3f6d9e" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">pano por cima</text><text x="244" y="418" font-size="11.5" fill="#222" text-anchor="start">Forma de plástico, madeira</text><text x="244" y="433" font-size="11.5" fill="#222" text-anchor="start">forrada ou caixa de leite.</text><text x="244" y="448" font-size="11.5" fill="#222" text-anchor="start">Desenforme e corte em barras.</text>
<rect x="460" y="290" width="212" height="182" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/><circle cx="478" cy="310" r="12" fill="#1e1e1e"/><text x="478" y="315" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="496" y="315" font-size="13.5" fill="#222" font-weight="bold" text-anchor="start">Cure 4–6 semanas</text><rect x="490" y="398" width="150" height="8" fill="#8b5a2b" stroke="#1e1e1e" stroke-width="2"/><rect x="496" y="376" width="20" height="22" rx="3" fill="#f6eecb" stroke="#1e1e1e" stroke-width="2"/><rect x="525" y="376" width="20" height="22" rx="3" fill="#f6eecb" stroke="#1e1e1e" stroke-width="2"/><rect x="554" y="376" width="20" height="22" rx="3" fill="#f6eecb" stroke="#1e1e1e" stroke-width="2"/><rect x="583" y="376" width="20" height="22" rx="3" fill="#f6eecb" stroke="#1e1e1e" stroke-width="2"/><rect x="612" y="376" width="20" height="22" rx="3" fill="#f6eecb" stroke="#1e1e1e" stroke-width="2"/><rect x="530" y="330" width="70" height="38" rx="4" fill="#fff" stroke="#1e1e1e" stroke-width="2"/><rect x="530" y="330" width="70" height="10" fill="#d62828"/><text x="565" y="362" font-size="11" fill="#222" font-weight="bold" text-anchor="middle">4–6 sem.</text><text x="470" y="418" font-size="11.5" fill="#222" text-anchor="start">Sombra, seco, ventilado,</text><text x="470" y="433" font-size="11.5" fill="#222" text-anchor="start">barras separadas. Só use</text><text x="470" y="448" font-size="11.5" fill="#222" text-anchor="start">depois do teste de pH.</text>
<line x1="220" y1="188" x2="230.0" y2="188.0" stroke="#555" stroke-width="3"/><polygon points="236,188 225.2,193.2 225.2,182.8" fill="#555"/>
<line x1="446" y1="188" x2="456.0" y2="188.0" stroke="#555" stroke-width="3"/><polygon points="462,188 451.2,193.2 451.2,182.8" fill="#555"/>
<line x1="446" y1="380" x2="456.0" y2="380.0" stroke="#555" stroke-width="3"/><polygon points="462,380 451.2,385.2 451.2,374.8" fill="#555"/>
<line x1="220" y1="380" x2="230.0" y2="380.0" stroke="#555" stroke-width="3"/><polygon points="236,380 225.2,385.2 225.2,374.8" fill="#555"/>
<path d="M566 280 L 566 285 L 114 285 L 114 287" fill="none" stroke="#555" stroke-width="3"/>
<rect x="8" y="482" width="664" height="112" rx="8" fill="#fdecec" stroke="#d62828" stroke-width="1.5"/>
<text x="20" y="502" font-size="14" fill="#b3001b" font-weight="bold" text-anchor="start">SEGURANÇA (soda cáustica cega e queima)</text>
<text x="20" y="522" font-size="12" fill="#222" text-anchor="start">• Óculos (ou máscara de solda/vidro), luvas de borracha, manga comprida, sapato fechado.</text>
<text x="20" y="539" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">• SEMPRE a soda na água fria, aos poucos. NUNCA água sobre a soda (ferve e espirra).</text>
<text x="20" y="556" font-size="12" fill="#222" text-anchor="start">• Use plástico PP (nº 5), inox, vidro grosso ou barro. NUNCA alumínio (reage e solta gás que pega fogo).</text>
<text x="20" y="573" font-size="12" fill="#b3001b" font-weight="bold" text-anchor="start">• Respingo no olho: água corrente 15–20 min, pálpebras abertas. NÃO use vinagre.</text>
<text x="20" y="590" font-size="12" fill="#222" text-anchor="start">• Na pele: muita água por 15 min. Crianças e animais longe. Guarde a soda fechada e rotulada.</text>
</svg>
