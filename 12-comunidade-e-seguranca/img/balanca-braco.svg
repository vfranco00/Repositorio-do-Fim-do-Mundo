<line x1="362" y1="96" x2="362" y2="112" stroke="#2b8a3e" stroke-width="2"/>
<text x="137" y="96" font-size="12.5" fill="#2b8a3e" font-weight="bold" text-anchor="middle">45 cm</text>
<text x="287" y="96" font-size="12.5" fill="#2b8a3e" font-weight="bold" text-anchor="middle">45 cm</text>
<text x="212" y="66" font-size="12" fill="#2b8a3e" font-weight="bold" text-anchor="middle">distâncias IGUAIS (meça com barbante)</text>
<text x="196" y="230" font-size="11" fill="#222" font-weight="bold" text-anchor="end">fiel (ponteiro)</text>
<text x="196" y="244" font-size="11" fill="#222" font-weight="bold" text-anchor="end">na marca =</text>
<text x="196" y="258" font-size="11" fill="#222" font-weight="bold" text-anchor="end">equilíbrio</text>
<text x="230" y="164" font-size="11" fill="#222" text-anchor="start">prego (eixo) num</text>
<text x="230" y="178" font-size="11" fill="#222" text-anchor="start">furo um pouco</text>
<text x="230" y="192" font-size="11" fill="#222" font-weight="bold" text-anchor="start">ACIMA do meio</text>
<text x="230" y="206" font-size="11" fill="#222" font-weight="bold" text-anchor="start">da ripa</text>
<text x="16" y="330" font-size="11" fill="#333" text-anchor="start">garrafa vazia IGUAL</text>
<text x="16" y="343" font-size="11" fill="#333" text-anchor="start">(desconta o plástico)</text>
<text x="318" y="330" font-size="11" fill="#333" text-anchor="start">garrafa de 1 L</text>
<text x="318" y="343" font-size="11" fill="#333" text-anchor="start">cheia d'água</text>
<text x="14" y="438" font-size="12" fill="#222" font-weight="bold" text-anchor="start">arroz + garrafa vazia = garrafa cheia: 1 kg de arroz</text>
<text x="14" y="455" font-size="11.5" fill="#444" text-anchor="start">Ripa reta de madeira dura (~1 m), pratos iguais, 3 cordões iguais.</text>
<rect x="418" y="52" width="248" height="196" rx="8" fill="#eef7ff" stroke="#3f6d9e" stroke-width="1.5"/>
<text x="430" y="74" font-size="13.5" fill="#222" font-weight="bold" text-anchor="start">Como conferir</text>
<text x="430" y="96" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">1. Vazia: o fiel para na</text>
<text x="430" y="111" font-size="11.5" fill="#222" text-anchor="start">marca. Se não, cole fita,</text>
<text x="430" y="126" font-size="11.5" fill="#222" text-anchor="start">massa ou um prego no</text>
<text x="430" y="141" font-size="11.5" fill="#222" text-anchor="start">lado mais leve.</text>
<text x="430" y="163" font-size="11.5" fill="#222" font-weight="bold" text-anchor="start">2. Pese algo e TROQUE os</text>
<text x="430" y="178" font-size="11.5" fill="#222" text-anchor="start">pratos de lado. Tem que</text>
<text x="430" y="193" font-size="11.5" fill="#222" text-anchor="start">equilibrar igual. Se não,</text>
<text x="430" y="208" font-size="11.5" fill="#222" text-anchor="start">os braços estão desiguais:</text>
<text x="430" y="223" font-size="11.5" fill="#222" text-anchor="start">refaça os furos.</text>
<rect x="418" y="260" width="248" height="196" rx="8" fill="#fff4e5" stroke="#ef8a2b" stroke-width="1.5"/>
<text x="430" y="282" font-size="13.5" fill="#222" font-weight="bold" text-anchor="start">Pesos-padrão</text>
<text x="430" y="304" font-size="12" fill="#222" font-weight="bold" text-anchor="start">1 litro de água = 1 kg</text>
<text x="430" y="320" font-size="11.5" fill="#222" text-anchor="start">2 L = 2 kg · 500 mL = 500 g</text>
<text x="430" y="340" font-size="11.5" fill="#222" text-anchor="start">Moeda de R$ 1 (dourada e</text>
<text x="430" y="355" font-size="11.5" fill="#222" text-anchor="start">prateada) = 7 g; 10 moedas</text>
<text x="430" y="370" font-size="11.5" fill="#222" text-anchor="start">= 70 g</text>
<text x="430" y="392" font-size="11.5" fill="#222" text-anchor="start">Faça pesos de pedra: pese</text>
<text x="430" y="407" font-size="11.5" fill="#222" text-anchor="start">contra a garrafa e marque</text>
<text x="430" y="422" font-size="11.5" fill="#222" text-anchor="start">(1 kg, 500 g, 250 g, 100 g).</text>
<text x="430" y="442" font-size="11.5" fill="#444" text-anchor="start">Precisão: ~1 a 2%.</text>
</svg>
